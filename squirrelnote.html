  }

  // ---- photos (stored on the note as resized JPEG data URIs, on-device) ----
  function persistSafe() { try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); syncSoon(); shareOutSoon(); return true; } catch (e) { return false; } }
  // Downscale in-browser so photos fit in local storage and load fast.
  function fileToScaledDataURL(file, maxDim, quality) {
    maxDim = maxDim || 1400; quality = quality || 0.72;
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        try { resolve(cv.toDataURL("image/jpeg", quality)); } catch (e) { reject(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }
  async function addPhotos(n, files) {
    n.photos = n.photos || [];
    let added = 0;
    for (const f of files) {
      if (!f || !f.type || f.type.indexOf("image/") !== 0) continue;
      try { n.photos.push(await fileToScaledDataURL(f)); added++; } catch (e) {}
    }
    if (!added) return;
    touch(n);
    if (!persistSafe()) {
      n.photos.splice(n.photos.length - added, added); persistSafe();
      alert("Not enough room in this browser to store that photo. Photos are saved on your device — try fewer or smaller ones, or remove some.");
    }
    renderPhotos(n); renderList();
  }
  function renderPhotos(n) {
    const ph = $("#photos"); if (!ph) return;
    const list = n.photos || [];
    ph.innerHTML = list.map((src, i) => `<div class="photo"><img src="${src}" data-viewphoto="${i}" alt="attachment" /><button class="photo-del" data-delphoto="${i}" aria-label="Remove photo">✕</button></div>`).join("")
      + `<button class="photo-add" id="addPhoto" type="button">📷<span>Add</span></button>`;
    $("#addPhoto").onclick = () => openPhotoAttachPopover();
    ph.querySelectorAll("[data-viewphoto]").forEach((el) => el.addEventListener("click", () => openPhoto((n.photos || [])[+el.dataset.viewphoto])));
    ph.querySelectorAll("[data-delphoto]").forEach((el) => el.addEventListener("click", () => {
      n.photos.splice(+el.dataset.delphoto, 1); touch(n); persistSafe(); renderPhotos(n); renderList();
    }));
  }
  // Same camera-vs-library choice as the scrapbook photo button (see
  // openPhotoSourcePopover), for the separate photo-attachment strip. This
  // one toggles the `capture` attribute on the strip's own #photoInput
  // (which supports picking several photos at once from the library) rather
  // than creating a throwaway input, since #photoInput already exists.
  function closePhotoAttachPopover() { const p = document.querySelector("#photos .photopop"); if (p) p.remove(); }
  function openPhotoAttachPopover() {
    const ph = $("#photos"); if (!ph) return;
    if (ph.querySelector(".photopop")) { closePhotoAttachPopover(); return; }
    const pop = document.createElement("div");
    pop.className = "hlpop photopop";
    pop.innerHTML = `<button type="button" class="photopop-btn" data-cam>📷 Take photo</button><button type="button" class="photopop-btn" data-lib>🖼️ Choose from library</button>`;
    ph.appendChild(pop);
    pop.querySelector("[data-cam]").addEventListener("mousedown", (e) => { e.preventDefault(); e.stopPropagation(); closePhotoAttachPopover(); openPhotoAttachInput(true); });
    pop.querySelector("[data-lib]").addEventListener("mousedown", (e) => { e.preventDefault(); e.stopPropagation(); closePhotoAttachPopover(); openPhotoAttachInput(false); });
    setTimeout(() => {
      const onOutside = (e) => {
        if (pop.contains(e.target)) return;
        closePhotoAttachPopover();
        document.removeEventListener("mousedown", onOutside, true);
      };
      document.addEventListener("mousedown", onOutside, true);
    }, 0);
  }
  function openPhotoAttachInput(useCamera) {
    const pin = $("#photoInput"); if (!pin) return;
    // The camera only ever hands back one photo per shot, so multi-select
    // (only meaningful for the library) is switched off while it's set.
    if (useCamera) { pin.setAttribute("capture", "environment"); pin.removeAttribute("multiple"); }
    else { pin.removeAttribute("capture"); pin.setAttribute("multiple", ""); }
    pin.click();
  }
  function openPhoto(src) {
    if (!src) return;
    const o = document.createElement("div"); o.className = "lightbox";
    o.innerHTML = `<img src="${src}" alt="photo" /><button class="lb-close" aria-label="Close">✕</button>`;
    o.onclick = () => o.remove();
    document.body.appendChild(o);
  }

  // ---- reminders (per note; fire while open + catch up any that passed) ----
  let reminderTimers = [];
  const pad2 = (x) => String(x).padStart(2, "0");

      <div class="chk-controls">
        <label class="repeat-ctl">🔁 Repeats
          <select id="repeatSel"><option value="none">Off</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option><option value="biweekly">Biweekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select>
        </label>
        ${n.repeat && n.repeat !== "none" && noteStreakCount(n) > 0 ? `<span class="routine-streak">🔥 ${noteStreakCount(n)}-${n.repeat === "weekly" ? "week" : n.repeat === "biweekly" ? "cycle" : n.repeat === "monthly" ? "month" : n.repeat === "yearly" ? "year" : "day"} streak</span>` : ""}
        <button class="link" id="focusBtn" style="margin:0">🎯 Focus</button>
        <button class="link" id="saveTplBtn" style="margin:0">⤓ Save as routine</button>
        ${done > 0 ? `<button class="link" id="resetChkBtn" style="margin:0">↺ Reset</button>` : ""}
        ${n.kind === "brainstorm" ? `<button class="link" id="bsMapBtn" style="margin:0">🕸️ View as map</button>` : ""}
        ${scheduleFieldsHTML("ckSched", n.repeat, scheduleOf(n))}
      </div>
      ${items.length ? `<div class="progress-wrap"><div class="progress ${allDone ? "done" : ""}"><span style="width:${(done / items.length) * 100}%"></span></div><span class="progress-num">${allDone ? "All gathered! 🌰" : done + "/" + items.length}</span></div>` : ""}
      <div class="chk">
        <div class="items" id="items">
          ${items.map((it) => {
            const subs = it.sub || [];
            const dn = itemDone(it);
            const open = openSteps.has(it.id) || subs.length > 0;
            const subrows = subs.map((s) => `
              <div class="subitem ${s.checked ? "done" : ""}">
                <button class="check sub" data-subtoggle="${it.id}|${s.id}" aria-label="Toggle step">${ACORN(s.checked)}</button>
                <input class="item-text" data-subtext="${it.id}|${s.id}" value="${esc(s.text)}" />
                <button class="item-del" data-subdel="${it.id}|${s.id}" aria-label="Remove step">✕</button>
              </div>`).join("");
            return `
            <div class="item ${dn ? "done" : ""}" data-id="${it.id}">
              <span class="grip" title="Drag to reorder">⠿</span>
              <button class="check" data-toggle="${it.id}" aria-label="Toggle">${ACORN(dn)}</button>
              <input class="item-text" data-text="${it.id}" value="${esc(it.text)}" />
              <button class="stepbtn ${open ? "on" : ""}" data-steps="${it.id}" title="Break into steps">⤵${subs.length ? `<span class="stepn">${subs.filter((s) => s.checked).length}/${subs.length}</span>` : ""}</button>
              <button class="item-del" data-del="${it.id}" aria-label="Remove">✕</button>
            </div>
            ${open ? `<div class="substeps">${subrows}<div class="addsub"><span class="plus">＋</span><input data-addsub="${it.id}" placeholder="Add a step…" /></div></div>` : ""}`;
          }).join("")}
        </div>
        <div class="additem"><span class="plus">＋</span><input id="newItem" placeholder="Add an item…" /></div>
      </div>
      ${showBulk ? `
        <div class="bulk">
          <textarea id="bulkText" placeholder="Paste or type anything — turn each line into a to-do."></textarea>
          <div class="bulk-actions"><button class="btn-sm accent" id="bulkSplit">Split into to-dos</button><button class="btn-sm" id="bulkCancel">Cancel</button></div>
        </div>` : `<button class="link" id="showBulk">＋ Add from text…</button>`}
    `;
    // Checked items sink below the still-open ones (stable sort keeps each
    // group's relative order), so the top of the list is always what's left to do.
    const sinkDone = () => items.sort((a, b) => (itemDone(a) ? 1 : 0) - (itemDone(b) ? 1 : 0));
    // toggle a top-level item (also flips all its sub-steps)
    $("#body").querySelectorAll("[data-toggle]").forEach((el) => el.addEventListener("click", () => {
      const it = items.find((x) => x.id === el.dataset.toggle);
      const wasAll = items.length > 0 && items.every(itemDone);
      const nowDone = !itemDone(it);
      if (it.sub && it.sub.length) it.sub.forEach((s) => (s.checked = nowDone));
      it.checked = nowDone;
      if (nowDone) bumpStat();
      sinkDone();
      commit(wasAll);
    }));
    // toggle a single sub-step
    $("#body").querySelectorAll("[data-subtoggle]").forEach((el) => el.addEventListener("click", () => {
      const [iid, sid] = el.dataset.subtoggle.split("|");
      const it = items.find((x) => x.id === iid); const s = (it.sub || []).find((x) => x.id === sid);
      const wasAll = items.length > 0 && items.every(itemDone);
      s.checked = !s.checked; it.checked = it.sub.every((z) => z.checked);
      if (s.checked) bumpStat();
      sinkDone();
      commit(wasAll);
    }));
    $("#body").querySelectorAll("[data-del]").forEach((el) => el.addEventListener("click", () => { n.items = items.filter((x) => x.id !== el.dataset.del); touch(n); saveSoon(); renderChecklist(n); refreshCard(n.id); }));
    $("#body").querySelectorAll("[data-subdel]").forEach((el) => el.addEventListener("click", () => {
      const [iid, sid] = el.dataset.subdel.split("|");
      const it = items.find((x) => x.id === iid); it.sub = (it.sub || []).filter((x) => x.id !== sid);
      if (it.sub.length) it.checked = it.sub.every((z) => z.checked);
      touch(n); saveSoon(); renderChecklist(n); refreshCard(n.id);
    }));
    $("#body").querySelectorAll("[data-text]").forEach((el) => el.addEventListener("input", () => { const it = items.find((x) => x.id === el.dataset.text); it.text = el.value; touch(n); saveSoon(); flashSaving(); }));
    $("#body").querySelectorAll("[data-subtext]").forEach((el) => el.addEventListener("input", () => {
      const [iid, sid] = el.dataset.subtext.split("|");
      const it = items.find((x) => x.id === iid); const s = (it.sub || []).find((x) => x.id === sid);
      if (s) { s.text = el.value; touch(n); saveSoon(); flashSaving(); }
    }));
    // "break it down" — reveal/hide the sub-step panel for an item
    $("#body").querySelectorAll("[data-steps]").forEach((el) => el.addEventListener("click", () => {
      const id = el.dataset.steps;
      if (openSteps.has(id)) openSteps.delete(id); else openSteps.add(id);
      renderChecklist(n);
      const inp = $(`[data-addsub="${id}"]`); if (inp) inp.focus();
    }));
    $("#body").querySelectorAll("[data-addsub]").forEach((el) => el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && el.value.trim()) {
        const it = items.find((x) => x.id === el.dataset.addsub);
        it.sub = it.sub || []; it.sub.push({ id: uid(), text: el.value.trim(), checked: false });
        it.checked = it.sub.every((z) => z.checked);
        openSteps.add(it.id); touch(n); saveSoon(); renderChecklist(n); refreshCard(n.id);
        const inp = $(`[data-addsub="${it.id}"]`); if (inp) inp.focus();
      }
    }));
    const ni = $("#newItem");
    if (ni) ni.addEventListener("keydown", (e) => { if (e.key === "Enter" && ni.value.trim()) { n.items = [...items, { id: uid(), text: ni.value.trim(), checked: false }]; touch(n); saveSoon(); renderChecklist(n); refreshCard(n.id); $("#newItem").focus(); } });
    const sb = $("#showBulk"); if (sb) sb.onclick = () => { showBulk = true; renderChecklist(n); $("#bulkText").focus(); };
    const bc = $("#bulkCancel"); if (bc) bc.onclick = () => { showBulk = false; renderChecklist(n); };
    const bs = $("#bulkSplit"); if (bs) bs.onclick = () => {
      const lines = $("#bulkText").value.split(/\r?\n/).map((l) => l.replace(/^[-*\[\]xX\d.)\s]+/, "").trim()).filter(Boolean);
      if (lines.length) { n.items = [...items, ...lines.map((text) => ({ id: uid(), text, checked: false }))]; touch(n); saveSoon(); }
      showBulk = false; renderChecklist(n); refreshCard(n.id);
    };
    // The #body element persists across many renderChecklist() calls (every
    // toggle/add/edit re-renders it), and enableDragReorder only wires its
    // pointerdown listener once per element — so this callback must never
    // close over this render's local `items`/`n`, or a later drag would act
    // on a stale (possibly empty, possibly a different note's) snapshot.
    // Always look up the live, currently-selected note instead.
    enableDragReorder($("#body"), ".item", ".grip", (from, to) => {
      const cur = selected(); if (!cur) return;
      const arr = (cur.items || []).slice();
      const [m] = arr.splice(from, 1); if (m === undefined) return;
      arr.splice(to, 0, m);
      cur.items = arr; touch(cur); saveSoon(); renderChecklist(cur); refreshCard(cur.id);
    });
    const rs = $("#repeatSel");
    if (rs) {
      rs.value = n.repeat || "none";
      rs.onchange = () => {
        n.repeat = rs.value; n.lastReset = periodKey(rs.value, scheduleOf(n));
        touch(n); saveSoon(); refreshCard(n.id); renderChecklist(n);
      };
    }
    wireScheduleFields("ckSched", (patch) => {
      Object.assign(n, patch); n.lastReset = periodKey(n.repeat, scheduleOf(n));
      touch(n); saveSoon(); scheduleReminders();
    });
    const fb = $("#focusBtn");
    if (fb) fb.onclick = () => { if ((n.items || []).some((it) => !itemDone(it))) openFocus(n); else toast("Nothing left to focus on 🎉"); };
    const stb = $("#saveTplBtn");
    if (stb) stb.onclick = () => { saveTemplate(n); stb.textContent = "✓ Saved as routine!"; setTimeout(() => { const b = $("#saveTplBtn"); if (b) b.textContent = "⤓ Save as routine"; }, 1400); };
    const rcb = $("#resetChkBtn");
    if (rcb) rcb.onclick = () => {
      if (!confirm("Uncheck everything on this list?")) return;
      (n.items || []).forEach((it) => { it.checked = false; (it.sub || []).forEach((s) => (s.checked = false)); });
      touch(n); saveSoon(); renderChecklist(n); refreshCard(n.id);
    };
    const mb = $("#bsMapBtn");
    if (mb) mb.onclick = () => { n.bsView = "map"; touch(n); saveSoon(); renderBrainstorm(n); refreshCard(n.id); };
  }
  function updateMini(id) { refreshCard(id); }

  // ---- brainstorm map ----
  // bsNodes: [{ id, text, parentId }] -- branches only; the root idea is
  // n.title itself. Depth is capped at 2 (branch, then one level of
  // sub-branch) so the tree maps losslessly onto the checklist's own
  // item/sub-item structure when converted with "Make list".
  let bsEditingId = null; // node currently showing as an editable input
  let bsPanX = 0, bsPanY = 0; // transient pan offset, not persisted
  let bsScale = 1; // transient zoom level, not persisted
  const BS_MIN_SCALE = 0.5, BS_MAX_SCALE = 2.5;
  const bsClampScale = (s) => Math.max(BS_MIN_SCALE, Math.min(BS_MAX_SCALE, s));

  // No depth limit -- a branch can keep sprouting branches of its own.
  // Each generation continues outward along the same ray its parent started
  // (angle is inherited down the chain), just a fixed step further out, so
  // arbitrarily deep chains fan out from the root instead of doubling back.
  function bsLayout(n) {
    const nodes = n.bsNodes || [];
    const top = nodes.filter((b) => !b.parentId);
    const pos = {};
    const R1 = 150;
    // Fan branches upward/outward from the root, growing the arc as more
    // branches arrive (capped at 280°) rather than spacing them evenly
    // around a full circle -- an even 2-around-a-circle split lands both
    // branches directly above/below the root at the same x, which draws
    // every connecting line on top of the last one.
    const arc = (Math.min(280, 40 + 60 * Math.max(top.length - 1, 0)) * Math.PI) / 180;
    const half = arc / 2;
    top.forEach((b, i) => {
      const t = top.length <= 1 ? 0.5 : i / (top.length - 1);
      const angle = -Math.PI / 2 - half + arc * t;
      pos[b.id] = { x: Math.cos(angle) * R1, y: Math.sin(angle) * R1, angle };
    });
    // Children of any branch: a straight perpendicular stack past the
    // parent, spaced by a fixed pixel step -- not a narrow angular fan. A
    // fan's spacing shrinks as it nears the parent (arc length = radius ×
    // angle), so it was letting sibling bubbles overlap the moment their
    // text wrapped to two lines. The step has to clear a bubble's full
    // WIDTH, not just its height: the perpendicular direction is only
    // sometimes vertical, and whenever it's closer to horizontal the two
    // bubbles sit side by side.
    const R2 = 118, STEP = 172;
    function layoutChildrenOf(parentId) {
      const kids = nodes.filter((k) => k.parentId === parentId);
      if (!kids.length) return;
      const p = pos[parentId];
      const dirx = Math.cos(p.angle), diry = Math.sin(p.angle);
      const perpx = -diry, perpy = dirx;
      const baseX = p.x + dirx * R2, baseY = p.y + diry * R2;
      kids.forEach((k, j) => {
        const offset = (j - (kids.length - 1) / 2) * STEP;
        pos[k.id] = { x: baseX + perpx * offset, y: baseY + perpy * offset, angle: p.angle };
        layoutChildrenOf(k.id);
      });
    }
    top.forEach((b) => layoutChildrenOf(b.id));
    return pos;
  }

  function bsLinePath(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + (b.x - a.x) * 0.12;
    return `<path class="bs-line" d="M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}" />`;
  }

  function bsNodeHTML(node, p, isRoot) {
    const editing = !isRoot && bsEditingId === node.id;
    const cls = isRoot ? "bs-node bs-node-root" : "bs-node bs-node-branch";
    const inner = editing
      ? `<input data-bsedit="${node.id}" value="${esc(node.text)}" placeholder="Type an idea…" />`
      : isRoot ? (esc(node.text) || "Untitled") : (esc(node.text) || `<span style="opacity:.45">…</span>`);
    const del = isRoot ? "" : `<span class="bs-del" data-bsdel="${node.id}" title="Remove">✕</span>`;
    return `<div class="${cls}" style="left:calc(50% + ${p.x}px); top:calc(50% + ${p.y}px)" ${isRoot ? "" : `data-bsnode="${node.id}"`}>${inner}${del}</div>`;
  }

  function bsAddBtnHTML(parentId, p, angle, dist) {
    const x = p.x + Math.cos(angle) * dist, y = p.y + Math.sin(angle) * dist;
    return `<div class="bs-node bs-add" data-bsadd="${parentId}" style="left:calc(50% + ${x}px); top:calc(50% + ${y}px)" title="Add a branch">+</div>`;
  }

  function positionBrainstormLayers() {
    const svg = $("#bsLines"), layer = $("#bsNodesLayer");
    const t = `translate(${bsPanX}px, ${bsPanY}px) scale(${bsScale})`;
    if (svg) svg.style.transform = t;
    if (layer) layer.style.transform = t;
    const zl = $("#bsZoomLbl"); if (zl) zl.textContent = Math.round(bsScale * 100) + "%";
  }

  // Every node gets its own add button, at any depth -- a branch can keep
  // sprouting branches of its own with no fixed limit.
  function bsSubtreeHTML(nodes, pos, parentId) {
    let html = "";
    nodes.filter((k) => k.parentId === parentId).forEach((k) => {
      html += bsNodeHTML(k, pos[k.id], false);
      html += bsAddBtnHTML(k.id, pos[k.id], pos[k.id].angle, 50);
      html += bsSubtreeHTML(nodes, pos, k.id);
    });
    return html;
  }

  function drawBrainstormCanvas(n) {
    const canvas = $("#bsCanvas"), svg = $("#bsLines"), layer = $("#bsNodesLayer");
    if (!canvas || !svg || !layer) return;
    const w = canvas.clientWidth || 340, h = canvas.clientHeight || 320;
    svg.setAttribute("viewBox", `${-w / 2} ${-h / 2} ${w} ${h}`);
    const nodes = n.bsNodes || [];
    const top = nodes.filter((b) => !b.parentId);
    const pos = bsLayout(n);

    let lines = "";
    top.forEach((b) => { lines += bsLinePath({ x: 0, y: 0 }, pos[b.id]); });
    nodes.forEach((b) => { if (b.parentId && pos[b.parentId] && pos[b.id]) lines += bsLinePath(pos[b.parentId], pos[b.id]); });
    svg.innerHTML = lines;

    let html = bsNodeHTML({ id: "root", text: n.title }, { x: 0, y: 0 }, true);
    html += bsAddBtnHTML("root", { x: 0, y: 0 }, -Math.PI / 2, 66);
    html += bsSubtreeHTML(nodes, pos, null);
    if (!top.length) html += `<div class="bs-empty">Add your first idea — tap the ⊕ below the topic.</div>`;
    layer.innerHTML = html;
    positionBrainstormLayers();
    wireBrainstormNodes(n);
  }

  function wireBrainstormNodes(n) {
    const layer = $("#bsNodesLayer"); if (!layer) return;
    layer.querySelectorAll("[data-bsadd]").forEach((el) => el.addEventListener("click", (e) => {
      e.stopPropagation();
      const parentId = el.dataset.bsadd === "root" ? null : el.dataset.bsadd;
      const node = { id: uid(), text: "", parentId };
      n.bsNodes = [...(n.bsNodes || []), node];
      bsEditingId = node.id;
      touch(n); saveSoon();
      renderBrainstormMap(n);
    }));
    layer.querySelectorAll("[data-bsdel]").forEach((el) => el.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = el.dataset.bsdel;
      // Deleting a branch takes its whole sub-tree with it, however deep.
      const doomed = new Set([id]);
      let grew = true;
      while (grew) {
        grew = false;
        (n.bsNodes || []).forEach((b) => {
          if (b.parentId && doomed.has(b.parentId) && !doomed.has(b.id)) { doomed.add(b.id); grew = true; }
        });
      }
      n.bsNodes = (n.bsNodes || []).filter((b) => !doomed.has(b.id));
      touch(n); saveSoon();
      renderBrainstormMap(n);
    }));
    layer.querySelectorAll("[data-bsnode]").forEach((el) => el.addEventListener("click", (e) => {
      if (e.target.closest("[data-bsdel]")) return;
      const id = el.dataset.bsnode;
      if (bsEditingId === id) return;
      bsEditingId = id;
      drawBrainstormCanvas(n);
    }));
    const input = layer.querySelector("[data-bsedit]");
    if (input) {
      input.focus(); input.select();
      let done = false;
      const finish = (save) => {
        if (done) return; done = true;
        const node = (n.bsNodes || []).find((b) => b.id === input.dataset.bsedit);
        if (node) {
          const val = input.value.trim();
          if (save && val) node.text = val;
          else if (!node.text) n.bsNodes = n.bsNodes.filter((b) => b.id !== node.id);
        }
        bsEditingId = null;
        touch(n); saveSoon();
        renderBrainstormMap(n);
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        if (e.key === "Escape") { e.preventDefault(); finish(false); }
      });
      input.addEventListener("blur", () => finish(true));
    }
  }

  // Centers the pan on wherever the tree actually is, instead of always on
  // the root -- once branches fan upward and outward, resetting pan to
  // (0,0) every render left new nodes clipped above the canvas's visible
  // (overflow: hidden) area until the user manually dragged to find them.
  function bsAutoCenter(n) {
    const pos = bsLayout(n);
    const pts = [{ x: 0, y: 0 }, ...Object.values(pos)];
    const margin = 90; // roughly a node's half-width/height plus its add-button
    const minX = Math.min(...pts.map((p) => p.x)) - margin;
    const maxX = Math.max(...pts.map((p) => p.x)) + margin;
    const minY = Math.min(...pts.map((p) => p.y)) - margin;
    const maxY = Math.max(...pts.map((p) => p.y)) + margin;
    bsPanX = -(minX + maxX) / 2;
    bsPanY = -(minY + maxY) / 2;
  }

  function renderBrainstormMap(n) {
    bsAutoCenter(n);
    bsScale = 1;
    const top = (n.bsNodes || []).filter((b) => !b.parentId);
    $("#body").innerHTML = `
      <div class="bs-toolbar">
        <span class="bs-hint">Tap ⊕ to branch off an idea</span>
        ${top.length ? `<button class="link" id="bsListBtn" style="margin:0">✓ Make list</button>` : ""}
      </div>
      <div class="bs-canvas" id="bsCanvas">
        <svg id="bsLines"></svg>
        <div class="bs-layer" id="bsNodesLayer"></div>
        <div class="bs-zoom">
          <button class="bs-zoom-btn" id="bsZoomIn" title="Zoom in" aria-label="Zoom in">+</button>
          <span class="bs-zoom-lbl" id="bsZoomLbl">100%</span>
          <button class="bs-zoom-btn" id="bsZoomOut" title="Zoom out" aria-label="Zoom out">−</button>
        </div>
      </div>`;
    drawBrainstormCanvas(n);
    const lb = $("#bsListBtn"); if (lb) lb.onclick = () => convertBrainstormToList(n);
    const canvas = $("#bsCanvas");

    const zoomBy = (factor) => { bsScale = bsClampScale(bsScale * factor); positionBrainstormLayers(); };
    const zi = $("#bsZoomIn"); if (zi) zi.onclick = () => zoomBy(1.25);
    const zo = $("#bsZoomOut"); if (zo) zo.onclick = () => zoomBy(1 / 1.25);

    // Pan (one finger/pointer) and pinch-zoom (two) share the same
    // pointer-capture tracking -- the pointer count decides which gesture
    // is in play, and going from two fingers back to one just resumes a
    // plain pan from wherever that finger is now.
    let dragging = false, lastX = 0, lastY = 0;
    const active = new Map(); // pointerId -> {x, y}
    let pinchStartDist = null, pinchStartScale = 1;

    canvas.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".bs-zoom")) return;
      // A single finger landing on a bubble must stay free to tap/edit it
      // (and its own click handler needs the real click, so we skip pointer
      // capture there) -- but a SECOND finger coming down, wherever it
      // lands, is unambiguously a pinch and must still count. Gating the
      // whole gesture on "did this touch start on a node" was blocking
      // real two-finger pinches that happen to start over the root bubble,
      // which fills most of the canvas on a small brainstorm.
      const onNode = !!e.target.closest(".bs-node");
      if (!onNode) canvas.setPointerCapture(e.pointerId);
      active.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (active.size === 2) {
        const [a, b] = [...active.values()];
        pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y);
        pinchStartScale = bsScale;
        dragging = false;
      } else if (active.size === 1 && !onNode) {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        canvas.classList.add("grabbing");
      }
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!active.has(e.pointerId)) return;
      active.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (active.size === 2 && pinchStartDist) {
        const [a, b] = [...active.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        bsScale = bsClampScale(pinchStartScale * (dist / pinchStartDist));
        positionBrainstormLayers();
        return;
      }
      if (dragging && active.size === 1) {
        bsPanX += e.clientX - lastX; bsPanY += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        positionBrainstormLayers();
      }
    });
    const stopDrag = (e) => {
      active.delete(e.pointerId);
      if (active.size < 2) pinchStartDist = null;
      if (active.size === 0) { dragging = false; canvas.classList.remove("grabbing"); }
    };
    canvas.addEventListener("pointerup", stopDrag);
    canvas.addEventListener("pointercancel", stopDrag);

    // Trackpad pinch (and ctrl+scroll) arrives as a wheel event; the canvas
    // has nothing else to do with a bare scroll, so any wheel zooms.
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoomBy(Math.exp(-e.deltaY * 0.0015));
    }, { passive: false });
  }

  function renderBrainstorm(n) {
    if (n.bsView === "list") renderChecklist(n);
    else renderBrainstormMap(n);

  // All descendants of a branch, at any depth, in the order each one was
  // reached going deeper before moving to the next sibling -- so a node
  // still lands right after its own children in the flattened result.
  function bsDescendants(nodes, id) {
    let out = [];
    nodes.filter((b) => b.parentId === id).forEach((child) => {
      out.push(child);
      out = out.concat(bsDescendants(nodes, child.id));
    });
    return out;
  }

  // Converts the branch tree into a real checklist, reusing renderChecklist
  // wholesale. IDs are shared between a bsNode and its resulting item/sub,
  // so re-running this after adding new branches merges in the new ones
  // without disturbing already-checked items. The map itself has no depth
  // limit, but a checklist only has one level of sub-items, so anything
  // past a top-level branch's direct children -- however many generations
  // deep -- flattens into that same sub-item list.
  function convertBrainstormToList(n) {
    const branches = (n.bsNodes || []).filter((b) => !b.parentId);
    if (!branches.length) return;
    n.items = n.items || [];
    branches.forEach((b) => {
      let item = n.items.find((it) => it.id === b.id);
      if (!item) { item = { id: b.id, text: b.text, checked: false, sub: [] }; n.items.push(item); }
      else item.text = b.text;
      item.sub = item.sub || [];
      bsDescendants(n.bsNodes || [], b.id).forEach((sb) => {
        let sub = item.sub.find((s) => s.id === sb.id);
        if (!sub) item.sub.push({ id: sb.id, text: sb.text, checked: false });
        else sub.text = sb.text;
      });
    });
    n.bsView = "list";
    touch(n); saveSoon();
    renderBrainstorm(n);
    refreshCard(n.id);
  }

  function celebrate() {
    if (prefs.lowStim) return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("#confetti"), ctx = cv.getContext("2d");
    const W = cv.width = innerWidth, H = cv.height = innerHeight;
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#f5793b";
    const colors = [accent, "#c1782f", "#6f9b57", "#e0a92e", "#a0522d", "#d98bb0", "#6fb0d4"];
    const cx = W * 0.62, cy = H * 0.32;
    const parts = Array.from({ length: 90 }, () => {
      const a = Math.random() * Math.PI * 2, sp = 5 + Math.random() * 9;
      return { x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6, g: 0.28 + Math.random() * 0.12,
        s: 5 + Math.random() * 6, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, c: colors[(Math.random() * colors.length) | 0], life: 1 };
    });
    let t = 0;
    (function frame() {
      t++; ctx.clearRect(0, 0, W, H);
      let alive = false;
      for (const p of parts) {
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vx *= 0.99; p.life -= 0.012;
        if (p.life > 0 && p.y < H + 40) { alive = true;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62); ctx.restore(); }
      }
      if (alive && t < 160) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    })();
  }

      tags: [], folder: filter.folder || null, color: null, pinned: false, created: now(), updated: now() };
    notes.unshift(n); selectedId = n.id; showBulk = false; persist(); renderNav(); renderList(); renderEditor(); setSelectedFlag();
  }
  function createNoteFromText(text, subject) {
    const subj = (subject || "").trim();
    let title, content;
    if (subj) { title = subj; content = text.trim(); }
    else {
      const lines = text.split(/\r?\n/);
      title = (lines[0] || "").trim().slice(0, 80) || dateTimeLabel();
      content = lines.length > 1 ? lines.slice(1).join("\n").trim() : "";
    }
    const n = { id: uid(), kind: "note", title, content, items: [],
      tags: [], folder: filter.folder || null, color: null, pinned: false, created: now(), updated: now() };
    notes.unshift(n); selectedId = n.id; persist(); renderNav(); renderList(); renderEditor(); setSelectedFlag();
  }
  function openQuickCapture(prefill) {
    const root = $("#modalRoot");
    root.innerHTML = `
      <div class="scrim" id="qcScrim"></div>
      <div class="qc">
        <h2>⚡ Quick capture</h2>
        <input  id="qcSubject" placeholder="Subject (optional — defaults to date &amp; time)" style="font-size:0.95rem;padding:.5rem .7rem" />
        <p class="fineprint" style="margin:0">Dump it all in — one thing per line, or comma-separated. Or skip the subject above and start with a name and “:” to title the list (e.g. <em>Groceries: milk, eggs, bread</em>).</p>
        <textarea id="qcText" placeholder="milk, eggs, bread&#10;call the dentist&#10;pay rent"></textarea>
        <div class="qc-row">
          <button class="btn-sm" id="qcMic">🎤 Speak</button>
          <button class="btn-sm" id="qcPaste">📋 Paste</button>
          <span style="flex:1"></span>
          <button class="btn-sm" id="qcCancel">Cancel</button>
          <button class="btn-sm" id="qcNote">Save as note</button>
          <button class="btn-sm accent" id="qcList">Make checklist <span class="kbd">⌘↵</span></button>
        </div>
      </div>`;
    const ta = $("#qcText"), subjEl = $("#qcSubject");
    if (prefill) ta.value = prefill;
    ta.focus();
    $("#qcScrim").onclick = closeSettings;
    $("#qcCancel").onclick = closeSettings;
    $("#qcPaste").onclick = async () => {
      try { const t = await navigator.clipboard.readText(); if (t) { ta.value = ta.value ? ta.value + "\n" + t : t; ta.focus(); } }
      catch (e) { alert("Couldn't read the clipboard here — paste with Ctrl/Cmd+V into the box instead."); }
    };
    // Voice-to-text: dictate straight into the capture box.
    wireVoiceMic($("#qcMic"), ta);
    $("#qcList").onclick = () => { const t = ta.value.trim(); if (!t) return; const s = subjEl.value; closeSettings(); createChecklistFromText(t, s); };
    $("#qcNote").onclick = () => { const t = ta.value.trim(); if (!t) return; const s = subjEl.value; closeSettings(); createNoteFromText(t, s); };
    ta.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); $("#qcList").click(); } });
  }

  // Bonus: open the app at ...#add=<base64 JSON {t,i}> to auto-create a list.
  function checkHash() {
    const h = location.hash || "";
    if (!h.startsWith("#add=")) return;
    try {
      const json = JSON.parse(decodeURIComponent(escape(atob(h.slice(5)))));
      const items = (json.i || json.items || []).map((t) => ({ id: uid(), text: String(t), checked: false }));
      notes.unshift({ id: uid(), kind: "checklist", title: json.t || json.title || "Quick list", content: "", items,
        tags: [], folder: null, color: null, pinned: false, created: now(), updated: now() });
      selectedId = notes[0].id; persist();
    } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }

  $("#quickAdd").onclick = () => openQuickCapture();
  $("#brainDumpBtn").onclick = () => { openBrainDump(); if (window.innerWidth <= 940) $("#app").classList.remove("rail-open"); };
  $("#fab").onclick = () => openQuickCapture();
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); openQuickCapture(); }
    if (e.key === "Escape" && $("#modalRoot").innerHTML) closeSettings();
  });
  $("#newNote").onclick = () => newNote("note");
  $("#newList").onclick = () => newNote("checklist");
  $("#newBrainstorm").onclick = () => newBrainstorm();
  $("#winsBtn").onclick = openWins;
  $("#rndBtn").onclick = openRandomizer;
  $("#openSettings").onclick = openSettings;
  // The home-screen "Quick note" shortcut opens the site with ?capture=1; the
  // loader relays that here so we pop the capture box straight open.
  window.addEventListener("message", (e) => {
    if (e && e.data === "sn-capture") { openQuickCapture(); return; }
    // Relayed from the top-level loader page (see index.html) as a more
    // reliable backstop for the flush handlers below — this iframe's own
    // visibilitychange/pagehide/blur don't always fire in time on mobile.
    if (e && e.data && e.data.type === "sn-flush") { flushSave(); flushSyncNow(); flushShareOutNow(); return; }
    // env(safe-area-inset-top) inside THIS document (a nested srcdoc iframe)
    // reports 0 in the native Android wrapper even with viewport-fit=cover
    // set here too -- browsers only resolve real notch/status-bar insets for
    // the outermost browsing context. The loader page (index.html) IS that
    // outermost context, so it measures the real value and relays it here.
    if (e && e.data && e.data.type === "sn-safe-area" && typeof e.data.top === "number") {
      document.documentElement.style.setProperty("--safe-top", e.data.top + "px");
      if (typeof e.data.bottom === "number") document.documentElement.style.setProperty("--safe-bottom", e.data.bottom + "px");
      return;
    }
    // Same reasoning as sn-safe-area above, for the Android on-screen nav
    // bar overlay: only the outer page's own visualViewport ever sees a real
    // gap, so it measures and relays it instead of the (always-0-here)
    // in-iframe syncNavOverlay() heuristic higher up in this file.
    if (e && e.data && e.data.type === "sn-nav-overlay" && typeof e.data.px === "number") {
      document.documentElement.style.setProperty("--nav-overlay", e.data.px + "px");
      return;
    }
    if (e && e.data && e.data.type === "sn-quickcapture-drained") {
      (e.data.notes || []).forEach((text) => { if (text && text.trim()) createNoteFromText(text, ""); });
      return;
    }
    handlePushMessage(e);
  });
  // The Android home-screen widget launches straight into Brain Dump by
  // firing this event from native code (see MainActivity.java in the
  // Capacitor wrapper project) — harmless no-op on the regular web deploy,
  // since nothing there ever dispatches it.
  // Auto-save on leave: flush pending writes the moment the app is hidden,
  // backgrounded, or closed — so nothing typed in the last second is lost.
  // Backgrounding used to only flush the LOCAL save — a sync that was still
  // sitting on its 3-second debounce (see syncSoon()) could get suspended,
  // or even a fresh fetch could get aborted mid-flight by an abrupt close,
  // before an edit ever reached the server. flushSyncNow() (keepalive, and
  // skipping the pull/merge half of a normal sync) gives it a real chance to
  // land even in that exact moment — this is what a change made seconds
  // before locking your phone needs.
  document.addEventListener("visibilitychange", () => { if (document.hidden) { flushSave(); flushSyncNow(); flushShareOutNow(); } else { runSync(); runShareOut(); runShareIn(); drainQuickCaptures(); } });
  window.addEventListener("pagehide", () => { flushSave(); flushSyncNow(); flushShareOutNow(); });
  window.addEventListener("beforeunload", () => { flushSave(); flushSyncNow(); flushShareOutNow(); });
  window.addEventListener("blur", () => { flushSave(); flushSyncNow(); flushShareOutNow(); });
  $("#exportBtn").onclick = exportData;
  $("#importBtn").onclick = () => $("#fileInput").click();
  $("#fileInput").onchange = (e) => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; };
  $("#search").addEventListener("input", (e) => { filter.query = e.target.value; renderList(); });
  $("#sort").addEventListener("change", (e) => { prefs.sort = e.target.value; savePrefs(); renderList(); });
  $("#viewToggle").onclick = () => { prefs.view = prefs.view === "list" ? "grid" : "list"; savePrefs(); applyPrefs(); renderList(); };
  $("#selectBtn").onclick = () => {
    if (filter.trash) return; // Trash has its own per-row Restore/Delete forever actions
    if (selecting) { exitSelectMode(); renderList(); } else { enterSelectMode(); }
  };
  $("#railToggle").onclick = () => $("#app").classList.toggle("rail-open");
  $("#railScrim").onclick = () => $("#app").classList.remove("rail-open");
  $("#tabToday").onclick = () => showPage("today");
  $("#tabNotes").onclick = () => showPage("notes");
  $("#tabCalendar").onclick = () => showPage("calendar");
  $("#tabPet").onclick = () => showPage("pet");
  // Settings opens as an overlay on top of whichever page is showing, so it
  // doesn't get an "on" state of its own — Notes/Pet stay marked active
  // underneath it, same as opening Settings from the sidebar always did.
  $("#tabSettings").onclick = () => openSettings();
  $("#kindSeg").querySelectorAll("[data-kind]").forEach((el) => el.addEventListener("click", () => {
    filter.kind = el.dataset.kind;
    $("#kindSeg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el));
    renderList();
  }));

  loadPrefs(); loadNotes(); loadStats(); loadTemplates(); loadBrainDump(); loadPurgedIds();
  if (!notes.length) seed();
  // First ever launch (templates key never written) → drop in starter routines.
  if (localStorage.getItem(TEMPLATES_KEY) === null) seedTemplates();
  // One-time: add the Afternoon starter routine for anyone who installed before it existed.
  if (!prefs.addedAfternoon) {
    if (!templates.some((t) => /afternoon/i.test(t.name || ""))) {
      templates.push({ id: uid(), name: "Afternoon 🌤️", tags: ["routine"], color: "#5bb0a7", repeat: "daily",
        items: [ "Midday meds / water", "Move or stretch — 5 min", "Snack + step away from the screen", "Reset one surface", "Check: did I start my ONE thing?" ].map((text) => ({ text })) });
      saveTemplates();
    }
    prefs.addedAfternoon = true; savePrefs();
  }
  // One-time: order routines into a sensible daily flow (Morning → Afternoon →
  // Evening → custom), with Meds pinned to the bottom.
  if (!prefs.routineFlowV1) {
    const rank = (name) => { const n = (name || "").toLowerCase(); if (n.includes("morning")) return 0; if (n.includes("afternoon")) return 1; if (n.includes("evening") || n.includes("night")) return 2; if (n.includes("meds")) return 9; return 5; };
    templates = templates.map((t, i) => ({ t, i })).sort((a, b) => (rank(a.t.name) - rank(b.t.name)) || (a.i - b.i)).map((x) => x.t);
    saveTemplates(); prefs.routineFlowV1 = true; savePrefs();
  }
  resetRecurring();
  purgeOldTrash();
  checkHash();
  applyPrefs(); renderNav(); renderList(); renderEditor(); setSelectedFlag(); renderStreak(); renderAffirmation(); updatePetTabBadge();
  syncCodeToNative();
  drainQuickCaptures();
  scheduleReminders();
  maybeWeeklyWins();
  if (prefs.syncCode) runSync();
  runShareOut(); runShareIn();
  requestPushStatus();
  // Direct open (outside the iframe) with ?capture=1 or #capture pops capture.
  if (/[?&]capture=1/.test(location.search) || location.hash === "#capture") openQuickCapture();
})();
</script>

</body>
