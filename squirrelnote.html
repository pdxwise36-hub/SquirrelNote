  // stripped on every save AND on import, so it's safe to feed straight back
  // into innerHTML wherever it's shown.
  const RICH_TAGS = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, STRIKE: 1, S: 1, H2: 1, H3: 1, UL: 1, OL: 1, LI: 1, BR: 1, DIV: 1, P: 1, MARK: 1, IMG: 1 };
  // MARK is the one tag allowed a "class" attribute — for the highlight
  // colors below — and only a value matching this exact pattern survives.
  // Everything else (style, onerror, href, arbitrary class names, ...) is
  // stripped from every tag, allowed or not.
  const HL_CLASS_RE = /^hl-[1-7]$/;
  // IMG is the one tag allowed a "src" — and only if it's one of OUR OWN
  // already-compressed data URIs (see fileToScaledDataURL), never a real
  // URL (no tracking-pixel/exfiltration risk) and never anything else that
  // could smuggle script (no javascript:, no inline SVG with <script> in it).
  const SAFE_IMG_SRC_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
  // Inserting an image via execCommand("insertImage") while the cursor is
  // inside a list item ends that list, drops the image in as its own
  // sibling, and starts a NEW list right after it — so what should be item
  // 2 renumbers itself from 1, with the photo sitting as a break between
  // the two <ol>/<ul> elements. Two lists of the same type with nothing but
  // photos between them are never intentional (there's no toolbar action
  // that creates two back-to-back lists on purpose), so this folds any such
  // photos onto the end of the first list's last item and merges the
  // second list back in — a safe repair, not a guess.
  function mergeAdjacentLists(root) {
    let child = root.firstChild;
    while (child) {
      if (child.nodeType === 1 && (child.tagName === "OL" || child.tagName === "UL")) {
        const tag = child.tagName;
        let bridge = child.nextSibling;
        const strays = [];
        while (bridge && bridge.nodeType === 1 && bridge.tagName === "IMG") {
          strays.push(bridge);
          bridge = bridge.nextSibling;
        }
        if (bridge && bridge.nodeType === 1 && bridge.tagName === tag) {
          const lastLi = child.lastElementChild;
          strays.forEach((img) => (lastLi || child).appendChild(img));
          while (bridge.firstChild) child.appendChild(bridge.firstChild);
          bridge.remove();
          continue; // re-check from the same list in case there's a third one to fold in
        }
      }
      child = child.nextSibling;
    }
  }
  // Repairs the OTHER shape this same bug can take: instead of splitting
  // the list, some browsers give an inserted photo its own <li> — so it
  // takes up a number of its own instead of just riding along with the
  // item it was added to. An <li> containing nothing but photo(s) and
  // whitespace only ever comes from that, never from anything a person
  // would type on purpose, so it's folded onto the end of the PREVIOUS
  // item and removed rather than left to count as its own step.
  function absorbImageOnlyListItems(root) {
    root.querySelectorAll("li").forEach((li) => {
      const onlyImages = li.childNodes.length > 0 && [...li.childNodes].every((n) =>
        (n.nodeType === 1 && n.tagName === "IMG") || (n.nodeType === 3 && !n.textContent.trim()));
      if (!onlyImages) return;
      const prev = li.previousElementSibling;
      if (prev && prev.tagName === "LI") {
        while (li.firstChild) prev.appendChild(li.firstChild);
        li.remove();
      }
    });
  }
  function sanitizeRichHTML(html) {
    // Parsed inside a <template> — its content is a genuinely inert
    // DocumentFragment per spec, so an <img onerror> or similar can't fire
    // while we're still walking the tree to strip it (a plain, unattached
    // div still lets the browser attempt the image fetch and fire onerror).
    const tpl = document.createElement("template");
    tpl.innerHTML = String(html || "");
    const root = tpl.content;
    (function clean(node) {
      let child = node.firstChild;
      while (child) {
        if (child.nodeType === 1) {
          if (RICH_TAGS[child.tagName]) {
            const keepClass = child.tagName === "MARK" && HL_CLASS_RE.test(child.getAttribute("class") || "");
            const keepSrc = child.tagName === "IMG" && SAFE_IMG_SRC_RE.test(child.getAttribute("src") || "");
            if (child.tagName === "IMG" && !keepSrc) {
              // No safe src to show — drop it outright rather than leave a
              // broken image icon (this only happens on a hand-crafted or
              // corrupted backup file; the app itself never writes anything
              // but its own already-compressed data URIs).
              const next = child.nextSibling;
              node.removeChild(child);
              child = next;
              continue;
            }
            for (const a of [...child.attributes]) { if ((keepClass && a.name === "class") || (keepSrc && a.name === "src")) continue; child.removeAttribute(a.name); }
            clean(child);
            child = child.nextSibling;
          } else {
            const next = child.nextSibling, first = child.firstChild;
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            child = first || next;
          }
        } else if (child.nodeType === 3) {
          child = child.nextSibling;
        } else {
          const rm = child; child = child.nextSibling; node.removeChild(rm);
        }
      }
    })(root);
    mergeAdjacentLists(root);
    absorbImageOnlyListItems(root);
    const out = document.createElement("div");
    out.appendChild(root);
    return out.innerHTML;
  }
  // Plain-text search/preview corpus from rich HTML — block-level tags become
  // spaces so words from different lines don't run together.
  function stripHtml(html) {
    return String(html || "")
      .replace(/<(br|\/div|\/p|\/li|\/h2|\/h3)\s*\/?>/gi, " ")
      .replace(/<[^>]+>/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }
  // Notes saved before rich text shipped are plain strings with real newline
  // characters — wrap each line in its own <div> so they keep displaying as
  // separate lines once the editor becomes a contenteditable.
  function legacyPlainToHtml(text) {
    if (!text || !text.trim()) return "";
    return text.split("\n").map((line) => `<div>${line ? esc(line) : "<br>"}</div>`).join("");
  }
  function richInitialHTML(n) {
    if (!n.content) return "";
    if (/<(b|strong|i|em|h2|h3|ul|ol|li|br|div|p)[\s>]/i.test(n.content)) return sanitizeRichHTML(n.content);
    return legacyPlainToHtml(n.content);
  }
  function preview(n) {
    if (n.kind === "checklist") { const done = (n.items || []).filter(itemDone).length; return (n.items || []).length ? done + " of " + n.items.length + " done" : "Empty checklist"; }
    return stripHtml(n.content).slice(0, 100) || "Empty note";
  }

  const ACORN = (on) => `<svg class="acorn${on ? " on" : ""}" viewBox="0 0 24 24" aria-hidden="true"><path class="cap" d="M4.4 10 C4.4 6.1 7.8 3.7 12 3.7 C16.2 3.7 19.6 6.1 19.6 10 C19.6 10.7 19 11.1 18.3 11.1 L5.7 11.1 C5 11.1 4.4 10.7 4.4 10 Z"/><path class="stem" d="M12 3.7 V1.7"/><path class="nut" d="M6 11.1 C6 15.8 8.4 20.3 12 20.3 C15.6 20.3 18 15.8 18 11.1 Z"/></svg>`;

  function timeAgo(iso) {
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 50) return "just now";
    const m = s / 60; if (m < 60) return Math.round(m) + "m ago";
    const h = m / 60; if (h < 24) return Math.round(h) + "h ago";
    const d = h / 24; if (d < 7) return Math.round(d) + "d ago";
    return new Date(iso).toLocaleDateString();
  }

  function cardInner(n) {
    const isChk = n.kind === "checklist";
    let body;
    if (isChk) {
      const items = n.items || [];
      const shown = items.slice(0, 6);
      body = items.length
        ? `<div class="cl">${shown.map((it) => `<div class="cl-row ${itemDone(it) ? "done" : ""}"><span class="cbx" data-cardtoggle="${it.id}">${ACORN(itemDone(it))}</span><span class="t">${esc(it.text) || "…"}${(it.sub && it.sub.length) ? ` <span style="opacity:.5">(${it.sub.filter((s) => s.checked).length}/${it.sub.length})</span>` : ""}</span></div>`).join("")}</div>${items.length > 6 ? `<div class="more">+ ${items.length - 6} more</div>` : ""}`
        : `<div class="card-text" style="opacity:.6">Empty checklist</div>`;
    } else {
      const txt = stripHtml(n.content);
      body = txt ? `<div class="card-text">${esc(txt)}</div>` : `<div class="card-text" style="opacity:.55">Empty note</div>`;
    }
    const tags = (n.tags || []).length ? `<div class="card-tags">${n.tags.slice(0, 4).map((t) => `<span class="minitag" style="background:color-mix(in srgb, ${tagColor(t)} 32%, transparent);color:color-mix(in srgb, ${tagColor(t)} 55%, var(--fg))">#${esc(t)}</span>`).join("")}</div>` : "";
    const cphoto = (n.photos && n.photos.length)
      ? `<div class="card-photo"><img src="${n.photos[0]}" loading="lazy" alt="" />${n.photos.length > 1 ? `<span class="card-photo-n">+${n.photos.length - 1}</span>` : ""}</div>`
      : "";
    const grip = (prefs.view === "list" && !selecting) ? `<span class="card-grip" title="Drag to reorder">⠿</span>` : "";
    const check = selecting ? `<span class="card-check">${selectedIds.has(n.id) ? "✓" : ""}</span>` : "";
    const star = selecting ? "" : `<span class="card-star ${n.pinned ? "on" : ""}" data-pin="${n.id}" title="Pin">★</span>`;
    return `<div class="card-top">${grip}${check}<span class="card-title">${esc(n.title) || "Untitled"}</span>${star}</div>
      <div class="card-time">${isChk ? "✓ " : "✎ "}${timeAgo(n.updated)}${n.repeat && n.repeat !== "none" ? ` · 🔁 ${n.repeat}` : ""}${n.repeat && n.repeat !== "none" && noteStreakCount(n) > 0 ? ` · 🔥${noteStreakCount(n)}` : ""}${n.remindAt && !n.remindDone ? " · ⏰" : ""}</div>
      ${cphoto}${body}${tags}`;
  }

  // Auto color for an untagged, uncolored note — deterministic per note id,
  // drawn from the palette MINUS any color already used by an existing tag.
  function autoColorFor(n) {
    const used = new Set(allTags().map(tagColor));
    const avail = TAG_PALETTE.filter((c) => !used.has(c));
    const pool = avail.length ? avail : TAG_PALETTE;
    return pool[tagHash(n.id) % pool.length];
  }
  // A manually-set color wins; then the first tag's color; then an auto color.
  function effectiveColor(n) {
    if (n.color) return n.color;
    if (prefs.colorByTag && (n.tags || []).length) return tagColor(n.tags[0]);
    if (prefs.autoColor) return autoColorFor(n);
    return null;
  }
  // Untouched notes quietly lose their color over time — no badge, no
  // "overdue" language, just a gentle visual fade (mirrors the pet drifting
  // off to sleep). Pinned notes and active routines are exempt since those
  // are meant to sit there. Editing a note (touch()) resets it to full color.
  function noteFadeFactor(n) {
    if (n.pinned || (n.repeat && n.repeat !== "none")) return 0;
    const days = (Date.now() - new Date(n.updated).getTime()) / 86400000;
    if (days <= 3) return 0;
    if (days >= 30) return 1;
    return (days - 3) / (30 - 3);
  }
  function cardStyle(n) {
    if (prefs.lowStim) return "";
    const raw = effectiveColor(n);
    if (!raw) return "";
    const fade = noteFadeFactor(n);
    const c = fade > 0 ? `color-mix(in srgb, ${esc(raw)} ${Math.round((1 - fade) * 100)}%, var(--muted))` : esc(raw);
    return `style="background:color-mix(in srgb, ${c} 20%, var(--surface));border-color:color-mix(in srgb, ${c} 42%, var(--border))"`;
  }

  function refreshCard(id) {
    const n = notes.find((x) => x.id === id); const el = $(`.card[data-id="${id}"]`);
    if (n && el) el.innerHTML = cardInner(n);
  }

  function renderList() {
    const ul = $("#list");
    if (filter.trash) { renderTrashRows(ul); renderBulkBar(); return; }
    const list = visibleNotes();
    if (!list.length) {
      ul.innerHTML = `<li class="empty">Nothing stashed yet 🌰<br>Tap the ＋ button to capture your first thought.</li>`;
      renderBulkBar();
      return;
    }
    ul.innerHTML = list.map((n) => `<li><button class="card ${n.id === selectedId && !selecting ? "sel" : ""} ${selecting && selectedIds.has(n.id) ? "picked" : ""}" data-id="${n.id}" ${cardStyle(n)}>${cardInner(n)}</button></li>`).join("");
    ul.querySelectorAll(".card").forEach((el) => el.addEventListener("click", (e) => {
      if (selecting) {
        const id = el.dataset.id;
        if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
        renderList();
        return;
      }
      if (e.target.closest(".card-grip")) return;
      const pinEl = e.target.closest("[data-pin]");
      if (pinEl) { const n = notes.find((x) => x.id === pinEl.dataset.pin); patch(n.id, { pinned: !n.pinned }); renderList(); return; }
      const cbx = e.target.closest("[data-cardtoggle]");
      if (cbx) {
        const nid = el.dataset.id, n = notes.find((x) => x.id === nid);
        const it = (n.items || []).find((i) => i.id === cbx.dataset.cardtoggle);
        if (it) {
          const before = n.items.filter(itemDone).length;
          const nowDone = !itemDone(it);
          if (it.sub && it.sub.length) it.sub.forEach((s) => (s.checked = nowDone));
          it.checked = nowDone; touch(n); saveSoon();
          if (nowDone) bumpStat();
          markRoutineDay(n);
          const after = n.items.filter(itemDone).length;
          if (n.items.length && after === n.items.length && before < n.items.length) { playChime(); celebrate(); }
          refreshCard(nid);
          if (selectedId === nid) renderEditor();
        }
        return;
      }
      selectedId = el.dataset.id; showBulk = false; renderList(); renderEditor(); setSelectedFlag();
      if (window.innerWidth <= 940) $("#app").classList.remove("rail-open");
    }));
    enableDragReorder(ul, ".card", ".card-grip", reorderNotes);
    renderBulkBar();
  }
  function renderTrashRows(ul) {
    const list = visibleNotes(); // filter.trash is true here: deleted notes, most-recently-deleted first
    if (!list.length) { ul.innerHTML = `<li class="empty">Trash is empty 🌰</li>`; return; }
    ul.innerHTML = `<li class="trash-actions"><button class="btn-sm" id="emptyTrashBtn">Empty trash</button><span class="fineprint" style="margin:0">Auto-clears after ${TRASH_DAYS} days</span></li>`
      + list.map((n) => `<li><div class="trash-row"><div class="trash-info"><span class="trash-title">${esc(n.title) || "Untitled"}</span><span class="trash-when">Deleted ${timeAgo(n.deleted)}</span></div><button class="btn-sm" data-restore="${n.id}">Restore</button><button class="del-btn" data-purge="${n.id}">Delete forever</button></div></li>`).join("");
    const eb = $("#emptyTrashBtn");
    if (eb) eb.onclick = () => { if (confirm("Permanently delete everything in Trash? This can't be undone.")) emptyTrash(); };
    ul.querySelectorAll("[data-restore]").forEach((el) => el.onclick = () => restoreNote(el.dataset.restore));
    ul.querySelectorAll("[data-purge]").forEach((el) => el.onclick = () => { if (confirm("Delete this note forever? This can't be undone.")) purgeNote(el.dataset.purge); });
  }

  // ---- multi-select bulk actions ----
  function updateSelectBtn() {
    const b = $("#selectBtn"); if (!b) return;
    b.textContent = selecting ? "✕" : "☑";
    b.title = b.ariaLabel = selecting ? "Cancel selecting" : "Select multiple";
    b.classList.toggle("on", selecting);
    const fab = $("#fab"); if (fab) fab.style.display = selecting ? "none" : "";
  }
  function enterSelectMode() { selecting = true; selectedIds.clear(); updateSelectBtn(); renderList(); }
  function exitSelectMode() { if (!selecting) return; selecting = false; selectedIds.clear(); updateSelectBtn(); }
  function renderBulkBar() {
    const bar = $("#bulkBar"); if (!bar) return;
    if (!selecting || !selectedIds.size) { bar.innerHTML = ""; return; }
    bar.innerHTML = `<div class="bulkbar">
      <span class="bk-count">${selectedIds.size} selected</span>
      <button id="bkPin">★ Pin</button>
      <button id="bkUnpin">☆ Unpin</button>
      <span class="bk-spacer"></span>
      <button class="bk-del" id="bkDel">🗑 Delete</button>
    </div>`;
    $("#bkPin").onclick = () => { selectedIds.forEach((id) => { const n = notes.find((x) => x.id === id); if (n) { n.pinned = true; touch(n); } }); persist(); renderList(); };
    $("#bkUnpin").onclick = () => { selectedIds.forEach((id) => { const n = notes.find((x) => x.id === id); if (n) { n.pinned = false; touch(n); } }); persist(); renderList(); };
    $("#bkDel").onclick = () => {
      const cnt = selectedIds.size;
      if (!confirm(`Move ${cnt} note${cnt === 1 ? "" : "s"} to Trash?`)) return;
      selectedIds.forEach((id) => { const n = notes.find((x) => x.id === id); if (n) n.deleted = now(); });
      persist(); exitSelectMode(); renderNav(); renderList();
    };
  }

  function renderEditor() {
    const ed = $("#editor");
    const n = selected();
    if (!n) {
      ed.innerHTML = `<div class="placeholder"><div class="ph-inner">
        <div class="big">🐿️</div><h3>Your stash is ready</h3>
        <div>Pick something on the left, or start fresh.</div>
        <div style="display:flex;gap:.5rem"><button class="btn btn-primary" id="phNote">＋ New note</button><button class="btn btn-soft" id="phList" style="background:var(--surface-2);color:var(--fg)">✓ New checklist</button></div>
      </div></div>`;
      $("#phNote").onclick = () => newNote("note");
      $("#phList").onclick = () => newNote("checklist");
      return;
    }
    const colorDots = NOTE_COLORS.map((c) => `<button class="sw ${(n.color === c || (!n.color && c === null)) ? "on" : ""}" data-color="${c || ""}" style="background:${c || "transparent"}" title="${c || "No color"}">${c === null ? "∅" : ""}</button>`).join("");
    const tagChips = (n.tags || []).map((t) => `<span class="tag" style="background:color-mix(in srgb, ${tagColor(t)} 28%, transparent);color:color-mix(in srgb, ${tagColor(t)} 58%, var(--fg))">#${esc(t)}<button data-untag="${esc(t)}">✕</button></span>`).join("");
    ed.innerHTML = `<div class="sheet">
      <div class="mbar only-mobile">
        <button class="backbar" id="backBtn">‹ Back</button>
        <div class="mbar-right">
          <button class="pin-btn ${n.pinned ? "on" : ""}" id="pinBtnM" title="Pin">★</button>
          <button class="del-btn" id="delBtnM">🗑 Delete</button>
        </div>
      </div>
      <div class="ed-head">
        <input class="ed-title" id="edTitle" value="${esc(n.title)}" placeholder="Untitled" />
        <div class="ed-actions only-desktop">
          <span class="saved" id="saved"><span class="dot"></span>Saved</span>
          <button class="pin-btn ${n.pinned ? "on" : ""}" id="pinBtn" title="Pin">★</button>
          <button class="del-btn" id="delBtn">Delete</button>
        </div>
      </div>
      <div class="meta">
        <span class="swatches">${colorDots}</span><span class="vsep"></span>
        <input class="folder-in" id="edFolder" list="folderlist" value="${esc(n.folder || "")}" placeholder="📁 Folder" />
        <datalist id="folderlist">${folders().map((f) => `<option value="${esc(f)}"></option>`).join("")}</datalist>
        <span class="tags-in" id="tagsIn">${tagChips}<input class="tag-add" id="tagAdd" placeholder="+ tag" /></span>
      </div>
      <div class="photos" id="photos"></div>
      <input type="file" id="photoInput" accept="image/*" multiple style="display:none" />
      <div class="remind-row">
        <span class="remind-ic">⏰</span>
        <input type="datetime-local" id="remindAt" class="remind-in" aria-label="Remind me at" />
        <button class="remind-clear" id="remindClear" title="Clear reminder" aria-label="Clear reminder">✕</button>
      </div>
      <div id="body"></div>
    </div>`;
    $("#backBtn").onclick = () => { selectedId = null; setSelectedFlag(); renderList(); };
    const doDel = () => del(n.id);
    $("#delBtn").onclick = doDel; if ($("#delBtnM")) $("#delBtnM").onclick = doDel;
    const doPin = () => { patch(n.id, { pinned: !n.pinned }); renderEditor(); renderList(); };
    $("#pinBtn").onclick = doPin; if ($("#pinBtnM")) $("#pinBtnM").onclick = doPin;
    const title = $("#edTitle");
    title.addEventListener("input", () => { patch(n.id, { title: title.value }); flashSaving(); updateCard(n.id, ".card-title", title.value || "Untitled"); });
    $("#edFolder").addEventListener("change", (e) => { patch(n.id, { folder: e.target.value.trim() || null }); renderNav(); renderList(); });
    ed.querySelectorAll("[data-color]").forEach((el) => el.addEventListener("click", () => { patch(n.id, { color: el.dataset.color || null }); renderEditor(); renderList(); }));
    ed.querySelectorAll("[data-untag]").forEach((el) => el.addEventListener("click", () => { patch(n.id, { tags: (n.tags || []).filter((t) => t !== el.dataset.untag) }); renderEditor(); renderList(); renderNav(); }));
    const tagAdd = $("#tagAdd");
    tagAdd.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === ",") { e.preventDefault();
        const t = tagAdd.value.trim().replace(/^#/, "").toLowerCase();
        if (t && !(n.tags || []).includes(t)) { patch(n.id, { tags: [...(n.tags || []), t] }); renderEditor(); renderList(); renderNav(); } }
    });
    renderPhotos(n);
    const pin = $("#photoInput");
    if (pin) pin.onchange = (e) => { addPhotos(n, [...e.target.files]); e.target.value = ""; };
    const rem = $("#remindAt");
    if (rem) {
      rem.value = toLocalInput(n.remindAt);
      rem.onchange = () => {
        const iso = fromLocalInput(rem.value);
        n.remindAt = iso; n.remindDone = false; touch(n); saveSoon();
        if (iso) requestReminderPerm();
        scheduleReminders(); refreshCard(n.id);
      };
      $("#remindClear").onclick = () => { n.remindAt = null; n.remindDone = false; touch(n); saveSoon(); rem.value = ""; scheduleReminders(); refreshCard(n.id); };
    }
    if (n.kind === "checklist") renderChecklist(n); else renderNoteBody(n);
  }

  // ---- photos (stored on the note as resized JPEG data URIs, on-device) ----
  function persistSafe() { try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); syncSoon(); shareOutSoon(); return true; } catch (e) { return false; } }
  // Downscale in-browser so photos fit in local storage and load fast.
  function fileToScaledDataURL(file, maxDim, quality) {
    maxDim = maxDim || 1400; quality = quality || 0.72;
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        try { resolve(cv.toDataURL("image/jpeg", quality)); } catch (e) { reject(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }
  async function addPhotos(n, files) {
    n.photos = n.photos || [];
    let added = 0;
    for (const f of files) {
      if (!f || !f.type || f.type.indexOf("image/") !== 0) continue;
      try { n.photos.push(await fileToScaledDataURL(f)); added++; } catch (e) {}
    }

  const openSteps = new Set(); // which items have their "break it down" panel open
  function renderChecklist(n) {
    const items = n.items || [];
    const done = items.filter(itemDone).length;
    const allDone = items.length > 0 && done === items.length;
    // Re-render + persist + refresh the card, firing celebration when the whole
    // list flips to complete.
    const commit = (wasDone) => {
      touch(n); saveSoon(); markRoutineDay(n);
      const nowAll = items.length > 0 && items.every(itemDone);
      if (nowAll && !wasDone) { playChime(); celebrate(); }
      renderChecklist(n); refreshCard(n.id);
    };
    $("#body").innerHTML = `
      <div class="chk-controls">
        <label class="repeat-ctl">🔁 Repeats
          <select id="repeatSel"><option value="none">Off</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select>
        </label>
        ${n.repeat && n.repeat !== "none" && noteStreakCount(n) > 0 ? `<span class="routine-streak">🔥 ${noteStreakCount(n)}-${n.repeat === "weekly" ? "week" : n.repeat === "monthly" ? "month" : n.repeat === "yearly" ? "year" : "day"} streak</span>` : ""}
        <button class="link" id="focusBtn" style="margin:0">🎯 Focus</button>
        <button class="link" id="saveTplBtn" style="margin:0">⤓ Save as routine</button>
        ${scheduleFieldsHTML("ckSched", n.repeat, scheduleOf(n))}
      </div>
      ${items.length ? `<div class="progress-wrap"><div class="progress ${allDone ? "done" : ""}"><span style="width:${(done / items.length) * 100}%"></span></div><span class="progress-num">${allDone ? "All gathered! 🌰" : done + "/" + items.length}</span></div>` : ""}
      <div class="chk">
        <div class="items" id="items">
          ${items.map((it) => {
            const subs = it.sub || [];
            const dn = itemDone(it);
            const open = openSteps.has(it.id) || subs.length > 0;
            const subrows = subs.map((s) => `
              <div class="subitem ${s.checked ? "done" : ""}">
                <button class="check sub" data-subtoggle="${it.id}|${s.id}" aria-label="Toggle step">${ACORN(s.checked)}</button>
                <input class="item-text" data-subtext="${it.id}|${s.id}" value="${esc(s.text)}" />
                <button class="item-del" data-subdel="${it.id}|${s.id}" aria-label="Remove step">✕</button>
              </div>`).join("");
            return `
            <div class="item ${dn ? "done" : ""}" data-id="${it.id}">
              <span class="grip" title="Drag to reorder">⠿</span>
              <button class="check" data-toggle="${it.id}" aria-label="Toggle">${ACORN(dn)}</button>
              <input class="item-text" data-text="${it.id}" value="${esc(it.text)}" />
              <button class="stepbtn ${open ? "on" : ""}" data-steps="${it.id}" title="Break into steps">⤵${subs.length ? `<span class="stepn">${subs.filter((s) => s.checked).length}/${subs.length}</span>` : ""}</button>
              <button class="item-del" data-del="${it.id}" aria-label="Remove">✕</button>
            </div>
            ${open ? `<div class="substeps">${subrows}<div class="addsub"><span class="plus">＋</span><input data-addsub="${it.id}" placeholder="Add a step…" /></div></div>` : ""}`;
          }).join("")}
        </div>
        <div class="additem"><span class="plus">＋</span><input id="newItem" placeholder="Add an item…" /></div>
      </div>
      ${showBulk ? `
        <div class="bulk">
          <textarea id="bulkText" placeholder="Paste or type anything — turn each line into a to-do."></textarea>
          <div class="bulk-actions"><button class="btn-sm accent" id="bulkSplit">Split into to-dos</button><button class="btn-sm" id="bulkCancel">Cancel</button></div>
        </div>` : `<button class="link" id="showBulk">＋ Add from text…</button>`}
    `;
    // toggle a top-level item (also flips all its sub-steps)
    $("#body").querySelectorAll("[data-toggle]").forEach((el) => el.addEventListener("click", () => {
      const it = items.find((x) => x.id === el.dataset.toggle);
      const wasAll = items.length > 0 && items.every(itemDone);
      const nowDone = !itemDone(it);
      if (it.sub && it.sub.length) it.sub.forEach((s) => (s.checked = nowDone));
      it.checked = nowDone;
      if (nowDone) bumpStat();
      commit(wasAll);
    }));
    // toggle a single sub-step
    $("#body").querySelectorAll("[data-subtoggle]").forEach((el) => el.addEventListener("click", () => {
      const [iid, sid] = el.dataset.subtoggle.split("|");
      const it = items.find((x) => x.id === iid); const s = (it.sub || []).find((x) => x.id === sid);
      const wasAll = items.length > 0 && items.every(itemDone);
      s.checked = !s.checked; it.checked = it.sub.every((z) => z.checked);
      if (s.checked) bumpStat();
      commit(wasAll);
    }));
    $("#body").querySelectorAll("[data-del]").forEach((el) => el.addEventListener("click", () => { n.items = items.filter((x) => x.id !== el.dataset.del); touch(n); saveSoon(); renderChecklist(n); refreshCard(n.id); }));
    $("#body").querySelectorAll("[data-subdel]").forEach((el) => el.addEventListener("click", () => {
      const [iid, sid] = el.dataset.subdel.split("|");
      const it = items.find((x) => x.id === iid); it.sub = (it.sub || []).filter((x) => x.id !== sid);
      if (it.sub.length) it.checked = it.sub.every((z) => z.checked);
      touch(n); saveSoon(); renderChecklist(n); refreshCard(n.id);
    }));
    $("#body").querySelectorAll("[data-text]").forEach((el) => el.addEventListener("input", () => { const it = items.find((x) => x.id === el.dataset.text); it.text = el.value; touch(n); saveSoon(); flashSaving(); }));
    $("#body").querySelectorAll("[data-subtext]").forEach((el) => el.addEventListener("input", () => {
      const [iid, sid] = el.dataset.subtext.split("|");
      const it = items.find((x) => x.id === iid); const s = (it.sub || []).find((x) => x.id === sid);
      if (s) { s.text = el.value; touch(n); saveSoon(); flashSaving(); }
    }));
    // "break it down" — reveal/hide the sub-step panel for an item
    $("#body").querySelectorAll("[data-steps]").forEach((el) => el.addEventListener("click", () => {
      const id = el.dataset.steps;
      if (openSteps.has(id)) openSteps.delete(id); else openSteps.add(id);
      renderChecklist(n);
      const inp = $(`[data-addsub="${id}"]`); if (inp) inp.focus();
    }));
    $("#body").querySelectorAll("[data-addsub]").forEach((el) => el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && el.value.trim()) {
        const it = items.find((x) => x.id === el.dataset.addsub);
        it.sub = it.sub || []; it.sub.push({ id: uid(), text: el.value.trim(), checked: false });
        it.checked = it.sub.every((z) => z.checked);
        openSteps.add(it.id); touch(n); saveSoon(); renderChecklist(n); refreshCard(n.id);
        const inp = $(`[data-addsub="${it.id}"]`); if (inp) inp.focus();
      }
    }));
    const ni = $("#newItem");
    if (ni) ni.addEventListener("keydown", (e) => { if (e.key === "Enter" && ni.value.trim()) { n.items = [...items, { id: uid(), text: ni.value.trim(), checked: false }]; touch(n); saveSoon(); renderChecklist(n); refreshCard(n.id); $("#newItem").focus(); } });
    const sb = $("#showBulk"); if (sb) sb.onclick = () => { showBulk = true; renderChecklist(n); $("#bulkText").focus(); };
    const bc = $("#bulkCancel"); if (bc) bc.onclick = () => { showBulk = false; renderChecklist(n); };
    const bs = $("#bulkSplit"); if (bs) bs.onclick = () => {
      const lines = $("#bulkText").value.split(/\r?\n/).map((l) => l.replace(/^[-*\[\]xX\d.)\s]+/, "").trim()).filter(Boolean);
      if (lines.length) { n.items = [...items, ...lines.map((text) => ({ id: uid(), text, checked: false }))]; touch(n); saveSoon(); }
      showBulk = false; renderChecklist(n); refreshCard(n.id);
    };
    // The #body element persists across many renderChecklist() calls (every
    // toggle/add/edit re-renders it), and enableDragReorder only wires its
    // pointerdown listener once per element — so this callback must never
    // close over this render's local `items`/`n`, or a later drag would act
    // on a stale (possibly empty, possibly a different note's) snapshot.
    // Always look up the live, currently-selected note instead.
    enableDragReorder($("#body"), ".item", ".grip", (from, to) => {
      const cur = selected(); if (!cur) return;
      const arr = (cur.items || []).slice();
      const [m] = arr.splice(from, 1); if (m === undefined) return;
      arr.splice(to, 0, m);
      cur.items = arr; touch(cur); saveSoon(); renderChecklist(cur); refreshCard(cur.id);
    });
    const rs = $("#repeatSel");
    if (rs) {
      rs.value = n.repeat || "none";
      rs.onchange = () => {
        n.repeat = rs.value; n.lastReset = periodKey(rs.value, scheduleOf(n));
        touch(n); saveSoon(); refreshCard(n.id); renderChecklist(n);
      };
    }
    wireScheduleFields("ckSched", (patch) => {
      Object.assign(n, patch); n.lastReset = periodKey(n.repeat, scheduleOf(n));
      touch(n); saveSoon(); scheduleReminders();
    });
    const fb = $("#focusBtn");
    if (fb) fb.onclick = () => { if ((n.items || []).some((it) => !itemDone(it))) openFocus(n); else toast("Nothing left to focus on 🎉"); };
    const stb = $("#saveTplBtn");
    if (stb) stb.onclick = () => { saveTemplate(n); stb.textContent = "✓ Saved as routine!"; setTimeout(() => { const b = $("#saveTplBtn"); if (b) b.textContent = "⤓ Save as routine"; }, 1400); };
  }
  function updateMini(id) { refreshCard(id); }

  // ---- confetti ----
  function celebrate() {
    if (prefs.lowStim) return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("#confetti"), ctx = cv.getContext("2d");
    const W = cv.width = innerWidth, H = cv.height = innerHeight;
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#f5793b";
    const colors = [accent, "#c1782f", "#6f9b57", "#e0a92e", "#a0522d", "#d98bb0", "#6fb0d4"];
    const cx = W * 0.62, cy = H * 0.32;
    const parts = Array.from({ length: 90 }, () => {
      const a = Math.random() * Math.PI * 2, sp = 5 + Math.random() * 9;
      return { x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6, g: 0.28 + Math.random() * 0.12,
        s: 5 + Math.random() * 6, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, c: colors[(Math.random() * colors.length) | 0], life: 1 };
    });
    let t = 0;
    (function frame() {
      t++; ctx.clearRect(0, 0, W, H);
      let alive = false;
      for (const p of parts) {
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vx *= 0.99; p.life -= 0.012;
        if (p.life > 0 && p.y < H + 40) { alive = true;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62); ctx.restore(); }
      }
      if (alive && t < 160) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    })();
  }

      // Notes this device only has because they were shared in leave with
      // the connection — they were never really "this device's" content.
      notes = notes.filter((n) => !n.sharedIn);
      prefs.shareInCode = null; prefs.shareInedAt = null; savePrefs(); persistSafe(); renderNav(); renderList(); openSettings();
    };
    if (prefs.shareOutCode || prefs.shareInCode) renderShareStatus();
    root.querySelectorAll("[data-ct]").forEach((el) => el.addEventListener("click", () => {
      prefs.colorByTag = el.dataset.ct === "on"; savePrefs(); renderList(); renderEditor(); openSettings();
    }));
    root.querySelectorAll("[data-ac]").forEach((el) => el.addEventListener("click", () => {
      prefs.autoColor = el.dataset.ac === "on"; savePrefs(); renderList(); renderEditor(); openSettings();
    }));
    root.querySelectorAll("[data-calm]").forEach((el) => el.addEventListener("click", () => {
      prefs.lowStim = el.dataset.calm === "on"; savePrefs(); applyPrefs(); renderList(); renderEditor(); openSettings();
    }));
    root.querySelectorAll("[data-aff]").forEach((el) => el.addEventListener("click", () => {
      prefs.affirmations = el.dataset.aff === "on"; if (prefs.affirmations) prefs.affirmDismissed = null; savePrefs(); renderAffirmation(); openSettings();
    }));
    const ae = $("#affEdit"); if (ae) ae.onclick = openAffirmEditor;
    $("#resetPrefs").onclick = () => { prefs = { ...DEFAULT_PREFS }; savePrefs(); applyPrefs(); renderList(); openSettings(); };
    const forceRefresh = $("#forceRefresh");
    if (forceRefresh) forceRefresh.onclick = () => {
      flushSave();
      try { localStorage.removeItem("squirrelnote.app.html.v1"); } catch (e) {}
      try { (window.top || window).location.reload(); } catch (e) { location.reload(); }
    };
  }
  function seg(key, opts) { return `<div class="dseg">${opts.map(([v, l]) => `<button class="${prefs[key] === v ? "on" : ""}" data-seg="${key}" data-val="${v}">${l}</button>`).join("")}</div>`; }
  function closeSettings() { stopFocusTimer(); saveBrainDumpNow(); $("#modalRoot").innerHTML = ""; }

  function exportData() {
    const blob = new Blob([JSON.stringify({ version: 1, exported: now(), notes }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = "squirrelnote-backup.json"; a.click(); URL.revokeObjectURL(url);
  }
  function importData(file) {
    const rd = new FileReader();
    rd.onload = () => { try {
      const data = JSON.parse(rd.result); const incoming = Array.isArray(data) ? data : data.notes;
      if (!Array.isArray(incoming)) throw new Error("bad");
      const existing = new Set(notes.map((n) => n.id));
      incoming.forEach((n) => { if (!existing.has(n.id)) notes.push(normalize(n)); });
      persist(); renderNav(); renderList(); alert("Imported " + incoming.length + " note(s).");
    } catch (e) { alert("Couldn't read that file — is it a SquirrelNote export?"); } };
    rd.readAsText(file);
  }
  function normalize(n) { return { id: n.id || uid(), kind: n.kind === "checklist" ? "checklist" : "note", title: n.title || "Untitled", content: sanitizeRichHTML(n.content || ""), items: Array.isArray(n.items) ? n.items : [], tags: Array.isArray(n.tags) ? n.tags : [], folder: n.folder || null, color: n.color || null, photos: Array.isArray(n.photos) ? n.photos : [], remindAt: n.remindAt || null, remindDone: !!n.remindDone, deleted: n.deleted || null, repeat: n.repeat || "none",
    resetTime: /^\d{2}:\d{2}$/.test(n.resetTime) ? n.resetTime : undefined,
    resetDow: Number.isInteger(n.resetDow) && n.resetDow >= 0 && n.resetDow <= 6 ? n.resetDow : undefined,
    resetDom: Number.isInteger(n.resetDom) && n.resetDom >= 1 && n.resetDom <= 31 ? n.resetDom : undefined,
    resetMonth: Number.isInteger(n.resetMonth) && n.resetMonth >= 1 && n.resetMonth <= 12 ? n.resetMonth : undefined,
    lastReset: n.lastReset || null, streakLog: (n.streakLog && typeof n.streakLog === "object") ? n.streakLog : {}, pinned: !!n.pinned, created: n.created || now(), updated: n.updated || now() }; }

  function seed() {
    notes = [
      { id: uid(), kind: "checklist", title: "Try me — a to-do list ✨", content: "",
        items: [ { id: uid(), text: "Tick a box (watch the check draw in)", checked: true },
          { id: uid(), text: "Drag the ⠿ handle to reorder", checked: false },
          { id: uid(), text: "Finish the list for a surprise 🎉", checked: false },
          { id: uid(), text: "Hit ⚙ Customize and pick a new color", checked: false } ],
        tags: ["welcome"], folder: "Getting started", color: "#22c55e", pinned: true, created: now(), updated: now() },
      { id: uid(), kind: "note", title: "Welcome to SquirrelNote 🐿️",
        content: "Your own little app — it runs entirely in your browser. No account, no setup, nothing to install.\n\nWhat you can do:\n • Write notes or build checklists\n • Turn any pasted text into to-dos (\"Add from text\")\n • Sort with folders, #tags, colors & pins\n • Reskin the whole thing in ⚙ Customize\n\nWant a backup? Tap Export in the sidebar.",
        items: [], tags: ["welcome"], folder: "Getting started", color: "#f5793b", pinned: false, created: now(), updated: now() },
    ];
    persist();
  }

  // ---- quick capture (brain dump -> checklist or note) ----
  // Friendly fallback title when there's no subject and nothing to derive one from.
  function dateTimeLabel() {
    const d = new Date();
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function parseCapture(text) {
    let title = null;
    let body = text;
    const firstNl = text.indexOf("\n");
    const firstLine = (firstNl === -1 ? text : text.slice(0, firstNl)).trim();
    // A leading "Something:" (with a letter, followed by space or end) becomes the title.
    // Avoids mis-reading times like "9:30".
    const m = firstLine.match(/^([^,:]{1,40}):(\s.*|)$/);
    if (m && /[a-z]/i.test(m[1])) {
      title = m[1].trim();
      const rest = m[2].trim();
      body = (rest ? rest : "") + (firstNl === -1 ? "" : (rest ? "\n" : "") + text.slice(firstNl + 1));
    }
    // Split on newlines AND commas — natural for brain dumps.
    const items = body.split(/[\n,]+/).map((l) => l.replace(/^[-*•\[\]xX\d.)\s]+/, "").trim()).filter(Boolean);
    return { title, items };
  }
  // `subject` is the explicit Subject-line field from Quick Capture. It wins if
  // filled; otherwise fall back to a "Name: ..." style title in the text itself
  // (existing shortcut), and finally to the date & time.
  function createChecklistFromText(text, subject) {
    const subj = (subject || "").trim();
    let title, items;
    if (subj) { title = subj; items = text.split(/[\n,]+/).map((l) => l.replace(/^[-*•\[\]xX\d.)\s]+/, "").trim()).filter(Boolean); }
    else { const p = parseCapture(text); title = p.title || dateTimeLabel(); items = p.items; }
    const n = { id: uid(), kind: "checklist", title, content: "", items: items.map((t) => ({ id: uid(), text: t, checked: false })),
      tags: [], folder: filter.folder || null, color: null, pinned: false, created: now(), updated: now() };
    notes.unshift(n); selectedId = n.id; showBulk = false; persist(); renderNav(); renderList(); renderEditor(); setSelectedFlag();
  }
  function createNoteFromText(text, subject) {
    const subj = (subject || "").trim();
    let title, content;
    if (subj) { title = subj; content = text.trim(); }
    else {
      const lines = text.split(/\r?\n/);
      title = (lines[0] || "").trim().slice(0, 80) || dateTimeLabel();
      content = lines.length > 1 ? lines.slice(1).join("\n").trim() : "";
    }
    const n = { id: uid(), kind: "note", title, content, items: [],
      tags: [], folder: filter.folder || null, color: null, pinned: false, created: now(), updated: now() };
    notes.unshift(n); selectedId = n.id; persist(); renderNav(); renderList(); renderEditor(); setSelectedFlag();
  }
  function openQuickCapture(prefill) {
    const root = $("#modalRoot");
    root.innerHTML = `
      <div class="scrim" id="qcScrim"></div>
      <div class="qc">
        <h2>⚡ Quick capture</h2>
        <input  id="qcSubject" placeholder="Subject (optional — defaults to date &amp; time)" style="font-size:0.95rem;padding:.5rem .7rem" />
        <p class="fineprint" style="margin:0">Dump it all in — one thing per line, or comma-separated. Or skip the subject above and start with a name and “:” to title the list (e.g. <em>Groceries: milk, eggs, bread</em>).</p>
        <textarea id="qcText" placeholder="milk, eggs, bread&#10;call the dentist&#10;pay rent"></textarea>
        <div class="qc-row">
          <button class="btn-sm" id="qcMic">🎤 Speak</button>
          <button class="btn-sm" id="qcPaste">📋 Paste</button>
          <span style="flex:1"></span>
          <button class="btn-sm" id="qcCancel">Cancel</button>
          <button class="btn-sm" id="qcNote">Save as note</button>
          <button class="btn-sm accent" id="qcList">Make checklist <span class="kbd">⌘↵</span></button>
        </div>
      </div>`;
    const ta = $("#qcText"), subjEl = $("#qcSubject");
    if (prefill) ta.value = prefill;
    ta.focus();
    $("#qcScrim").onclick = closeSettings;
    $("#qcCancel").onclick = closeSettings;
    $("#qcPaste").onclick = async () => {
      try { const t = await navigator.clipboard.readText(); if (t) { ta.value = ta.value ? ta.value + "\n" + t : t; ta.focus(); } }
      catch (e) { alert("Couldn't read the clipboard here — paste with Ctrl/Cmd+V into the box instead."); }
    };
    // Voice-to-text: dictate straight into the capture box.
    wireVoiceMic($("#qcMic"), ta);
    $("#qcList").onclick = () => { const t = ta.value.trim(); if (!t) return; const s = subjEl.value; closeSettings(); createChecklistFromText(t, s); };
    $("#qcNote").onclick = () => { const t = ta.value.trim(); if (!t) return; const s = subjEl.value; closeSettings(); createNoteFromText(t, s); };
    ta.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); $("#qcList").click(); } });
  }

  // Bonus: open the app at ...#add=<base64 JSON {t,i}> to auto-create a list.
  function checkHash() {
    const h = location.hash || "";
    if (!h.startsWith("#add=")) return;
    try {
      const json = JSON.parse(decodeURIComponent(escape(atob(h.slice(5)))));
      const items = (json.i || json.items || []).map((t) => ({ id: uid(), text: String(t), checked: false }));
      notes.unshift({ id: uid(), kind: "checklist", title: json.t || json.title || "Quick list", content: "", items,
        tags: [], folder: null, color: null, pinned: false, created: now(), updated: now() });
      selectedId = notes[0].id; persist();
    } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }

  $("#quickAdd").onclick = () => openQuickCapture();
  $("#brainDumpBtn").onclick = () => { openBrainDump(); if (window.innerWidth <= 940) $("#app").classList.remove("rail-open"); };
  $("#fab").onclick = () => openQuickCapture();
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); openQuickCapture(); }
    if (e.key === "Escape" && $("#modalRoot").innerHTML) closeSettings();
  });
  $("#newNote").onclick = () => newNote("note");
  $("#newList").onclick = () => newNote("checklist");
  $("#winsBtn").onclick = openWins;
  $("#rndBtn").onclick = openRandomizer;
  $("#openSettings").onclick = openSettings;
  // The home-screen "Quick note" shortcut opens the site with ?capture=1; the
  // loader relays that here so we pop the capture box straight open.
  window.addEventListener("message", (e) => { if (e && e.data === "sn-capture") openQuickCapture(); else handlePushMessage(e); });
  // Auto-save on leave: flush pending writes the moment the app is hidden,
  // backgrounded, or closed — so nothing typed in the last second is lost.
  // Backgrounding used to only flush the LOCAL save — a sync that was still
  // sitting on its 3-second debounce (see syncSoon()) could get suspended,
  // or even a fresh fetch could get aborted mid-flight by an abrupt close,
  // before an edit ever reached the server. flushSyncNow() (keepalive, and
  // skipping the pull/merge half of a normal sync) gives it a real chance to
  // land even in that exact moment — this is what a change made seconds
  // before locking your phone needs.
  document.addEventListener("visibilitychange", () => { if (document.hidden) { flushSave(); flushSyncNow(); flushShareOutNow(); } else { runSync(); runShareOut(); runShareIn(); } });
  window.addEventListener("pagehide", () => { flushSave(); flushSyncNow(); flushShareOutNow(); });
  window.addEventListener("beforeunload", () => { flushSave(); flushSyncNow(); flushShareOutNow(); });
  window.addEventListener("blur", () => { flushSave(); flushSyncNow(); flushShareOutNow(); });
  $("#exportBtn").onclick = exportData;
  $("#importBtn").onclick = () => $("#fileInput").click();
  $("#fileInput").onchange = (e) => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; };
  $("#search").addEventListener("input", (e) => { filter.query = e.target.value; renderList(); });
  $("#sort").addEventListener("change", (e) => { prefs.sort = e.target.value; savePrefs(); renderList(); });
  $("#viewToggle").onclick = () => { prefs.view = prefs.view === "list" ? "grid" : "list"; savePrefs(); applyPrefs(); renderList(); };
  $("#selectBtn").onclick = () => {
    if (filter.trash) return; // Trash has its own per-row Restore/Delete forever actions
    if (selecting) { exitSelectMode(); renderList(); } else { enterSelectMode(); }
  };
  $("#railToggle").onclick = () => $("#app").classList.toggle("rail-open");
  $("#railScrim").onclick = () => $("#app").classList.remove("rail-open");
  $("#tabNotes").onclick = () => showPage("notes");
  $("#tabPet").onclick = () => showPage("pet");
  // Settings opens as an overlay on top of whichever page is showing, so it
  // doesn't get an "on" state of its own — Notes/Pet stay marked active
  // underneath it, same as opening Settings from the sidebar always did.
  $("#tabSettings").onclick = () => openSettings();
  $("#kindSeg").querySelectorAll("[data-kind]").forEach((el) => el.addEventListener("click", () => {
    filter.kind = el.dataset.kind;
    $("#kindSeg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el));
    renderList();
  }));

  loadPrefs(); loadNotes(); loadStats(); loadTemplates(); loadBrainDump(); loadPurgedIds();
  if (!notes.length) seed();
  // First ever launch (templates key never written) → drop in starter routines.
  if (localStorage.getItem(TEMPLATES_KEY) === null) seedTemplates();
  // One-time: add the Afternoon starter routine for anyone who installed before it existed.
  if (!prefs.addedAfternoon) {
    if (!templates.some((t) => /afternoon/i.test(t.name || ""))) {
      templates.push({ id: uid(), name: "Afternoon 🌤️", tags: ["routine"], color: "#5bb0a7", repeat: "daily",
        items: [ "Midday meds / water", "Move or stretch — 5 min", "Snack + step away from the screen", "Reset one surface", "Check: did I start my ONE thing?" ].map((text) => ({ text })) });
      saveTemplates();
    }
    prefs.addedAfternoon = true; savePrefs();
  }
  // One-time: order routines into a sensible daily flow (Morning → Afternoon →
  // Evening → custom), with Meds pinned to the bottom.
  if (!prefs.routineFlowV1) {
    const rank = (name) => { const n = (name || "").toLowerCase(); if (n.includes("morning")) return 0; if (n.includes("afternoon")) return 1; if (n.includes("evening") || n.includes("night")) return 2; if (n.includes("meds")) return 9; return 5; };
    templates = templates.map((t, i) => ({ t, i })).sort((a, b) => (rank(a.t.name) - rank(b.t.name)) || (a.i - b.i)).map((x) => x.t);
    saveTemplates(); prefs.routineFlowV1 = true; savePrefs();
  }
  resetRecurring();
  purgeOldTrash();
  checkHash();
  applyPrefs(); renderNav(); renderList(); renderEditor(); setSelectedFlag(); renderStreak(); renderAffirmation(); updatePetTabBadge();
  scheduleReminders();
  maybeWeeklyWins();
  if (prefs.syncCode) runSync();
  runShareOut(); runShareIn();
  requestPushStatus();
  // Direct open (outside the iframe) with ?capture=1 or #capture pops capture.
  if (/[?&]capture=1/.test(location.search) || location.hash === "#capture") openQuickCapture();
})();
</script>

</body>
