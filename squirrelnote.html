<html lang="en">

<meta name="theme-color" content="#211a12" />
<meta name="description" content="SquirrelNote — a cozy notes + to-do stash for your brain." />
<title>SquirrelNote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BF%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BF%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SquirrelNote" />

<body>
<style>
  /* =======================================================================
     SquirrelNote — "a stash for your brain"
     Design: dark, tactile sidebar + bright workspace. Chunky rounded cards
     with soft depth, a gradient brand mark, springy micro-interactions,
     draw-in checkmarks, and a confetti pop when a list is finished.
     Accent is user-swappable; identity is carried by shape, depth & motion.
  ======================================================================= */
  :root {
    --app-bg: #efe7d6;
    --surface: #fbf6ec;
    --surface-2: #e7dabf;
    --fg: #33271b;
    --muted: #8a7659;
    --border: #ddceb2;
    --rail-bg: #2a2018;
    --rail-fg: #f3e9d8;
    --rail-muted: #b09a7d;
    --rail-hover: rgba(255,255,255,0.06);
    --accent: #c1782f;
    --accent-2: color-mix(in srgb, var(--accent) 60%, #f4c96a);
    --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
    --accent-contrast: #ffffff;
    --moss: #6f9b57;
    --good: #6f9b57;
    --radius: 16px;
    --radius-sm: 11px;
    --shadow-sm: 0 1px 2px rgba(30,20,10,0.05);
    --shadow: 0 1px 2px rgba(30,20,10,0.05), 0 10px 28px -14px rgba(40,25,10,0.22);
    --shadow-lg: 0 24px 60px -22px rgba(40,25,10,0.42);
    --rowpad: 0.7rem;
    --gap: 0.55rem;
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --round: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Segoe UI Variable Display", system-ui, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, "Cascadia Code", monospace;
    --body-font: var(--sans);
    color-scheme: light;
    --nav-overlay: 0px;
    --safe-bottom: 0px;
    /* Whichever bottom-inset signal actually has real data wins: env() as
       measured in THIS document (works on iOS, and on plain non-embedded
       web), the relayed visualViewport-gap guess, and the relayed real
       env(safe-area-inset-bottom) measured on the true outer page (see
       index.html) -- all three default to 0 when they don't apply. */
    --bottom-inset: max(env(safe-area-inset-bottom), var(--nav-overlay), var(--safe-bottom));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --app-bg: #211a12; --surface: #2a2118; --surface-2: #352a1d;
      --fg: #f0e6d3; --muted: #b0997b; --border: #3e3122;
      --rail-bg: #181209; --rail-fg: #f0e6d3; --rail-muted: #a58e70; --rail-hover: rgba(255,255,255,0.05);
      --accent-soft: color-mix(in srgb, var(--accent) 26%, transparent); --moss: #86b46a; --good: #86b46a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 14px 34px -16px rgba(0,0,0,0.7);
      --shadow-lg: 0 30px 70px -24px rgba(0,0,0,0.8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --app-bg: #131116; --surface: #1c1a21; --surface-2: #262330;
    --fg: #efeaf1; --muted: #a79fad; --border: #2c2836;
    --rail-bg: #0d0c11; --rail-fg: #efeaf1; --rail-muted: #8d8598; --rail-hover: rgba(255,255,255,0.05);
    --accent-soft: color-mix(in srgb, var(--accent) 26%, transparent);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 14px 34px -16px rgba(0,0,0,0.7);
    --shadow-lg: 0 30px 70px -24px rgba(0,0,0,0.8);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --app-bg: #efe7d6; --surface: #fbf6ec; --surface-2: #e7dabf;
    --fg: #33271b; --muted: #8a7659; --border: #ddceb2;
    --rail-bg: #2a2018; --rail-fg: #f3e9d8; --rail-muted: #b09a7d; --rail-hover: rgba(255,255,255,0.06);
    --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent); --moss: #6f9b57; --good: #6f9b57;
    --shadow-sm: 0 1px 2px rgba(30,20,10,0.05);
    --shadow: 0 1px 2px rgba(30,20,10,0.05), 0 10px 28px -14px rgba(40,25,10,0.22);
    --shadow-lg: 0 24px 60px -22px rgba(40,25,10,0.42);
    color-scheme: light;
  }
  :root[data-density="compact"] { --rowpad: 0.45rem; --gap: 0.35rem; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--app-bg); color: var(--fg);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .scroll { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 40%, transparent) transparent; }
  .scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 35%, transparent); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  /* ---------- Shell -------------------------------------------------------- */
  html, body { overflow-x: hidden; max-width: 100%; }
  /* 100vh is the browser's max-possible viewport height on some older
     Android WebViews (as if the address bar / on-screen nav bar were
     always hidden), not the actually-visible one -- on devices where that
     gap goes unaccounted for elsewhere, it stretches #app taller than the
     real screen, leaving a blank gap between the scrollable content and
     the fixed tab bar sitting at the true bottom. 100dvh tracks the real,
     live viewport instead; browsers without it just ignore the line and
     keep the 100vh above. */
  #app { display: grid; grid-template-columns: 1fr; grid-template-rows: 100vh; grid-template-rows: 100dvh; height: 100vh; height: 100dvh; overflow: hidden; position: relative; }

  /* ---------- Sidebar (dark, tactile) ------------------------------------- */
  #rail {
    position: relative; display: flex; flex-direction: column; gap: 1.05rem;
    background: var(--rail-bg); color: var(--rail-fg);
    padding: calc(1.15rem + var(--safe-top, env(safe-area-inset-top))) 0.8rem 0.9rem; overflow: hidden;
  }
  #rail::before { /* ambient accent glow, top-left */
    content: ""; position: absolute; top: -120px; left: -80px; width: 260px; height: 260px;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 40%, transparent), transparent 70%);
    filter: blur(30px); opacity: 0.55; pointer-events: none;
  }
  .brand { position: relative; display: flex; align-items: center; gap: 0.55rem; padding: 0 0.35rem 0.1rem; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 1.15rem;
    background: linear-gradient(140deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px -6px var(--accent);
  }
  .brand .word {
    font-family: var(--serif); font-weight: 700; font-size: 1.3rem; letter-spacing: -0.01em;
    background: linear-gradient(120deg, var(--rail-fg), color-mix(in srgb, var(--accent) 75%, var(--rail-fg)));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stats { position: relative; display: flex; gap: 0.45rem; }
  .stat-pill { flex: 1; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 0.5rem 0.55rem; display: flex; flex-direction: column; gap: 0.02rem; }
  .stat-pill .sv { font-family: var(--round); font-weight: 800; font-size: 1.2rem; line-height: 1.1; color: var(--rail-fg); }
  .stat-pill .sl { font-size: 0.63rem; color: var(--rail-muted); letter-spacing: 0.01em; }
  .stat-hint { position: relative; font-size: 0.72rem; color: var(--rail-muted); padding: 0.1rem 0.2rem; }
  .newbtns { position: relative; display: flex; flex-direction: column; gap: 0.45rem; }
  .btn { border-radius: 13px; padding: 0.6rem 0.8rem; font-family: var(--round); font-weight: 700; font-size: 0.92rem;
    display: flex; align-items: center; justify-content: center; gap: 0.45rem; transition: transform 0.12s var(--ease-spring), box-shadow 0.15s, background 0.15s; }
  .btn:active { transform: scale(0.965); }
  .btn-primary { color: var(--accent-contrast); background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 20px -8px var(--accent); }
  .btn-primary:hover { box-shadow: 0 12px 26px -8px var(--accent); }
  .btn-soft { color: var(--rail-fg); background: rgba(255,255,255,0.07); }
  .btn-soft:hover { background: rgba(255,255,255,0.12); }
  #nav { position: relative; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0.12rem; }
  .nav-item { width: 100%; text-align: left; border-radius: 11px; padding: 0.46rem 0.6rem; font-size: 0.9rem;
    color: var(--rail-muted); display: flex; align-items: center; gap: 0.55rem; transition: background 0.14s, color 0.14s;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .nav-item:hover { background: var(--rail-hover); color: var(--rail-fg); }
  .nav-item.active { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 90%, transparent), var(--accent-2)); color: var(--accent-contrast); font-weight: 700; box-shadow: 0 6px 16px -8px var(--accent); }
  .nav-item .count { margin-left: auto; font-size: 0.72rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .nav-label { font-family: var(--round); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--rail-muted); padding: 0.7rem 0.6rem 0.25rem; font-weight: 700; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 0.32rem; padding: 0.15rem 0.5rem; }
  .rchip { border-radius: 99px; padding: 0.14rem 0.6rem; font-size: 0.76rem; background: rgba(255,255,255,0.07); color: var(--rail-muted); transition: transform 0.12s var(--ease-spring); }
  .rchip:hover { color: var(--rail-fg); }
  .rchip:active { transform: scale(0.94); }
  .rchip.active { background: var(--accent); color: var(--accent-contrast); }
  .tag-manage { color: var(--rail-muted); font-size: 0.66rem; font-weight: 700; padding: 0.1rem 0.35rem; border-radius: 6px; letter-spacing: 0.02em; }
  .tag-manage:hover { color: var(--rail-fg); background: var(--rail-hover); }
  .tagmgr-list { display: flex; flex-direction: column; gap: 0.35rem; max-height: 320px; overflow-y: auto; }
  .tagmgr-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0.1rem; }
  .tagmgr-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .tagmgr-name { flex: 1; background: var(--app-bg); border: 1px solid var(--border); border-radius: 9px; padding: 0.32rem 0.55rem; font-size: 0.85rem; color: var(--fg); min-width: 0; }
  .tagmgr-name:focus { outline: none; border-color: var(--accent); }
  .tagmgr-count { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; }
  .tagmgr-del { color: var(--muted); font-size: 0.8rem; padding: 0.25rem 0.4rem; }
  .tagmgr-del:hover { color: #e5484d; }
  .railfoot { position: relative; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 0.55rem; display: flex; flex-direction: column; gap: 0.12rem; }

  /* ---------- List column -------------------------------------------------- */
  #listcol { display: flex; flex-direction: column; background: var(--app-bg); overflow: hidden; }
  #topbar { display: flex; align-items: center; gap: 0.5rem; padding: calc(0.8rem + var(--safe-top, env(safe-area-inset-top))) 0.85rem 0.5rem; }
  #search { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 0.5rem 0.95rem; font-size: 0.88rem; box-shadow: var(--shadow-sm); transition: border-color 0.15s, box-shadow 0.15s; }
  #search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 0.42rem 0.55rem; color: var(--muted); box-shadow: var(--shadow-sm); transition: transform 0.12s var(--ease-spring); }
  .icon-btn:hover { color: var(--fg); }
  .icon-btn.on { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
  .icon-btn:active { transform: scale(0.92); }
  #sort { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 0.42rem 0.4rem; font-size: 0.78rem; color: var(--muted); box-shadow: var(--shadow-sm); }
  #segbar { display: flex; padding: 0.15rem 0.9rem 0.55rem; }
  .seg { display: flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 3px; width: 100%; }
  .seg button { flex: 1; border-radius: 8px; padding: 0.32rem; font-size: 0.8rem; font-weight: 600; color: var(--muted); transition: color 0.14s, background 0.14s, box-shadow 0.14s; }
  .seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
  /* A constrained-height element can't also be a CSS-columns container without
     risk: browsers fragment overflow into *more columns to the right* instead
     of growing taller, which is invisible until you scroll sideways. So the
     scrolling (definite height) lives on #listScroll, and the columns (#list)
     are free to grow to whatever height their content needs. */
  #listScroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
  #list { list-style: none; margin: 0; padding: 0.65rem 0.65rem calc(9.5rem + var(--bottom-inset)); }
  #list:not(.grid) { display: flex; flex-direction: column; gap: 0.55rem; }
  #list.grid { column-count: 2; column-gap: 0.6rem; }
  #list.grid > li { break-inside: avoid; margin-bottom: 0.6rem; }
  .card { position: relative; width: 100%; text-align: left; display: flex; flex-direction: column; gap: 0.4rem; color: var(--fg);
    padding: 0.85rem 0.9rem; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); transition: transform 0.16s var(--ease-spring), box-shadow 0.16s; animation: pop 0.26s var(--ease-spring); }
  @keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .card.sel { outline: 2.5px solid var(--accent); outline-offset: 1px; }
  .card.dragging { z-index: 5; box-shadow: var(--shadow-lg); transition: none; }
  .card-top { display: flex; align-items: flex-start; gap: 0.4rem; }
  .card-grip { color: color-mix(in srgb, var(--fg) 32%, transparent); cursor: grab; touch-action: none; font-size: 0.85rem; flex-shrink: 0; margin-top: 0.1rem; }
  .card-grip:active { cursor: grabbing; }
  .card-title { flex: 1; font-family: var(--serif); font-weight: 700; font-size: 1.02rem; line-height: 1.25; word-break: break-word; }
  .card-star { font-size: 0.95rem; line-height: 1; color: color-mix(in srgb, var(--fg) 20%, transparent); flex-shrink: 0; transition: transform 0.12s var(--ease-spring); }
  .card-star:hover { transform: scale(1.3); }
  .card-star.on { color: var(--accent); }
  .card-time { font-size: 0.7rem; color: color-mix(in srgb, var(--fg) 42%, transparent); margin-top: -0.25rem; }
  .card-text { font-size: 0.84rem; line-height: 1.5; color: color-mix(in srgb, var(--fg) 78%, transparent);
    display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
  .cl { display: flex; flex-direction: column; gap: 0.22rem; }
  .cl-row { display: flex; align-items: flex-start; gap: 0.45rem; font-size: 0.84rem; line-height: 1.3; }
  .cl-row .t { flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .cl-row.done .t { color: color-mix(in srgb, var(--fg) 42%, transparent); text-decoration: line-through; }
  .cbx { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; cursor: pointer; }
  .cbx .acorn { width: 18px; height: 18px; }
  .more { font-size: 0.75rem; color: color-mix(in srgb, var(--fg) 48%, transparent); font-weight: 600; padding-left: 1.65rem; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .minitag { font-size: 0.66rem; font-weight: 700; background: color-mix(in srgb, var(--fg) 9%, transparent); color: color-mix(in srgb, var(--fg) 70%, transparent); border-radius: 99px; padding: 0.05rem 0.5rem; }
  .empty { color: var(--muted); padding: 3rem 1.2rem; font-size: 0.92rem; text-align: center; line-height: 1.7; }

  /* ---------- Editor ------------------------------------------------------- */
  #editor { overflow-y: auto; padding: 1.6rem 1.6rem 4rem; }
  .sheet { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
  .ed-head { display: flex; align-items: flex-start; gap: 0.7rem; }
  .ed-title { flex: 1; background: none; border: none; font-family: var(--serif); font-size: 1.85rem; font-weight: 700; letter-spacing: -0.01em; }
  .ed-title:focus { outline: none; }
  .ed-actions { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
  .saved { font-size: 0.72rem; color: var(--muted); display: flex; align-items: center; gap: 0.3rem; }
  .saved .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
  .swatches { display: flex; gap: 0.35rem; align-items: center; }
  .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1.5px var(--border); display: grid; place-items: center; font-size: 0.6rem; color: var(--muted); transition: transform 0.12s var(--ease-spring); }
  .sw:hover { transform: scale(1.15); }
  .sw.on { box-shadow: inset 0 0 0 1.5px transparent, 0 0 0 2px var(--fg); }
  .vsep { width: 1px; height: 20px; background: var(--border); }
  .folder-in { width: 128px; background: var(--app-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.32rem 0.55rem; font-size: 0.79rem; }
  .folder-in:focus { outline: none; border-color: var(--accent); }
  .tags-in { display: flex; flex-wrap: wrap; gap: 0.32rem; align-items: center; }
  .tag { display: flex; align-items: center; gap: 0.25rem; background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 78%, var(--fg)); border-radius: 99px; padding: 0.1rem 0.55rem; font-size: 0.77rem; font-weight: 600; }
  .tag button { color: currentColor; opacity: 0.6; font-size: 0.7rem; }
  .tag button:hover { opacity: 1; }
  .tag-add { width: 66px; background: var(--app-bg); border: 1px solid var(--border); border-radius: 99px; padding: 0.1rem 0.55rem; font-size: 0.77rem; }
  .tag-add:focus { outline: none; border-color: var(--accent); }
  .note-body { min-height: 320px; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.1rem 1.2rem; font-family: var(--body-font); font-size: 0.97rem; line-height: 1.7; white-space: pre-wrap; box-shadow: var(--shadow-sm); }
  .note-body:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .note-body:empty:before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
  .note-body h2 { font-family: var(--serif); font-size: 1.32rem; font-weight: 800; margin: 0.2rem 0; line-height: 1.35; }
  .note-body h3 { font-family: var(--serif); font-size: 1.1rem; font-weight: 800; margin: 0.2rem 0; line-height: 1.35; }
  .note-body ul, .note-body ol { margin: 0.2rem 0 0.2rem 1.3rem; padding: 0; }
  .note-body li { margin: 0.1rem 0; }
  .note-body mark, .card-text mark { background: none; color: inherit; border-radius: 3px; padding: 0 0.1em; }
  .note-body img { width: 110px; height: 110px; max-width: 100%; object-fit: cover; display: inline-block; vertical-align: middle;
    border-radius: 10px; margin: 0.3rem; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.12s var(--ease-spring); }
  .note-body img:hover, .note-body img:active { transform: scale(1.04); }
  .rtbar { display: flex; gap: 0.3rem; margin-bottom: 0.5rem; flex-wrap: wrap; position: relative; }
  .rtbar button { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); width: 2rem; height: 2rem;

  .sched-row { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; width: 100%; margin-top: 0.3rem; }

  .tpl-item { display: flex; align-items: center; }

  /* acorn checkbox (used on cards + in the editor) */

  .item-text { flex: 1; background: none; border: none; font-size: 0.94rem; transition: color 0.2s; }

  .additem { display: flex; align-items: center; gap: 0.55rem; padding: 0.4rem 0.4rem 0.1rem; }

  .bulk { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); padding: 0.8rem; display: flex; flex-direction: column; gap: 0.55rem; }

  .placeholder { height: 100%; display: grid; place-items: center; }

  /* ---------- Settings drawer --------------------------------------------- */

  /* confetti canvas */

  /* weekly wins recap */

  .wk-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; height: 100%; justify-content: flex-end; }
  .wk-bar { width: 68%; min-height: 4px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); transition: height 0.4s var(--ease-spring); }

  .mic-on { animation: micpulse 1s ease-in-out infinite; }

  .rnd-chip { border: 1px solid var(--border); background: var(--surface-2); border-radius: 99px; padding: 0.3rem 0.7rem;

  .rnd-chip:hover { color: var(--fg); } .rnd-chip:active { transform: scale(0.94); }
  .rnd-chip.on { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
  .rnd-stage { position: relative; min-height: 132px; display: grid; place-items: center; border-radius: var(--radius);
    background: radial-gradient(circle at 50% 38%, var(--accent-soft), var(--surface-2)); border: 1px solid var(--border); overflow: hidden; }
  .rnd-stage.spinning { animation: stageshake 0.28s linear infinite; }
  @keyframes stageshake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  .rnd-result { font-family: var(--round); font-weight: 800; font-size: 2.4rem; line-height: 1.12; text-align: center;
    padding: 0.4rem 1rem; color: var(--fg); word-break: break-word; }
  .rnd-result.flip { animation: rflip 0.12s ease; }
  @keyframes rflip { from { opacity: 0.25; transform: translateY(-28%) scale(0.9); } to { opacity: 1; transform: none; } }
  .rnd-result.land { animation: rland 0.55s var(--ease-spring); color: var(--accent); text-shadow: 0 0 26px var(--accent-soft); }
  @keyframes rland { 0% { transform: scale(0.4); opacity: 0; } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* photos on notes */
  .photos { display: flex; flex-wrap: wrap; gap: 0.5rem; position: relative; }
  .photo { position: relative; width: 88px; height: 88px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .photo-del { position: absolute; top: 3px; right: 3px; width: 21px; height: 21px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; font-size: 0.7rem; display: grid; place-items: center; line-height: 1; }
  .photo-del:hover { background: rgba(0,0,0,0.8); }
  .photo-add { width: 88px; height: 88px; border-radius: 12px; border: 2px dashed var(--border); color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; font-size: 1.4rem; transition: border-color 0.15s, color 0.15s; }
  .photo-add span { font-size: 0.7rem; font-weight: 700; }
  .photo-add:hover { border-color: var(--accent); color: var(--accent); }
  .card-photo { position: relative; width: 100%; border-radius: 10px; overflow: hidden; }
  .card-photo img { width: 100%; max-height: 180px; object-fit: cover; display: block; }
  .card-photo-n { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.6); color: #fff; font-size: 0.66rem; font-weight: 700; padding: 0.05rem 0.45rem; border-radius: 99px; }
  .lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.92); display: grid; place-items: center; padding: 1rem; animation: fade 0.18s ease; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .lb-close { position: fixed; top: 1rem; right: 1rem; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.16); color: #fff; font-size: 1.1rem; }

  /* sub-steps ("break it down") */
  .stepbtn { color: var(--muted); font-size: 0.82rem; padding: 0.1rem 0.35rem; border-radius: 8px; display: inline-flex; align-items: center; gap: 0.2rem; flex-shrink: 0; transition: color 0.14s; }
  .stepbtn:hover, .stepbtn.on { color: var(--accent); }
  .stepn { font-size: 0.62rem; font-weight: 700; background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 72%, var(--fg)); border-radius: 99px; padding: 0 0.32rem; }
  .substeps { margin: 0.05rem 0 0.35rem 2.5rem; display: flex; flex-direction: column; gap: 0.08rem; border-left: 2px solid var(--border); padding-left: 0.5rem; }
  .subitem { display: flex; align-items: center; gap: 0.4rem; padding: 0.16rem 0.2rem; border-radius: 9px; }
  .subitem:hover { background: var(--app-bg); }
  .subitem .check { width: 22px; height: 22px; }
  .subitem .check .acorn { width: 18px; height: 18px; }
  .subitem .item-text { font-size: 0.88rem; }
  .subitem.done .item-text { color: var(--muted); text-decoration: line-through; }
  .addsub { display: flex; align-items: center; gap: 0.4rem; padding: 0.12rem 0.2rem; }
  .addsub .plus { width: 18px; text-align: center; color: var(--accent); font-weight: 700; }
  .addsub input { flex: 1; background: none; border: none; border-bottom: 1px solid var(--border); padding: 0.2rem 0; font-size: 0.85rem; }
  .addsub input:focus { outline: none; border-color: var(--accent); }

  /* reminders */
  .remind-row { display: flex; align-items: center; gap: 0.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.4rem 0.7rem; box-shadow: var(--shadow-sm); }
  .remind-ic { font-size: 1rem; }
  .remind-in { flex: 1; background: var(--app-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.32rem 0.5rem; font-size: 0.82rem; color: var(--fg); min-width: 0; font-family: var(--sans); }
  .remind-in:focus { outline: none; border-color: var(--accent); }
  .remind-clear { color: var(--muted); font-size: 0.8rem; padding: 0.2rem 0.45rem; }
  .remind-clear:hover { color: var(--fg); }

  /* undo snackbar */
  .toast.undo { display: flex; align-items: center; gap: 0.85rem; }
  .toast-undo { background: rgba(255,255,255,0.22); color: #fff; border-radius: 8px; padding: 0.2rem 0.65rem; font-weight: 800; font-family: var(--round); }
  .toast-undo:hover { background: rgba(255,255,255,0.34); }

  /* focus mode */
  .focus { position: fixed; inset: 0; z-index: 50; background: linear-gradient(160deg, var(--app-bg), var(--surface-2)); display: grid; place-items: center; padding: 1.5rem; animation: fade 0.2s ease; }
  .focus-inner { max-width: 430px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 1.1rem; align-items: center; }
  .focus-count { font-family: var(--round); font-weight: 800; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .focus-task { font-family: var(--serif); font-weight: 700; font-size: 1.9rem; line-height: 1.28; color: var(--fg); word-break: break-word; }
  .focus-big { font-size: 3.4rem; animation: bob 3s ease-in-out infinite; }
  .focus-timer { font-family: var(--round); font-weight: 800; font-size: 2.3rem; color: var(--accent); min-height: 1.2em; font-variant-numeric: tabular-nums; }
  .focus-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .focus-actions .btn-sm { padding: 0.5rem 0.95rem; }
  .focus-exit { margin-top: 0.4rem; color: var(--muted); font-size: 0.85rem; }
  .focus-exit:hover { color: var(--fg); }

  /* low-stim / calm mode: strip motion + flatten to calmer surfaces */
  :root[data-lowstim="1"] *, :root[data-lowstim="1"] *::before, :root[data-lowstim="1"] *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  :root[data-lowstim="1"] #rail::before, :root[data-lowstim="1"] .brand .mark, :root[data-lowstim="1"] #fab { background: var(--surface-2) !important; box-shadow: none !important; color: var(--fg) !important; }
  :root[data-lowstim="1"] #fab { border: 1px solid var(--border); }

  /* brain dump — a freeform scratch space */
  .bd-pane { position: fixed; inset: 0; z-index: 45; background: var(--app-bg); display: flex; flex-direction: column; animation: fade 0.18s ease; }
  .bd-head { display: flex; align-items: center; gap: 0.5rem; padding: calc(0.6rem + var(--safe-top, env(safe-area-inset-top))) 0.7rem 0.6rem; border-bottom: 1px solid var(--border); background: var(--surface); }
  .bd-title { font-family: var(--round); font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 0.4rem; flex: 1; }
  .bd-save { font-size: 0.7rem; color: var(--muted); min-width: 3.5rem; text-align: right; }
  .bd-area { flex: 1; width: 100%; border: none; background: var(--app-bg); color: var(--fg); padding: 1rem 1.1rem; font-family: var(--body-font); font-size: 1.02rem; line-height: 1.7; resize: none; }
  .bd-area:focus { outline: none; }
  .bd-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; padding: 0.6rem 0.8rem calc(0.6rem + var(--bottom-inset)); border-top: 1px solid var(--border); background: var(--surface); }
  .bd-bar .spacer { flex: 1; }

  /* multi-select + bulk actions */
  .card-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--fg) 30%, transparent);
    flex-shrink: 0; display: grid; place-items: center; font-size: 0.7rem; color: transparent; transition: background 0.14s, border-color 0.14s; }
  .card.picked .card-check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card.picked { outline: 2.5px solid var(--accent); outline-offset: 1px; }
  #bulkBar:empty { display: none; }
  .bulkbar { position: fixed; left: 0.8rem; right: 0.8rem; bottom: calc(4.6rem + var(--bottom-inset)); z-index: 36; background: var(--rail-bg); color: var(--rail-fg);
    border-radius: 16px; padding: 0.55rem 0.7rem; display: flex; align-items: center; gap: 0.4rem; box-shadow: var(--shadow-lg); animation: pop 0.22s var(--ease-spring); }
  .bulkbar .bk-count { font-family: var(--round); font-weight: 700; font-size: 0.85rem; padding-right: 0.3rem; white-space: nowrap; }
  .bulkbar button { color: var(--rail-fg); background: rgba(255,255,255,0.08); border-radius: 10px; padding: 0.42rem 0.6rem; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
  .bulkbar button:hover { background: rgba(255,255,255,0.16); }
  .bulkbar .bk-del { color: #ff8a8a; }
  .bulkbar .bk-spacer { flex: 1; }

  /* trash */
  .trash-actions { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0.2rem 0.7rem; }
  .trash-row { display: flex; align-items: center; gap: 0.55rem; padding: 0.7rem 0.85rem; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 0.5rem; }
  .trash-info { flex: 1; display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
  .trash-title { font-family: var(--serif); font-weight: 700; font-size: 0.96rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trash-when { font-size: 0.72rem; color: var(--muted); }

  /* daily affirmation */
  #affirm:empty { display: none; }
  .affirm-card { display: flex; align-items: center; gap: 0.6rem; margin: 0 0.9rem 0.55rem; padding: 0.55rem 0.85rem; border-radius: var(--radius);
    background: linear-gradient(120deg, var(--accent-soft), color-mix(in srgb, var(--moss) 14%, var(--surface))); border: 1px solid var(--border); box-shadow: var(--shadow-sm); animation: pop 0.3s var(--ease-spring); }
  .affirm-text { flex: 1; font-family: var(--serif); font-size: 0.94rem; line-height: 1.4; color: var(--fg); }
  .affirm-btns { display: flex; gap: 0.1rem; flex-shrink: 0; }
  .affirm-btn { color: var(--muted); font-size: 0.85rem; padding: 0.2rem 0.38rem; border-radius: 8px; transition: transform 0.12s var(--ease-spring), color 0.14s; }
  .affirm-btn:hover { color: var(--accent); }
  .affirm-btn:active { transform: scale(0.9); }

  /* ---------- Bottom tab bar (Notes / Pet) ---------------------------------- */
  #tabBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 37; display: flex;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 0.3rem 0.6rem calc(0.3rem + var(--bottom-inset)); box-shadow: 0 -8px 22px -14px rgba(0,0,0,0.3); }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; padding: 0.22rem 0.4rem;
    border-radius: 12px; color: var(--muted); transition: color 0.14s, background 0.14s, transform 0.12s var(--ease-spring); position: relative; }
  .tab-btn .tab-ic { font-size: 1.3rem; line-height: 1; }
  .tab-btn .tab-lbl { font-family: var(--round); font-size: 0.64rem; font-weight: 700; }
  .tab-btn.on { color: var(--accent); }
  .tab-btn:active { transform: scale(0.92); }
  .tab-avatar { width: 30px; height: 30px; border-radius: 50%; display: block; object-fit: cover;
    background: var(--surface-2); border: 2px solid transparent; transition: border-color 0.2s, box-shadow 0.2s; }
  .tab-btn.on .tab-avatar { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tab-btn .tab-dot { position: absolute; top: -1px; right: calc(50% - 19px); width: 8px; height: 8px; border-radius: 50%; background: #8b93d8; box-shadow: 0 0 0 2px var(--surface); }

  /* ---------- Pet page: a fixed cosmic-night scene, independent of the -----
     app's own light/dark theme (this is the pet's "place", not a themed
     screen) ----------------------------------------------------------------- */
  #petPage { display: none; position: fixed; inset: 0; flex-direction: column; background: #131217; }
  .pet-scene { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
    padding: var(--safe-top, env(safe-area-inset-top)) 1.2rem calc(4.6rem + var(--bottom-inset)); overflow-y: auto; position: relative; background: #131217; }
  .pet-hero { position: relative; width: 100%; margin: 0 -1.2rem; }
  .pet-photo { display: block; width: 100%; height: auto; }
  .pet-scene[data-mood="awake"] .pet-photo, .pet-scene[data-mood="new"] .pet-photo { animation: petBob 3.2s ease-in-out infinite; }
  .pet-scene[data-mood="asleep"] .pet-photo { animation: petBreathe 4s ease-in-out infinite; }
  @keyframes petBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes petBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }
  .pet-scene.stir .pet-photo { animation: petStir 0.6s var(--ease-spring) !important; }
  @keyframes petStir { 0%, 100% { transform: scale(1) rotate(0deg); } 30% { transform: scale(1.03) rotate(-1.5deg); } 60% { transform: scale(1.03) rotate(1deg); } }
  .pet-hero-fade { position: absolute; left: 0; right: 0; bottom: -1px; height: 40%; pointer-events: none;
    background: linear-gradient(to bottom, rgba(19,18,23,0) 0%, #131217 92%); }
  .pet-glow { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); width: 260px; height: 130px; pointer-events: none; z-index: 1; }
  .pet-glow span { position: absolute; inset: 0; border-radius: 50%; filter: blur(20px);
    background: radial-gradient(ellipse, rgba(255,196,120,0.45), transparent 70%); animation: bokeh 4.5s ease-in-out infinite; }
  .pet-scene[data-mood="asleep"] .pet-glow span { background: radial-gradient(ellipse, rgba(150,165,255,0.38), transparent 70%); }
  @keyframes bokeh { 0%, 100% { transform: scale(0.94); opacity: 0.7; } 50% { transform: scale(1.06); opacity: 1; } }
  .pet-zzz { position: absolute; top: 6%; right: 20%; font-family: var(--round); font-weight: 800; color: #d8dcff; font-size: 1.5rem; opacity: 0; z-index: 3; pointer-events: none; }
  .pet-scene[data-mood="asleep"] .pet-zzz.z1 { animation: zzzFloat 3.2s ease-in 0s infinite; }
  .pet-scene[data-mood="asleep"] .pet-zzz.z2 { animation: zzzFloat 3.2s ease-in 1.5s infinite; font-size: 1.1rem; right: 28%; top: 2%; }
  @keyframes zzzFloat { 0% { opacity: 0; transform: translate(0, 0) scale(0.7); } 25% { opacity: 0.85; } 100% { opacity: 0; transform: translate(20px, -46px) scale(1.15); } }
  .pet-namewrap { z-index: 2; margin-top: -0.6rem; }
  .pet-name { background: none; border: none; border-bottom: 1.5px dashed transparent; text-align: center; font-family: var(--serif);
    font-weight: 700; font-size: 1.55rem; color: #f6ecd8; width: 11ch; padding: 0.1rem 0; }
  .pet-name:focus { outline: none; border-color: #f0b86e; }
  .pet-species-row { display: flex; gap: 0.4rem; z-index: 2; justify-content: center; margin-top: -0.2rem; }
  .pet-species-btn { background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12); border-radius: 99px;
    width: 2.1rem; height: 2.1rem; font-size: 1.05rem; display: grid; place-items: center; opacity: 0.55; transition: transform 0.15s var(--ease-spring), opacity 0.15s, border-color 0.15s; }
  .pet-species-btn:active { transform: scale(0.9); }
  .pet-species-btn.on { opacity: 1; border-color: #f0b86e; background: rgba(240,184,110,0.14); }
  .pet-mood-label { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 0.95rem; color: #c7c1de; z-index: 2; text-align: center; }
  .pet-stat-row { display: flex; gap: 0.55rem; z-index: 2; flex-wrap: wrap; justify-content: center; margin-top: 0.15rem; }
  .pet-stat-pill { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 99px; padding: 0.3rem 0.75rem; font-size: 0.76rem; font-weight: 700; color: #f0ead9; }
  .pet-action-btn { z-index: 2; margin-top: 0.35rem; border: none; border-radius: 99px; padding: 0.75rem 1.7rem; font-family: var(--round); font-weight: 800; font-size: 0.98rem;
    background: linear-gradient(135deg, #f6c98a, #e08a4a); color: #4a2f14;
    box-shadow: 0 10px 26px -10px rgba(224,138,74,0.65), inset 0 0 0 1px rgba(255,255,255,0.2);
    display: flex; align-items: center; gap: 0.5rem; transition: transform 0.15s var(--ease-spring); }
  .pet-action-btn:active { transform: scale(0.96); }
  .pet-msg { font-size: 0.86rem; color: #a9a3c0; text-align: center; max-width: 24rem; line-height: 1.5; z-index: 2; margin-top: 0.5rem; }
  .pet-tasks { z-index: 2; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 0.55rem; margin-top: 1rem; }
  .pet-tasks-title { color: #c7c1de; font-family: var(--round); font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 0 0.2rem; }
  .pet-task-row { display: flex; align-items: flex-start; gap: 0.65rem; background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 0.7rem 0.8rem; box-shadow: 0 0 22px -13px rgba(255,196,120,0.4); }
  .pet-task-check { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.2);
    display: grid; place-items: center; font-size: 1rem; flex-shrink: 0; color: #f3e3c8; font-weight: 800; transition: background 0.15s, border-color 0.15s, transform 0.12s var(--ease-spring); }
  .pet-task-check:active { transform: scale(0.88); }
  .pet-task-check.done { background: color-mix(in srgb, #7fb56e 55%, transparent); border-color: #7fb56e; }
  .pet-task-body { flex: 1; min-width: 0; cursor: pointer; }
  .pet-task-top { display: flex; align-items: center; gap: 0.4rem; }
  .pet-task-title { color: #f3e3c8; font-weight: 700; font-size: 0.9rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pet-task-tag { font-size: 0.64rem; font-weight: 700; padding: 0.12rem 0.5rem; border-radius: 99px; white-space: nowrap; }
  .pet-task-tag.done { background: rgba(127,181,110,0.28); color: #a8e0a0; }
  .pet-task-tag.pending { background: rgba(255,196,120,0.18); color: #f0c98a; }
  .pet-task-desc { color: #a9a3c0; font-size: 0.76rem; line-height: 1.4; margin-top: 0.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pet-empty-tasks { color: #a9a3c0; font-size: 0.85rem; text-align: center; padding: 0.6rem; background: rgba(255,255,255,0.04); border-radius: 14px; }

  /* ---------- Calendar page: month grid of notes/reminders/routines ------- */
  #calendarPage { display: none; position: fixed; inset: 0; flex-direction: column; background: var(--app-bg); color: var(--fg); }
  .cal-scroll { flex: 1; overflow-y: auto; padding: calc(0.8rem + var(--safe-top, env(safe-area-inset-top))) 0.8rem calc(4.6rem + var(--bottom-inset)); touch-action: pan-y; overscroll-behavior-y: contain; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.7rem; }
  .cal-month { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; }
  .cal-nav { display: flex; align-items: center; gap: 0.3rem; }
  .cal-navbtn { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--border); color: var(--fg); font-size: 1rem; display: grid; place-items: center; }
  .cal-navbtn:active { background: var(--accent-soft); }
  .cal-today-btn { font-family: var(--round); font-weight: 700; font-size: 0.76rem; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 0.32rem 0.7rem; }
  .cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 0.3rem; }
  .cal-dow { text-align: center; font-family: var(--round); font-weight: 700; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  /* Matched to the reference (Samsung Calendar): cells sit edge-to-edge with
     only a hairline gap -- no per-cell border/shadow "card" look -- and get
     a colored background fill (not a dot) on days that have something on
     them, same as the reference's dark-red day fill. */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  /* Every cell is a fixed, identical size no matter what's in it -- content
     that doesn't fit is clipped (overflow: hidden), never allowed to grow
     the cell. A row growing to fit its busiest day while other rows stay
     short reads as a jagged, uneven grid, which is exactly what this must
     never do. */
  .cal-day { box-sizing: border-box; aspect-ratio: 1; overflow: hidden; border-radius: 8px; background: var(--surface); border: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 0.3rem 0.1rem 0.15rem; gap: 0.1rem; }
  .cal-day.out { opacity: 0.35; }
  .cal-day.has-items { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
  .cal-day.today .cal-daynum { color: var(--accent); }
  .cal-daynum { font-family: var(--round); font-weight: 700; font-size: 0.82rem; line-height: 1; padding: 0.15rem 0.4rem; border-radius: 8px; }
  /* Selected day: a filled pill around just the number (compact mode), same
     as the reference -- not a border around the whole cell. */
  .cal-day.sel .cal-daynum { background: var(--fg); color: var(--app-bg); }
  .cal-day-bar { width: 60%; height: 2.5px; border-radius: 2px; background: var(--accent); margin-top: 0.1rem; }
  .cal-day-bar.routine { background: var(--moss); }
  .cal-expand-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  /* Expanded mode (Samsung Calendar-style): cells grow tall and show the
     actual item titles inline instead of just a color fill. Selection here
     is a border around the whole cell (matching the reference's own
     compact-vs-expanded difference), since the number-pill would get lost
     among the inline item text. */
  .cal-grid.expanded .cal-day { aspect-ratio: auto; height: 4.8rem; align-items: flex-start; justify-content: flex-start; padding: 0.3rem 0.25rem; background: var(--surface); }
  .cal-grid.expanded .cal-day.sel { box-shadow: 0 0 0 1.5px var(--accent) inset; }
  .cal-grid.expanded .cal-day.sel .cal-daynum { background: none; color: var(--accent); padding: 0; }
  .cal-grid.expanded .cal-daynum { align-self: flex-start; padding: 0; }
  .cal-day-chips { display: flex; flex-direction: column; gap: 0.12rem; width: 100%; margin-top: 0.1rem; }
  .cal-day-chip { display: flex; align-items: center; gap: 0.2rem; width: 100%; overflow: hidden; }
  .cal-day-chip-bar { width: 3px; align-self: stretch; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
  .cal-day-chip-bar.routine { background: var(--moss); }
  .cal-day-chip-text { font-size: 0.58rem; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); text-align: left; }
  .cal-day-more { font-size: 0.56rem; color: var(--muted); font-weight: 700; align-self: flex-start; }
  .cal-daypanel { margin-top: 1rem; }
  .cal-daypanel-title { font-family: var(--serif); font-weight: 700; font-size: 1rem; margin-bottom: 0.5rem; }
  .cal-item { display: block; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem 0.75rem; margin-bottom: 0.4rem; color: var(--fg); }
  .cal-item-head { display: flex; align-items: center; gap: 0.55rem; }
  .cal-item-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .cal-item-dot.routine { background: var(--moss); }
  .cal-item-title { flex: 1; font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-item-time { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }
  .cal-item-text { margin-top: 0.35rem; font-size: 0.82rem; line-height: 1.4; color: color-mix(in srgb, var(--fg) 78%, transparent);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
  .cal-item-empty { margin-top: 0.35rem; font-size: 0.82rem; color: var(--muted); }
  .cal-item-cl { margin-top: 0.35rem; display: flex; flex-direction: column; gap: 0.2rem; }
  .cal-item-clrow { display: flex; align-items: flex-start; gap: 0.4rem; font-size: 0.82rem; line-height: 1.35; }
  .cal-item-clrow.done { color: var(--muted); text-decoration: line-through; }
  .cal-item-ck { flex-shrink: 0; opacity: 0.6; }
  .cal-item-more { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
  .cal-add-btn { width: 100%; margin-top: 0.3rem; border: 1.5px dashed var(--border); border-radius: var(--radius-sm); padding: 0.65rem; color: var(--accent); font-weight: 700; font-size: 0.85rem; background: none; }
  .cal-add-btn:active { background: var(--accent-soft); }
  .cal-empty { color: var(--muted); font-size: 0.85rem; padding: 0.4rem 0.1rem 0.7rem; }

  /* ---------- Today: everything due right now, in one glance -------------
     Reuses the calendar's own .cal-item/.cal-item-cl styles for the actual
     cards (same visual language, no need to invent a second one) — this
     page just decides WHICH items to show (today's routines/reminders,
     plus anything overdue) and adds inline checkbox tapping so acting on
     something never requires leaving this page. */
  #todayPage { display: none; position: fixed; inset: 0; flex-direction: column; background: var(--app-bg); color: var(--fg); }
  .today-scroll { flex: 1; overflow-y: auto; padding: calc(0.8rem + var(--safe-top, env(safe-area-inset-top))) 0.8rem calc(4.6rem + var(--bottom-inset)); }
  .today-header { margin-bottom: 0.8rem; }
  .today-title { font-family: var(--serif); font-weight: 700; font-size: 1.25rem; }
  .today-empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 3rem 1rem; line-height: 1.6; }

  /* ---------- Responsive (single column at ALL widths) --------------------- */
  /* One centered column everywhere so the page can never scroll sideways —
     the rail is an overlay drawer, and list / editor swap in place. */
  .mbar-right { display: flex; gap: 0.4rem; align-items: center; }
  .backbar { display: inline-flex; align-items: center; gap: 0.2rem; color: var(--accent);
    font-family: var(--round); font-weight: 700; font-size: 1rem; padding: 0.4rem 0.7rem 0.4rem 0.25rem; border-radius: 10px; }
  .backbar:active { background: var(--accent-soft); }

  .only-mobile { display: inline-flex; }
  .only-desktop { display: none; }
  #railScrim { display: none; }
  #search { min-width: 0; }

  #rail { position: fixed; top: 0; left: 0; z-index: 30; width: 250px; max-width: 84vw; height: 100%; transform: translateX(-110%); transition: transform 0.24s var(--ease-spring);
    overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(0.9rem + var(--bottom-inset)); }
  #app.rail-open #rail { transform: none; box-shadow: var(--shadow-lg); }
  #app.rail-open #railScrim { display: block; position: fixed; inset: 0; z-index: 29; background: rgba(0,0,0,0.4); animation: fade 0.18s ease; }

  #editor { display: none; padding: calc(1.1rem + var(--safe-top, env(safe-area-inset-top))) 1.1rem calc(9.5rem + var(--bottom-inset)); }
  #app[data-selected="1"] #listcol { display: none; }
  #app[data-selected="1"] #editor { display: block; }

  .mbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
  .drawer { width: 330px; max-width: 92vw; }
  .ed-title { font-size: 1.55rem; }

  /* Hosted as a normal web page, the phone reports its true width, so we just
     center a single readable column: full-width 2-up on phones, roomier on
     wider screens. No horizontal scroll at any size. */
  #listcol { max-width: 600px; margin: 0 auto; width: 100%; }
  #editor { max-width: 720px; margin: 0 auto; width: 100%; }

  @media (min-width: 1024px) {
    #listcol { max-width: 820px; }
    #editor { max-width: 780px; padding: 1.6rem 1.4rem calc(9rem + var(--bottom-inset)); }
    .ed-title { font-size: 1.85rem; }
  }
</style>

  // ---- today's routines, shown right on the Pet page ----
  function petTodaysRoutines() { return notes.filter((n) => n.kind === "checklist" && n.repeat && n.repeat !== "none" && !n.deleted); }
  function petTaskRowHTML(n) {
    const items = n.items || [];
    const done = items.length > 0 && items.every(itemDone);
    const doneCount = items.filter(itemDone).length;
    let m = null; try { m = (n.title || "").match(/^(\p{Extended_Pictographic}️?)\s*/u); } catch (e) {}
    const icon = m ? m[1] : "🔁";
    const title = m ? n.title.slice(m[0].length).trim() : (n.title || "Untitled");
    const desc = items.length ? items.slice(0, 2).map((i) => esc(i.text || "…")).join(" · ") + (items.length > 2 ? "…" : "") : "No steps yet";
    const tag = done ? "Done today" : (items.length ? doneCount + "/" + items.length : "To do");
    return `<div class="pet-task-row">
      <button class="pet-task-check ${done ? "done" : ""}" data-routineid="${n.id}" aria-label="Mark today done">${done ? "✓" : ""}</button>
      <div class="pet-task-body" data-opennote="${n.id}">
        <div class="pet-task-top"><span class="pet-task-title">${icon} ${esc(title)}</span><span class="pet-task-tag ${done ? "done" : "pending"}">${tag}</span></div>
        <div class="pet-task-desc">${desc}</div>
      </div>
    </div>`;
  }
  function petToggleRoutine(id) {
    const n = notes.find((x) => x.id === id); if (!n || !(n.items || []).length) return;
    const wasAllDone = n.items.every(itemDone);
    const nowDone = !wasAllDone;
    n.items.forEach((it) => { it.checked = nowDone; if (it.sub && it.sub.length) it.sub.forEach((s) => (s.checked = nowDone)); });
    touch(n); saveSoon();
    if (nowDone) bumpStat();
    markRoutineDay(n);
    if (nowDone) { playChime(); celebrate(); }
    refreshCard(n.id);
    renderPet();
  }
  function renderPet() {
    const page = $("#petPage"); if (!page) return;
    const state = petState();
    const name = prefs.petName || "Chip";
    const species = prefs.petSpecies === "koala" ? "koala" : "squirrel";
    const dayHash = tagHash(todayKey());
    const msg = state === "asleep" ? PET_ASLEEP_MSGS[dayHash % PET_ASLEEP_MSGS.length] : PET_AWAKE_MSGS[dayHash % PET_AWAKE_MSGS.length];
    const routines = petTodaysRoutines();
    const tasksHTML = `<div class="pet-tasks"><div class="pet-tasks-title">Today's routines</div>${
      routines.length ? routines.map(petTaskRowHTML).join("") : `<div class="pet-empty-tasks">No routines yet — add one from ☰ → Routines.</div>`
    }</div>`;
    page.innerHTML = `
      <div class="pet-scene" data-mood="${state}" id="petScene">
        <div class="pet-hero">
          <img class="pet-photo" id="petPhoto" src="${PET_IMG[species][state]}" alt="${esc(name)} the ${species}" />
          <div class="pet-glow"><span></span></div>
          ${state === "asleep" ? `<span class="pet-zzz z1">z</span><span class="pet-zzz z2">z</span>` : ""}
          <div class="pet-hero-fade"></div>
        </div>
        <div class="pet-namewrap"><input class="pet-name" id="petNameInput" value="${esc(name)}" maxlength="18" aria-label="Pet's name" /></div>
        <div class="pet-species-row" id="petSpeciesRow">
          <button class="pet-species-btn ${species === "squirrel" ? "on" : ""}" data-species="squirrel" aria-label="Squirrel" aria-pressed="${species === "squirrel"}">🐿️</button>
          <button class="pet-species-btn ${species === "koala" ? "on" : ""}" data-species="koala" aria-label="Koala" aria-pressed="${species === "koala"}">🐨</button>
        </div>
        <div class="pet-mood-label">${petMoodLabel(state, esc(name))}</div>
        <div class="pet-stat-row"><span class="pet-stat-pill">🔥 ${streakCount()}-day streak</span><span class="pet-stat-pill">⭐ Lv ${levelFor(stats.xp || 0)}</span></div>
        <button class="pet-action-btn" id="petPetBtn">${state === "asleep" ? `🤫 Let ${esc(name)} rest` : "👋 Give a pat"}</button>
        <div class="pet-msg">${esc(msg)}</div>
        ${tasksHTML}
      </div>`;
    const scene = $("#petScene");
    const photo = $("#petPhoto");
    let stirT = null;
    const stir = () => {
      scene.classList.add("stir");
      if (photo) photo.src = PET_IMG[species].stir;
      clearTimeout(stirT);
      stirT = setTimeout(() => { scene.classList.remove("stir"); if (photo) photo.src = PET_IMG[species][state]; }, 1300);
    };
    scene.addEventListener("click", (e) => {
      if (e.target.closest("#petNameInput, #petPetBtn, [data-routineid], [data-opennote], #petSpeciesRow")) return;
      stir();
    });
    const nameInput = $("#petNameInput");
    if (nameInput) nameInput.addEventListener("change", () => { prefs.petName = nameInput.value.trim() || "Chip"; savePrefs(); renderPet(); });
    $("#petSpeciesRow")?.querySelectorAll("[data-species]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (btn.dataset.species === species) return;
        prefs.petSpecies = btn.dataset.species;
        savePrefs();
        renderPet();
      });
    });
    const petBtn = $("#petPetBtn"); if (petBtn) petBtn.onclick = () => { stir(); playChime(); };
    scene.querySelectorAll("[data-routineid]").forEach((el) => el.addEventListener("click", (e) => { e.stopPropagation(); petToggleRoutine(el.dataset.routineid); }));
    scene.querySelectorAll("[data-opennote]").forEach((el) => el.addEventListener("click", (e) => {
      e.stopPropagation(); selectedId = el.dataset.opennote; showPage("notes"); renderList(); renderEditor(); setSelectedFlag();
    }));
  }
  // Notes, Calendar, and Pet are full-screen pages; only one is ever mounted,
  // so there's no scenario where completing a task happens while another is
  // showing — each page's render function just recomputes fresh on switch-in.
  function showPage(page) {
    const isPet = page === "pet", isCal = page === "calendar", isToday = page === "today";
    $("#app").style.display = (isPet || isCal || isToday) ? "none" : "";
    $("#petPage").style.display = isPet ? "flex" : "none";
    $("#calendarPage").style.display = isCal ? "flex" : "none";
    $("#todayPage").style.display = isToday ? "flex" : "none";
    $("#fab").style.display = (isPet || isCal || isToday || selecting) ? "none" : "";
    $("#tabToday").classList.toggle("on", isToday);
    $("#tabNotes").classList.toggle("on", !isPet && !isCal && !isToday);
    $("#tabCalendar").classList.toggle("on", isCal);
    $("#tabPet").classList.toggle("on", isPet);
    if (isPet) renderPet();
    if (isCal) renderCalendarPage();
    if (isToday) renderTodayPage();
  }
  // A soft, non-alarming dot on the Pet tab when asleep — informational, not
  // a notification demanding attention (no count, no red, no pulsing).
  function updatePetTabBadge() {
    const tab = $("#tabPet"); if (!tab) return;
    const existing = tab.querySelector(".tab-dot"); if (existing) existing.remove();
    if (petState() === "asleep") { const dot = document.createElement("span"); dot.className = "tab-dot"; tab.appendChild(dot); }
  }

  // ---- Calendar: a month view of notes' reminders and recurring routines --
  // Nothing new to add here — it's the SAME notes/reminders/routines you
  // already make, just surfaced by date. "Add" creates a normal note (like
  // the + button anywhere else) pinned to that day via its existing remindAt
  // field, rather than inventing a second, separate kind of calendar event.
  let calViewDate = new Date(); calViewDate.setHours(0, 0, 0, 0); calViewDate.setDate(1);
  let calSelectedDay = todayKeyAt(new Date());
  // Everything landing on `dayKey` (a "YYYY-MM-DD" from todayKeyAt): notes
  // with a plain remindAt that day, plus recurring checklists whose most
  // recent scheduled occurrence at end-of-day falls on that day (and isn't
  // from before the routine even existed, so a monthly routine created this
  // week doesn't appear to have already happened every month this year).
  function itemsForDay(dayKey) {
    const items = [];
    activeNotes().forEach((n) => {
      if (n.kind === "checklist" && n.repeat && n.repeat !== "none") {
        const endOfDay = new Date(dayKey + "T23:59:59");
        const occ = mostRecentOccurrence(n.repeat, scheduleOf(n), endOfDay);
        if (todayKeyAt(occ) === dayKey && occ >= new Date(n.created || 0)) {
          items.push({ note: n, routine: true, time: occ });
        }
        return;
      }
      if (n.remindAt) {
        const d = new Date(n.remindAt);
        if (!isNaN(d) && todayKeyAt(d) === dayKey) items.push({ note: n, routine: false, time: d });
      }
    });
    items.sort((a, b) => a.time - b.time);
    return items;
  }

  // ---- Today: everything due right now, in one glance ---------------------
  // Exactly the same items itemsForDay() already surfaces for today's date
  // on the calendar (routines due today, plus notes reminding today) -- just
  // surfaced as its own page instead of a calendar day-panel, with checklist
  // rows wired up as real, tappable checkboxes so acting on something never
  // requires leaving the page. (No separate "overdue" section: a past-due
  // reminder already fires and gets marked handled the moment the app next
  // opens -- see fireReminder()/scheduleReminders() -- so by the time
  // anyone would look at this page there's nothing left in that state to
  // show.)
  function todayItemBody(n) {
    if (n.kind === "checklist" || (n.kind === "brainstorm" && n.bsView === "list")) {
      const items = n.items || [];
      if (!items.length) return `<div class="cal-item-empty">Empty checklist</div>`;
      const shown = items.slice(0, 6);
      return `<div class="cal-item-cl">${shown.map((it) => `
        <div class="cal-item-clrow ${itemDone(it) ? "done" : ""}" data-todaytoggle="${it.id}" data-note="${n.id}">
          <span class="cal-item-ck">${itemDone(it) ? "●" : "○"}</span><span>${esc(it.text) || "…"}</span>
        </div>`).join("")}</div>${items.length > 6 ? `<div class="cal-item-more">+ ${items.length - 6} more</div>` : ""}`;
    }
    const txt = stripHtml(n.content);
    return txt ? `<div class="cal-item-text">${esc(txt)}</div>` : "";
  }
  function renderTodayPage() {

  // horizontal one works everywhere since this page never scrolls sideways.

  function wireCalendarSwipe(scrollEl, isExpanded) {

    // begun is always one gesture too late. It has to already be correct
    // *before* the next finger comes down, which means keeping it synced to
    // the live scroll position instead. This has to be a flat "none" (not a
    // finer-grained pan-up/pan-down) once armed -- blocking only one
    // direction still let the browser's own scroll take over the whole
    // gesture in testing, so the direction we're NOT claiming (scrolling
    // forward into the day panel from the very top) is instead forwarded
    // by hand below, in onMove.

      }
      if (axis === "x" || (axis === "y" && vArmed)) e.preventDefault();
      if (axis === "x") {
        if (dx < -H_THRESHOLD) {
          dragging = false; axis = null;
          calViewDate.setMonth(calViewDate.getMonth() + 1); renderCalendarPage();
        } else if (dx > H_THRESHOLD) {
          dragging = false; axis = null;

        }
      } else if (axis === "y" && vArmed) {
        const wantsExpand = !isExpanded && dy > 0;
        const wantsCollapse = isExpanded && dy < 0;
        if (wantsExpand && dy > V_THRESHOLD) {

        } else if (wantsCollapse && dy < -V_THRESHOLD) {

        } else if (!wantsExpand && !wantsCollapse) {

          // into the day panel's notes, starting right from the top. Native
          // scrolling is blocked for this whole gesture (touch-action is
          // "none" while armed), so replicate it by hand.

  // ---- "Pick for me" randomizer (executive-function helper) ----
  const RND_PRESETS = {

  function secureIndex(n) {
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
    catch (e) { return Math.floor(Math.random() * n); }
  }
  // Turn the box into a list of choices. A lone range like "1-10" or "A-F" expands.
  function parseChoices(text) {
    const raw = text.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean);
    if (raw.length === 1) {
      const num = raw[0].match(/^(-?\d+)\s*[-–]\s*(-?\d+)$/);
      const alpha = raw[0].match(/^([A-Za-z])\s*[-–]\s*([A-Za-z])$/);
      if (num) {
        let a = +num[1], b = +num[2], out = [], step = a <= b ? 1 : -1;
        for (let i = a; ; i += step) { out.push(String(i)); if (i === b || out.length > 500) break; }
        return out;
      }
      if (alpha) {
        let a = alpha[1].charCodeAt(0), b = alpha[2].charCodeAt(0), out = [], step = a <= b ? 1 : -1;
        for (let i = a; ; i += step) { out.push(String.fromCharCode(i)); if (i === b) break; }

  // ---- focus mode: one task at a time, with a 5-minute body-double timer ----

  function focusFmt() { return focusRemain > 0 ? `${Math.floor(focusRemain / 60)}:${String(focusRemain % 60).padStart(2, "0")}` : ""; }
  function openFocus(n) {
    const root = $("#modalRoot");
    function draw() {
      const todo = (n.items || []).filter((it) => !itemDone(it));
      if (!todo.length) {
        stopFocusTimer();
        root.innerHTML = `<div class="focus"><div class="focus-inner"><div class="focus-big">🎉</div><div class="focus-task">All done!</div><p style="color:var(--muted);margin:0">You cleared this whole list. 🌰</p><button class="btn-sm accent" id="focusClose">Nice!</button></div></div>`;
        $("#focusClose").onclick = closeSettings; celebrate(); playChime();

      }

      root.innerHTML = `<div class="focus"><div class="focus-inner">
        <div class="focus-count">Task ${pos} of ${n.items.length}</div>

        const o = audioCtx.createOscillator(), g = audioCtx.createGain();

  const HL_CLASS_RE = /^hl-[1-7]$/;

  // inside a list item ends that list, drops the image in as its own
  // sibling, and starts a NEW list right after it — so what should be item
  // 2 renumbers itself from 1, with the photo sitting as a break between
  // the two <ol>/<ul> elements. Two lists of the same type with nothing but
  // photos between them are never intentional (there's no toolbar action

  // photos onto the end of the first list's last item and merges the

  // item it was added to. An <li> containing nothing but photo(s) and
  // whitespace only ever comes from that, never from anything a person
  // would type on purpose, so it's folded onto the end of the PREVIOUS

              continue;
            }
            for (const a of [...child.attributes]) { if ((keepClass && a.name === "class") || (keepSrc && a.name === "src")) continue; child.removeAttribute(a.name); }
            clean(child);
            child = child.nextSibling;
          } else {
            const next = child.nextSibling, first = child.firstChild;
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            child = first || next;
          }
        } else if (child.nodeType === 3) {
          child = child.nextSibling;
        } else {
          const rm = child; child = child.nextSibling; node.removeChild(rm);
        }
      }
    })(root);
    mergeAdjacentLists(root);
    absorbImageOnlyListItems(root);
    const out = document.createElement("div");
    out.appendChild(root);
    return out.innerHTML;
  }
  // Plain-text search/preview corpus from rich HTML — block-level tags become
  // spaces so words from different lines don't run together.
  function stripHtml(html) {
    return String(html || "")
      .replace(/<(br|\/div|\/p|\/li|\/h2|\/h3)\s*\/?>/gi, " ")
      .replace(/<[^>]+>/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }
  // Notes saved before rich text shipped are plain strings with real newline
  // characters — wrap each line in its own <div> so they keep displaying as
  // separate lines once the editor becomes a contenteditable.
  function legacyPlainToHtml(text) {
    if (!text || !text.trim()) return "";
    return text.split("\n").map((line) => `<div>${line ? esc(line) : "<br>"}</div>`).join("");
  }
  function richInitialHTML(n) {
    if (!n.content) return "";
    if (/<(b|strong|i|em|h2|h3|ul|ol|li|br|div|p)[\s>]/i.test(n.content)) return sanitizeRichHTML(n.content);
    return legacyPlainToHtml(n.content);
  }
  function preview(n) {
    if (n.kind === "checklist") { const done = (n.items || []).filter(itemDone).length; return (n.items || []).length ? done + " of " + n.items.length + " done" : "Empty checklist"; }
    if (n.kind === "brainstorm") {
      if (n.bsView === "list") { const done = (n.items || []).filter(itemDone).length; return (n.items || []).length ? done + " of " + n.items.length + " done" : "Empty checklist"; }
      const count = (n.bsNodes || []).length;
      return count ? count + " idea" + (count === 1 ? "" : "s") : "Empty brainstorm";
    }
    return stripHtml(n.content).slice(0, 100) || "Empty note";
  }

  const ACORN = (on) => `<svg class="acorn${on ? " on" : ""}" viewBox="0 0 24 24" aria-hidden="true"><path class="cap" d="M4.4 10 C4.4 6.1 7.8 3.7 12 3.7 C16.2 3.7 19.6 6.1 19.6 10 C19.6 10.7 19 11.1 18.3 11.1 L5.7 11.1 C5 11.1 4.4 10.7 4.4 10 Z"/><path class="stem" d="M12 3.7 V1.7"/><path class="nut" d="M6 11.1 C6 15.8 8.4 20.3 12 20.3 C15.6 20.3 18 15.8 18 11.1 Z"/></svg>`;

  function timeAgo(iso) {
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 50) return "just now";
    const m = s / 60; if (m < 60) return Math.round(m) + "m ago";
    const h = m / 60; if (h < 24) return Math.round(h) + "h ago";
    const d = h / 24; if (d < 7) return Math.round(d) + "d ago";
    return new Date(iso).toLocaleDateString();
  }

  function cardInner(n) {
    const isChk = n.kind === "checklist" || (n.kind === "brainstorm" && n.bsView === "list");
    const isBsMap = n.kind === "brainstorm" && n.bsView !== "list";
    let body;
    if (isChk) {
      const items = n.items || [];
      const shown = items.slice(0, 6);
      body = items.length
        ? `<div class="cl">${shown.map((it) => `<div class="cl-row ${itemDone(it) ? "done" : ""}"><span class="cbx" data-cardtoggle="${it.id}">${ACORN(itemDone(it))}</span><span class="t">${esc(it.text) || "…"}${(it.sub && it.sub.length) ? ` <span style="opacity:.5">(${it.sub.filter((s) => s.checked).length}/${it.sub.length})</span>` : ""}</span></div>`).join("")}</div>${items.length > 6 ? `<div class="more">+ ${items.length - 6} more</div>` : ""}`
        : `<div class="card-text" style="opacity:.6">Empty checklist</div>`;
    } else if (isBsMap) {
      const branches = (n.bsNodes || []).filter((b) => !b.parentId);
      const shown = branches.slice(0, 6);
      body = branches.length
        ? `<div class="cl">${shown.map((b) => `<div class="cl-row"><span class="t">${esc(b.text) || "…"}</span></div>`).join("")}</div>${branches.length > 6 ? `<div class="more">+ ${branches.length - 6} more</div>` : ""}`
        : `<div class="card-text" style="opacity:.6">Empty brainstorm</div>`;
    } else {
      const txt = stripHtml(n.content);
      body = txt ? `<div class="card-text">${esc(txt)}</div>` : `<div class="card-text" style="opacity:.55">Empty note</div>`;
    }
    const tags = (n.tags || []).length ? `<div class="card-tags">${n.tags.slice(0, 4).map((t) => `<span class="minitag" style="background:color-mix(in srgb, ${tagColor(t)} 32%, transparent);color:color-mix(in srgb, ${tagColor(t)} 55%, var(--fg))">#${esc(t)}</span>`).join("")}</div>` : "";
    const cphoto = (n.photos && n.photos.length)
      ? `<div class="card-photo"><img src="${n.photos[0]}" loading="lazy" alt="" />${n.photos.length > 1 ? `<span class="card-photo-n">+${n.photos.length - 1}</span>` : ""}</div>`
      : "";
    const grip = !selecting ? `<span class="card-grip" title="Drag to reorder">⠿</span>` : "";
    const check = selecting ? `<span class="card-check">${selectedIds.has(n.id) ? "✓" : ""}</span>` : "";
    const star = selecting ? "" : `<span class="card-star ${n.pinned ? "on" : ""}" data-pin="${n.id}" title="Pin">★</span>`;
    return `<div class="card-top">${grip}${check}<span class="card-title">${esc(n.title) || "Untitled"}</span>${star}</div>
      <div class="card-time">${isBsMap ? "🕸️ " : isChk ? "✓ " : "✎ "}${timeAgo(n.updated)}${n.repeat && n.repeat !== "none" ? ` · 🔁 ${n.repeat}` : ""}${n.repeat && n.repeat !== "none" && noteStreakCount(n) > 0 ? ` · 🔥${noteStreakCount(n)}` : ""}${n.remindAt && !n.remindDone ? " · ⏰" : ""}</div>
      ${cphoto}${body}${tags}`;
  }

  // Auto color for an untagged, uncolored note — deterministic per note id,
  // drawn from the palette MINUS any color already used by an existing tag.
  function autoColorFor(n) {
    const used = new Set(allTags().map(tagColor));
    const avail = TAG_PALETTE.filter((c) => !used.has(c));
    const pool = avail.length ? avail : TAG_PALETTE;
    return pool[tagHash(n.id) % pool.length];
  }
  // A manually-set color wins; then the first tag's color; then an auto color.
  function effectiveColor(n) {
    if (n.color) return n.color;
    if (prefs.colorByTag && (n.tags || []).length) return tagColor(n.tags[0]);
    if (prefs.autoColor) return autoColorFor(n);
    return null;
  }
  // Untouched notes quietly lose their color over time — no badge, no
  // "overdue" language, just a gentle visual fade (mirrors the pet drifting
  // off to sleep). Pinned notes and active routines are exempt since those
  // are meant to sit there. Editing a note (touch()) resets it to full color.
  function noteFadeFactor(n) {
    if (n.pinned || (n.repeat && n.repeat !== "none")) return 0;
    const days = (Date.now() - new Date(n.updated).getTime()) / 86400000;
    if (days <= 3) return 0;
    if (days >= 30) return 1;
    return (days - 3) / (30 - 3);
  }
  function cardStyle(n) {
    if (prefs.lowStim) return "";
    const raw = effectiveColor(n);
    if (!raw) return "";
    const fade = noteFadeFactor(n);
    const c = fade > 0 ? `color-mix(in srgb, ${esc(raw)} ${Math.round((1 - fade) * 100)}%, var(--muted))` : esc(raw);
    return `style="background:color-mix(in srgb, ${c} 20%, var(--surface));border-color:color-mix(in srgb, ${c} 42%, var(--border))"`;
  }

  function refreshCard(id) {
    const n = notes.find((x) => x.id === id); const el = $(`.card[data-id="${id}"]`);
    if (n && el) el.innerHTML = cardInner(n);
  }

  function renderList() {
    const ul = $("#list");

    const list = visibleNotes();

      ul.innerHTML = `<li class="empty">Nothing stashed yet 🌰<br>Tap the ＋ button to capture your first thought.</li>`;
      renderBulkBar();

    }
    ul.innerHTML = list.map((n) => `<li><button class="card ${n.id === selectedId && !selecting ? "sel" : ""} ${selecting && selectedIds.has(n.id) ? "picked" : ""}" data-id="${n.id}" ${cardStyle(n)}>${cardInner(n)}</button></li>`).join("");
    ul.querySelectorAll(".card").forEach((el) => el.addEventListener("click", (e) => {

        renderList();
        return;

    }));

  function renderTrashRows(ul) {
    const list = visibleNotes(); // filter.trash is true here: deleted notes, most-recently-deleted first
    if (!list.length) { ul.innerHTML = `<li class="empty">Trash is empty 🌰</li>`; return; }

      + list.map((n) => `<li><div class="trash-row"><div class="trash-info"><span class="trash-title">${esc(n.title) || "Untitled"}</span><span class="trash-when">Deleted ${timeAgo(n.deleted)}</span></div><button class="btn-sm" data-restore="${n.id}">Restore</button><button class="del-btn" data-purge="${n.id}">Delete forever</button></div></li>`).join("");
    const eb = $("#emptyTrashBtn");

    ul.querySelectorAll("[data-purge]").forEach((el) => el.onclick = () => { if (confirm("Delete this note forever? This can't be undone.")) purgeNote(el.dataset.purge); });
  }

  // ---- multi-select bulk actions ----
  function updateSelectBtn() {

  function renderBulkBar() {

  function renderEditor() {

    const tagChips = (n.tags || []).map((t) => `<span class="tag" style="background:color-mix(in srgb, ${tagColor(t)} 28%, transparent);color:color-mix(in srgb, ${tagColor(t)} 58%, var(--fg))">#${esc(t)}<button data-untag="${esc(t)}">✕</button></span>`).join("");

        <span class="tags-in" id="tagsIn">${tagChips}<input class="tag-add" id="tagAdd" placeholder="+ tag" /></span>
      </div>

    $("#backBtn").onclick = () => { selectedId = null; setSelectedFlag(); renderList(); };

    const doPin = () => { patch(n.id, { pinned: !n.pinned }); renderEditor(); renderList(); };
    $("#pinBtn").onclick = doPin; if ($("#pinBtnM")) $("#pinBtnM").onclick = doPin;
    const title = $("#edTitle");
    title.addEventListener("input", () => {
      patch(n.id, { title: title.value }); flashSaving(); updateCard(n.id, ".card-title", title.value || "Untitled");
      if (n.kind === "brainstorm" && n.bsView !== "list") {
        const rootEl = $(".bs-node-root");
        if (rootEl) rootEl.textContent = title.value || "Untitled";
      }
    });
    $("#edFolder").addEventListener("change", (e) => { patch(n.id, { folder: e.target.value.trim() || null }); renderNav(); renderList(); });
    ed.querySelectorAll("[data-color]").forEach((el) => el.addEventListener("click", () => { patch(n.id, { color: el.dataset.color || null }); renderEditor(); renderList(); }));
    ed.querySelectorAll("[data-untag]").forEach((el) => el.addEventListener("click", () => { patch(n.id, { tags: (n.tags || []).filter((t) => t !== el.dataset.untag) }); renderEditor(); renderList(); renderNav(); }));
    const tagAdd = $("#tagAdd");

    if (rem) {
      rem.value = toLocalInput(n.remindAt);
      rem.onchange = () => {
        const iso = fromLocalInput(rem.value);

        scheduleReminders(); refreshCard(n.id);
      };

    else if (n.kind === "brainstorm") renderBrainstorm(n);
