<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211a12" />
<title>SquirrelNote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BF%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BF%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SquirrelNote" />
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#211a12;color:#f0e6d3;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  /* The app renders inside this frame. The frame is locked to the visible
     screen, so the app can never be wider than your phone — no sideways scroll,
     regardless of any viewport quirks. */
  #app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#211a12}
  #ld{position:fixed;inset:0;display:flex;flex-direction:column;gap:.9rem;align-items:center;justify-content:center;text-align:center;padding:1.5rem}
  #ld .nut{font-size:3rem;animation:bob 2.4s ease-in-out infinite}
  #ld .msg{font-size:1.05rem;opacity:.85}
  #ld .sub{font-size:.85rem;opacity:.5;max-width:20rem;line-height:1.5}
  #ld button{margin-top:.4rem;background:#c1782f;color:#fff;border:none;border-radius:12px;
    padding:.6rem 1.1rem;font-size:.95rem;font-weight:700;cursor:pointer}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
</style>
</head>
<body>
<iframe id="app-frame" title="SquirrelNote" allow="microphone; camera; clipboard-read; clipboard-write"></iframe>
<div id="ld">
  <div class="nut">🐿️</div>
  <div class="msg">Loading SquirrelNote…</div>
  <div class="sub" id="sub"></div>
</div>
<script>
(function () {
  "use strict";
  var CACHE_KEY = "squirrelnote.app.html.v1";
  // Pinned commit so the app is reproducible; bump this to ship updates.
  var REF = "65bf74a";
  var SOURCES = [
    "https://cdn.jsdelivr.net/gh/pdxwise36-hub/squirrelnote@" + REF + "/squirrelnote.html",
    "https://cdn.statically.io/gh/pdxwise36-hub/squirrelnote/" + REF + "/squirrelnote.html"
  ];
  var sub = document.getElementById("sub");
  var frame = document.getElementById("app-frame");
  var wantCapture = /[?&]capture=1/.test(location.search);

  // ---- Web Push: registered here, not inside the app --------------------
  // The app renders in a srcdoc iframe (see render() below) so its notes
  // stay same-origin in this site's storage, but a srcdoc document has no
  // stable URL and can't register a service worker of its own. So the app
  // asks THIS page (via postMessage) to register the worker and subscribe;
  // this page does the browser-API work and relays the result back.
  var VAPID_PUBLIC_KEY = "BPqIkulOAckpNqgGZ4oriPyZzym_We3B6CIyUMGYo7W4bptIvJ2Eer2RpPf0C4Dj0KnJJVWPbWAtD1cIIGXzLAY";

  function urlBase64ToUint8Array(base64) {
    var padding = "=".repeat((4 - (base64.length % 4)) % 4);
    var b64 = (base64 + padding).replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(b64);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function subToPlain(sub) {
    var j = sub.toJSON();
    return { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth };
  }

  function reply(msg) {
    try { frame.contentWindow.postMessage(msg, "*"); } catch (e) {}
  }

  function getRegistration() {
    if (!("serviceWorker" in navigator)) return Promise.reject(new Error("no service worker support"));
    return navigator.serviceWorker.register("/sw.js").then(function () {
      return navigator.serviceWorker.ready;
    });
  }

  window.addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow || !e.data || typeof e.data !== "object") return;
    var msg = e.data;

    if (msg.type === "sn-push-status") {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        reply({ type: "sn-push-status", supported: false });
        return;
      }
      getRegistration()
        .then(function (reg) { return reg.pushManager.getSubscription(); })
        .then(function (existing) {
          reply({
            type: "sn-push-status",
            supported: true,
            permission: window.Notification ? Notification.permission : "unsupported",
            subscribed: !!existing,
            // Send the full subscription (not just the endpoint) so the app can
            // re-register it with the server below — the browser can hold a
            // working local subscription that never made it to Supabase (e.g. a
            // dropped request right as the permission prompt closed), and this
            // is what lets that heal itself the next time Settings opens.
            subscription: existing ? subToPlain(existing) : null,
          });
        })
        .catch(function () { reply({ type: "sn-push-status", supported: false }); });
      return;
    }

    if (msg.type === "sn-push-subscribe") {
      getRegistration()
        .then(function (reg) {
          return reg.pushManager.getSubscription().then(function (existing) {
            if (existing) return existing;
            return reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
            });
          });
        })
        .then(function (sub) { reply({ type: "sn-push-subscribed", subscription: subToPlain(sub) }); })
        .catch(function (err) { reply({ type: "sn-push-error", message: (err && err.message) || "subscribe failed" }); });
      return;
    }

    // The app itself lives in the srcdoc iframe below, a separate document
    // from this one -- so it's THIS page's window.Capacitor (injected by the
    // native wrapper, see android-app/) that can actually reach the
    // QuickCapture plugin, not the iframe's. Same relay pattern as push above.
    if (msg.type === "sn-quickcapture-setcode") {
      try {
        var qc = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.QuickCapture;
        if (qc && qc.setSyncCode) qc.setSyncCode({ code: msg.code || "" }).catch(function () {});
      } catch (e) {}
      return;
    }

    if (msg.type === "sn-quickcapture-drain") {
      try {
        var qc2 = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.QuickCapture;
        if (qc2 && qc2.drain) {
          qc2.drain()
            .then(function (r) { reply({ type: "sn-quickcapture-drained", notes: (r && r.notes) || [] }); })
            .catch(function () { reply({ type: "sn-quickcapture-drained", notes: [] }); });
        } else {
          reply({ type: "sn-quickcapture-drained", notes: [] });
        }
      } catch (e) { reply({ type: "sn-quickcapture-drained", notes: [] }); }
      return;
    }

    if (msg.type === "sn-push-unsubscribe") {
      getRegistration()
        .then(function (reg) { return reg.pushManager.getSubscription(); })
        .then(function (existing) {
          if (!existing) { reply({ type: "sn-push-unsubscribed", endpoint: null }); return; }
          var endpoint = existing.endpoint;
          return existing.unsubscribe().then(function () { reply({ type: "sn-push-unsubscribed", endpoint: endpoint }); });
        })
        .catch(function (err) { reply({ type: "sn-push-error", message: (err && err.message) || "unsubscribe failed" }); });
      return;
    }
  });

  // Register early (independent of the app finishing its own load) so the
  // worker is ready to receive a push as soon as possible.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  }

  // ---- Flush-on-background relay ----------------------------------------
  // The app has its own visibilitychange/pagehide/blur listeners to flush
  // pending (debounced) saves the instant it's backgrounded or closed — but
  // those listeners are attached to the SRCDOC IFRAME's own document, and
  // nested iframes are known to fire these events unreliably on mobile
  // browsers (sometimes late, sometimes not at all), especially right as
  // the OS suspends or kills the page. This page (the actual top-level tab
  // the OS is backgrounding) sees these events correctly every time, so it
  // relays a flush signal down into the iframe as a second, more reliable
  // trigger — this is what was letting the last few seconds of typing get
  // lost before a save ever happened.
  function relayFlush() {
    try { frame.contentWindow.postMessage({ type: "sn-flush" }, "*"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () { if (document.hidden) relayFlush(); });
  window.addEventListener("pagehide", relayFlush);
  window.addEventListener("beforeunload", relayFlush);
  window.addEventListener("blur", relayFlush);

  // ---- Safe-area-inset relay ---------------------------------------------
  // Same nested-iframe problem as everything else on this page: env(safe-area-
  // inset-*) only resolves to the real notch/status-bar/nav-bar insets for
  // the OUTERMOST browsing context, which is THIS page (loaded natively edge-
  // to-edge via viewport-fit=cover) -- not the srcdoc iframe the app actually
  // renders in, where the same env() always reports 0 no matter what that
  // iframe's own viewport meta tag says. Measure both here with a throwaway
  // probe element and relay the real pixel values down. (The app also has a
  // visualViewport-based guess for the bottom inset, relayed separately as
  // sn-nav-overlay, for the Android devices where even THIS real env() value
  // doesn't cover the on-screen 3-button nav bar -- squirrelnote.html takes
  // whichever of the two signals actually reports something.)
  function measureSafeInset(side) {
    var probe = document.createElement("div");
    probe.style.cssText = "position:fixed;" + side + ":0;left:0;width:1px;height:env(safe-area-inset-" + side + ");pointer-events:none;visibility:hidden";
    document.body.appendChild(probe);
    var h = probe.getBoundingClientRect().height;
    document.body.removeChild(probe);
    return h;
  }
  function relaySafeArea() {
    try { frame.contentWindow.postMessage({ type: "sn-safe-area", top: measureSafeInset("top"), bottom: measureSafeInset("bottom") }, "*"); } catch (e) {}
  }
  window.addEventListener("resize", relaySafeArea);
  window.addEventListener("orientationchange", function () { setTimeout(relaySafeArea, 200); });

  // ---- Nav-bar-overlay relay ----------------------------------------------
  // Same story again: some Android browsers/WebViews draw the on-screen
  // back/home/recents bar as an overlay instead of resizing the page, and
  // don't report it through env(safe-area-inset-bottom). The app used to
  // guess at this with its OWN window.visualViewport vs window.innerHeight,
  // but that's measured inside the srcdoc iframe -- a fixed-size box the
  // overlay never actually shrinks, so it could never see a real gap.  THIS
  // page is the one the overlay is actually drawn on top of, so it measures
  // the gap and relays the pixel value down instead.
  function measureNavOverlay() {
    if (!window.visualViewport) return 0;
    var gap = window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop;
    return gap > 4 && gap < 80 ? Math.round(gap) : 0;
  }
  function relayNavOverlay() {
    try { frame.contentWindow.postMessage({ type: "sn-nav-overlay", px: measureNavOverlay() }, "*"); } catch (e) {}
  }
  window.addEventListener("resize", relayNavOverlay);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", relayNavOverlay);

  // Render into a same-origin srcdoc iframe. Because the iframe element is sized
  // to the visible screen (position:fixed; inset:0), the app inside lays out at
  // the phone's real width — it does NOT rely on the viewport meta, so the
  // document.write viewport quirk can't reintroduce horizontal scrolling.
  // srcdoc keeps the same origin, so the app's notes stay in this site's storage.
  function render(html) {
    if (wantCapture) {
      frame.addEventListener("load", function () {
        try { frame.contentWindow.postMessage("sn-capture", "*"); } catch (e) {}
      }, { once: true });
    }
    frame.addEventListener("load", relaySafeArea, { once: true });
    frame.addEventListener("load", relayNavOverlay, { once: true });
    frame.srcdoc = html;
    frame.style.display = "block";
    var ld = document.getElementById("ld");
    if (ld) ld.style.display = "none";
  }

  function fromCache() { try { return localStorage.getItem(CACHE_KEY); } catch (e) { return null; } }
  function toCache(html) { try { localStorage.setItem(CACHE_KEY, html); } catch (e) {} }

  function fail() {
    var cached = fromCache();
    if (cached) { render(cached); return; }
    sub.textContent = "Couldn't reach the app files. Check your connection.";
    var b = document.createElement("button");
    b.textContent = "Try again";
    b.onclick = function () { location.reload(); };
    document.getElementById("ld").appendChild(b);
  }

  function tryFetch(i) {
    if (i >= SOURCES.length) { fail(); return; }
    fetch(SOURCES[i], { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        if (html.indexOf("SquirrelNote") === -1) throw new Error("unexpected");
        toCache(html);
        render(html);
      })
      .catch(function () { tryFetch(i + 1); });
  }

  // Network-first (so updates always reach you), cached copy as offline fallback.
  tryFetch(0);
})();
</script>
</body>
</html>
