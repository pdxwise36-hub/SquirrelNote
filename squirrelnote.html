<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211a12" />
<meta name="description" content="SquirrelNote — a cozy notes + to-do stash for your brain." />
<title>SquirrelNote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BF%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BF%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SquirrelNote" />
</head>
<body>
<style>
  /* =======================================================================
     SquirrelNote — "a stash for your brain"
     Design: dark, tactile sidebar + bright workspace. Chunky rounded cards
     with soft depth, a gradient brand mark, springy micro-interactions,
     draw-in checkmarks, and a confetti pop when a list is finished.
     Accent is user-swappable; identity is carried by shape, depth & motion.
  ======================================================================= */
  :root {
    --app-bg: #efe7d6;
    --surface: #fbf6ec;
    --surface-2: #e7dabf;
    --fg: #33271b;
    --muted: #8a7659;
    --border: #ddceb2;
    --rail-bg: #2a2018;
    --rail-fg: #f3e9d8;
    --rail-muted: #b09a7d;
    --rail-hover: rgba(255,255,255,0.06);
    --accent: #c1782f;
    --accent-2: color-mix(in srgb, var(--accent) 60%, #f4c96a);
    --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
    --accent-contrast: #ffffff;
    --moss: #6f9b57;
    --good: #6f9b57;
    --radius: 16px;
    --radius-sm: 11px;
    --shadow-sm: 0 1px 2px rgba(30,20,10,0.05);
    --shadow: 0 1px 2px rgba(30,20,10,0.05), 0 10px 28px -14px rgba(40,25,10,0.22);
    --shadow-lg: 0 24px 60px -22px rgba(40,25,10,0.42);
    --rowpad: 0.7rem;
    --gap: 0.55rem;
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --round: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Segoe UI Variable Display", system-ui, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, "Cascadia Code", monospace;
    --body-font: var(--sans);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --app-bg: #211a12; --surface: #2a2118; --surface-2: #352a1d;
      --fg: #f0e6d3; --muted: #b0997b; --border: #3e3122;
      --rail-bg: #181209; --rail-fg: #f0e6d3; --rail-muted: #a58e70; --rail-hover: rgba(255,255,255,0.05);
      --accent-soft: color-mix(in srgb, var(--accent) 26%, transparent); --moss: #86b46a; --good: #86b46a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 14px 34px -16px rgba(0,0,0,0.7);
      --shadow-lg: 0 30px 70px -24px rgba(0,0,0,0.8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --app-bg: #131116; --surface: #1c1a21; --surface-2: #262330;
    --fg: #efeaf1; --muted: #a79fad; --border: #2c2836;
    --rail-bg: #0d0c11; --rail-fg: #efeaf1; --rail-muted: #8d8598; --rail-hover: rgba(255,255,255,0.05);
    --accent-soft: color-mix(in srgb, var(--accent) 26%, transparent);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 14px 34px -16px rgba(0,0,0,0.7);
    --shadow-lg: 0 30px 70px -24px rgba(0,0,0,0.8);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --app-bg: #efe7d6; --surface: #fbf6ec; --surface-2: #e7dabf;
    --fg: #33271b; --muted: #8a7659; --border: #ddceb2;
    --rail-bg: #2a2018; --rail-fg: #f3e9d8; --rail-muted: #b09a7d; --rail-hover: rgba(255,255,255,0.06);
    --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent); --moss: #6f9b57; --good: #6f9b57;
    --shadow-sm: 0 1px 2px rgba(30,20,10,0.05);
    --shadow: 0 1px 2px rgba(30,20,10,0.05), 0 10px 28px -14px rgba(40,25,10,0.22);
    --shadow-lg: 0 24px 60px -22px rgba(40,25,10,0.42);
    color-scheme: light;
  }
  :root[data-density="compact"] { --rowpad: 0.45rem; --gap: 0.35rem; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--app-bg); color: var(--fg);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .scroll { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 40%, transparent) transparent; }
  .scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 35%, transparent); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  /* ---------- Shell -------------------------------------------------------- */
  html, body { overflow-x: hidden; max-width: 100%; }
  #app { display: grid; grid-template-columns: 1fr; grid-template-rows: 100vh; height: 100vh; overflow: hidden; position: relative; }

  /* ---------- Sidebar (dark, tactile) ------------------------------------- */
  #rail {
    position: relative; display: flex; flex-direction: column; gap: 1.05rem;
    background: var(--rail-bg); color: var(--rail-fg);
    padding: 1.15rem 0.8rem 0.9rem; overflow: hidden;
  }
  #rail::before { /* ambient accent glow, top-left */
    content: ""; position: absolute; top: -120px; left: -80px; width: 260px; height: 260px;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 40%, transparent), transparent 70%);
    filter: blur(30px); opacity: 0.55; pointer-events: none;
  }
  .brand { position: relative; display: flex; align-items: center; gap: 0.55rem; padding: 0 0.35rem 0.1rem; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 1.15rem;
    background: linear-gradient(140deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px -6px var(--accent);
  }
  .brand .word {
    font-family: var(--serif); font-weight: 700; font-size: 1.3rem; letter-spacing: -0.01em;
    background: linear-gradient(120deg, var(--rail-fg), color-mix(in srgb, var(--accent) 75%, var(--rail-fg)));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stats { position: relative; display: flex; gap: 0.45rem; }
  .stat-pill { flex: 1; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 0.5rem 0.55rem; display: flex; flex-direction: column; gap: 0.02rem; }
  .stat-pill .sv { font-family: var(--round); font-weight: 800; font-size: 1.2rem; line-height: 1.1; color: var(--rail-fg); }
  .stat-pill .sl { font-size: 0.63rem; color: var(--rail-muted); letter-spacing: 0.01em; }
  .stat-hint { position: relative; font-size: 0.72rem; color: var(--rail-muted); padding: 0.1rem 0.2rem; }
  .newbtns { position: relative; display: flex; flex-direction: column; gap: 0.45rem; }
  .btn { border-radius: 13px; padding: 0.6rem 0.8rem; font-family: var(--round); font-weight: 700; font-size: 0.92rem;
    display: flex; align-items: center; justify-content: center; gap: 0.45rem; transition: transform 0.12s var(--ease-spring), box-shadow 0.15s, background 0.15s; }
  .btn:active { transform: scale(0.965); }
  .btn-primary { color: var(--accent-contrast); background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 20px -8px var(--accent); }
  .btn-primary:hover { box-shadow: 0 12px 26px -8px var(--accent); }
  .btn-soft { color: var(--rail-fg); background: rgba(255,255,255,0.07); }
  .btn-soft:hover { background: rgba(255,255,255,0.12); }
  #nav { position: relative; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0.12rem; }
  .nav-item { width: 100%; text-align: left; border-radius: 11px; padding: 0.46rem 0.6rem; font-size: 0.9rem;
    color: var(--rail-muted); display: flex; align-items: center; gap: 0.55rem; transition: background 0.14s, color 0.14s;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .nav-item:hover { background: var(--rail-hover); color: var(--rail-fg); }
  .nav-item.active { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 90%, transparent), var(--accent-2)); color: var(--accent-contrast); font-weight: 700; box-shadow: 0 6px 16px -8px var(--accent); }
  .nav-item .count { margin-left: auto; font-size: 0.72rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .nav-label { font-family: var(--round); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--rail-muted); padding: 0.7rem 0.6rem 0.25rem; font-weight: 700; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 0.32rem; padding: 0.15rem 0.5rem; }
  .rchip { border-radius: 99px; padding: 0.14rem 0.6rem; font-size: 0.76rem; background: rgba(255,255,255,0.07); color: var(--rail-muted); transition: transform 0.12s var(--ease-spring); }
  .rchip:hover { color: var(--rail-fg); }
  .rchip:active { transform: scale(0.94); }
  .rchip.active { background: var(--accent); color: var(--accent-contrast); }
  .tag-manage { color: var(--rail-muted); font-size: 0.66rem; font-weight: 700; padding: 0.1rem 0.35rem; border-radius: 6px; letter-spacing: 0.02em; }
  .tag-manage:hover { color: var(--rail-fg); background: var(--rail-hover); }
  .tagmgr-list { display: flex; flex-direction: column; gap: 0.35rem; max-height: 320px; overflow-y: auto; }
  .tagmgr-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0.1rem; }
  .tagmgr-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .tagmgr-name { flex: 1; background: var(--app-bg); border: 1px solid var(--border); border-radius: 9px; padding: 0.32rem 0.55rem; font-size: 0.85rem; color: var(--fg); min-width: 0; }
  .tagmgr-name:focus { outline: none; border-color: var(--accent); }
  .tagmgr-count { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; }
  .tagmgr-del { color: var(--muted); font-size: 0.8rem; padding: 0.25rem 0.4rem; }
  .tagmgr-del:hover { color: #e5484d; }
  .railfoot { position: relative; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 0.55rem; display: flex; flex-direction: column; gap: 0.12rem; }

  /* ---------- List column -------------------------------------------------- */
  #listcol { display: flex; flex-direction: column; background: var(--app-bg); overflow: hidden; }
  #topbar { display: flex; align-items: center; gap: 0.5rem; padding: 0.8rem 0.85rem 0.5rem; }
  #search { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 0.5rem 0.95rem; font-size: 0.88rem; box-shadow: var(--shadow-sm); transition: border-color 0.15s, box-shadow 0.15s; }
  #search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 0.42rem 0.55rem; color: var(--muted); box-shadow: var(--shadow-sm); transition: transform 0.12s var(--ease-spring); }
  .icon-btn:hover { color: var(--fg); }
  .icon-btn.on { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
  .icon-btn:active { transform: scale(0.92); }
  #sort { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 0.42rem 0.4rem; font-size: 0.78rem; color: var(--muted); box-shadow: var(--shadow-sm); }
  #segbar { display: flex; padding: 0.15rem 0.9rem 0.55rem; }
  .seg { display: flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 3px; width: 100%; }
  .seg button { flex: 1; border-radius: 8px; padding: 0.32rem; font-size: 0.8rem; font-weight: 600; color: var(--muted); transition: color 0.14s, background 0.14s, box-shadow 0.14s; }
  .seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
  #list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0.65rem 0.65rem calc(9.5rem + env(safe-area-inset-bottom)); }
  #list:not(.grid) { display: flex; flex-direction: column; gap: 0.55rem; }
  #list.grid { column-count: 2; column-gap: 0.6rem; }
  #list.grid > li { break-inside: avoid; margin-bottom: 0.6rem; }
  .card { position: relative; width: 100%; text-align: left; display: flex; flex-direction: column; gap: 0.4rem; color: var(--fg);
    padding: 0.85rem 0.9rem; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); transition: transform 0.16s var(--ease-spring), box-shadow 0.16s; animation: pop 0.26s var(--ease-spring); }
  @keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .card.sel { outline: 2.5px solid var(--accent); outline-offset: 1px; }
  .card.dragging { z-index: 5; box-shadow: var(--shadow-lg); transition: none; }
  .card-top { display: flex; align-items: flex-start; gap: 0.4rem; }
  .card-grip { color: color-mix(in srgb, var(--fg) 32%, transparent); cursor: grab; touch-action: none; font-size: 0.85rem; flex-shrink: 0; margin-top: 0.1rem; }
  .card-grip:active { cursor: grabbing; }
  .card-title { flex: 1; font-family: var(--serif); font-weight: 700; font-size: 1.02rem; line-height: 1.25; word-break: break-word; }
  .card-star { font-size: 0.95rem; line-height: 1; color: color-mix(in srgb, var(--fg) 20%, transparent); flex-shrink: 0; transition: transform 0.12s var(--ease-spring); }
  .card-star:hover { transform: scale(1.3); }
  .card-star.on { color: var(--accent); }
  .card-time { font-size: 0.7rem; color: color-mix(in srgb, var(--fg) 42%, transparent); margin-top: -0.25rem; }
  .card-text { font-size: 0.84rem; line-height: 1.5; color: color-mix(in srgb, var(--fg) 78%, transparent);
    display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
  .cl { display: flex; flex-direction: column; gap: 0.22rem; }
  .cl-row { display: flex; align-items: flex-start; gap: 0.45rem; font-size: 0.84rem; line-height: 1.3; }
  .cl-row .t { flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .cl-row.done .t { color: color-mix(in srgb, var(--fg) 42%, transparent); text-decoration: line-through; }
  .cbx { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; cursor: pointer; }
  .cbx .acorn { width: 18px; height: 18px; }
  .more { font-size: 0.75rem; color: color-mix(in srgb, var(--fg) 48%, transparent); font-weight: 600; padding-left: 1.65rem; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .minitag { font-size: 0.66rem; font-weight: 700; background: color-mix(in srgb, var(--fg) 9%, transparent); color: color-mix(in srgb, var(--fg) 70%, transparent); border-radius: 99px; padding: 0.05rem 0.5rem; }
  .empty { color: var(--muted); padding: 3rem 1.2rem; font-size: 0.92rem; text-align: center; line-height: 1.7; }

  /* ---------- Editor ------------------------------------------------------- */
  #editor { overflow-y: auto; padding: 1.6rem 1.6rem 4rem; }
  .sheet { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
  .ed-head { display: flex; align-items: flex-start; gap: 0.7rem; }
  .ed-title { flex: 1; background: none; border: none; font-family: var(--serif); font-size: 1.85rem; font-weight: 700; letter-spacing: -0.01em; }
  .ed-title:focus { outline: none; }
  .ed-actions { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
  .saved { font-size: 0.72rem; color: var(--muted); display: flex; align-items: center; gap: 0.3rem; }
  .saved .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
  .swatches { display: flex; gap: 0.35rem; align-items: center; }
  .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1.5px var(--border); display: grid; place-items: center; font-size: 0.6rem; color: var(--muted); transition: transform 0.12s var(--ease-spring); }
  .sw:hover { transform: scale(1.15); }
  .sw.on { box-shadow: inset 0 0 0 1.5px transparent, 0 0 0 2px var(--fg); }
  .vsep { width: 1px; height: 20px; background: var(--border); }
  .folder-in { width: 128px; background: var(--app-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.32rem 0.55rem; font-size: 0.79rem; }
  .folder-in:focus { outline: none; border-color: var(--accent); }
  .tags-in { display: flex; flex-wrap: wrap; gap: 0.32rem; align-items: center; }
  .tag { display: flex; align-items: center; gap: 0.25rem; background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 78%, var(--fg)); border-radius: 99px; padding: 0.1rem 0.55rem; font-size: 0.77rem; font-weight: 600; }
  .tag button { color: currentColor; opacity: 0.6; font-size: 0.7rem; }
  .tag button:hover { opacity: 1; }
  .tag-add { width: 66px; background: var(--app-bg); border: 1px solid var(--border); border-radius: 99px; padding: 0.1rem 0.55rem; font-size: 0.77rem; }
  .tag-add:focus { outline: none; border-color: var(--accent); }
  .note-body { min-height: 320px; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.1rem 1.2rem; font-family: var(--body-font); font-size: 0.97rem; line-height: 1.7; white-space: pre-wrap; box-shadow: var(--shadow-sm); }
  .note-body:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .note-body:empty:before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
  .note-body h2 { font-family: var(--serif); font-size: 1.32rem; font-weight: 800; margin: 0.2rem 0; line-height: 1.35; }
  .note-body h3 { font-family: var(--serif); font-size: 1.1rem; font-weight: 800; margin: 0.2rem 0; line-height: 1.35; }
  .note-body ul, .note-body ol { margin: 0.2rem 0 0.2rem 1.3rem; padding: 0; }
  .note-body li { margin: 0.1rem 0; }
  .note-body mark, .card-text mark { background: none; color: inherit; border-radius: 3px; padding: 0 0.1em; }
  .note-body img { width: 110px; height: 110px; max-width: 100%; object-fit: cover; display: inline-block; vertical-align: middle;
    border-radius: 10px; margin: 0.3rem; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.12s var(--ease-spring); }
  .note-body img:hover, .note-body img:active { transform: scale(1.04); }
  .rtbar { display: flex; gap: 0.3rem; margin-bottom: 0.5rem; flex-wrap: wrap; position: relative; }
  .rtbar button { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); width: 2rem; height: 2rem;
    display: grid; place-items: center; font-size: 0.85rem; color: var(--fg); transition: background 0.12s, border-color 0.12s, transform 0.12s var(--ease-spring); }
  .rtbar button:active { transform: scale(0.92); }
  .rtbar button.on { background: var(--accent-soft); border-color: var(--accent); color: color-mix(in srgb, var(--accent) 75%, var(--fg)); }
  .rtbar .rt-strike { text-decoration: line-through; }
  .hlpop { position: absolute; top: calc(100% + 0.3rem); left: 0; z-index: 4; display: flex; gap: 0.35rem; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.45rem; box-shadow: var(--shadow-lg); }
  .hlswatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1.5px var(--border); flex-shrink: 0;
    display: grid; place-items: center; font-size: 0.6rem; color: var(--muted); transition: transform 0.12s var(--ease-spring); }
  .hlswatch:active { transform: scale(0.9); }
  .photopop-btn { border: none; background: transparent; padding: 0.4rem 0.6rem; border-radius: 8px; font-size: 0.85rem;
    color: var(--fg); white-space: nowrap; }
  .photopop-btn:active { background: var(--accent-soft); }
  .note-body mark.hl-1, .card-text mark.hl-1 { background: color-mix(in srgb, #e57373 45%, transparent); }
  .note-body mark.hl-2, .card-text mark.hl-2 { background: color-mix(in srgb, #f0a35e 45%, transparent); }
  .note-body mark.hl-3, .card-text mark.hl-3 { background: color-mix(in srgb, #e6c34a 45%, transparent); }
  .note-body mark.hl-4, .card-text mark.hl-4 { background: color-mix(in srgb, #7fb56e 45%, transparent); }
  .note-body mark.hl-5, .card-text mark.hl-5 { background: color-mix(in srgb, #6fb0d4 45%, transparent); }
  .note-body mark.hl-6, .card-text mark.hl-6 { background: color-mix(in srgb, #9b8ad4 45%, transparent); }
  .note-body mark.hl-7, .card-text mark.hl-7 { background: color-mix(in srgb, #d98bb0 45%, transparent); }
  .banner { background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 70%, var(--fg)); border-radius: var(--radius); padding: 0.55rem 0.85rem; font-size: 0.8rem; font-weight: 500; }

  /* checklist */
  .chk { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 0.9rem 0.9rem 1rem; display: flex; flex-direction: column; gap: 0.15rem; }
  .progress-wrap { display: flex; align-items: center; gap: 0.8rem; padding: 0.1rem 0.4rem 0.7rem; }
  .progress { flex: 1; height: 9px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .progress > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.5s var(--ease-spring); }
  .progress.done > span { background: linear-gradient(90deg, var(--good), color-mix(in srgb, var(--good) 60%, #b6f0cf)); }
  .progress-num { font-family: var(--round); font-weight: 700; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chk-controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; padding: 0 0.2rem 0.6rem; }
  .repeat-ctl { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--muted); font-weight: 600; }
  .routine-streak { font-family: var(--round); font-weight: 700; font-size: 0.78rem; color: color-mix(in srgb, var(--accent) 78%, var(--fg)); background: var(--accent-soft); border-radius: 99px; padding: 0.22rem 0.6rem; white-space: nowrap; }
  .repeat-ctl select { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 0.25rem 0.4rem; font-size: 0.8rem; color: var(--fg); }
  .repeat-ctl select:focus { outline: none; border-color: var(--accent); }
  .sched-row { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; width: 100%; margin-top: 0.3rem; }
  .sched-row select, .sched-row input[type="time"] { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 0.25rem 0.4rem; font-size: 0.8rem; color: var(--fg); }
  .sched-row select:focus, .sched-row input[type="time"]:focus { outline: none; border-color: var(--accent); }
  .tpl-item { display: flex; align-items: center; }
  .tpl-item.dragging { position: relative; z-index: 5; background: var(--rail-hover); border-radius: 10px; }
  .tpl-item .tpl-new { flex: 1; }
  .tpl-grip { color: var(--rail-muted); cursor: grab; touch-action: none; font-size: 0.8rem; padding: 0 0.25rem 0 0.1rem; opacity: 0.55; }
  .tpl-grip:active { cursor: grabbing; }
  .tpl-del { color: var(--rail-muted); font-size: 0.72rem; padding: 0.35rem 0.45rem; opacity: 0.55; transition: opacity 0.14s; }
  .tpl-item:hover .tpl-del { opacity: 0.7; }
  .tpl-del:hover { opacity: 1; }
  .tpl-add { color: var(--accent); font-weight: 700; }
  .tpl-add:hover { background: var(--rail-hover); color: var(--accent); }
  .item { display: flex; align-items: center; gap: 0.6rem; padding: 0.42rem 0.4rem; border-radius: 11px; transition: background 0.14s; touch-action: pan-y; }
  .item:hover { background: var(--app-bg); }
  .item.dragging { position: relative; z-index: 5; background: var(--surface); box-shadow: var(--shadow); border-radius: 11px; }
  .grip { color: var(--muted); cursor: grab; opacity: 0.4; font-size: 0.9rem; transition: opacity 0.14s; touch-action: none; }
  .item:hover .grip { opacity: 0.85; }
  .grip:active { cursor: grabbing; }
  .check { width: 28px; height: 28px; flex-shrink: 0; display: grid; place-items: center; background: none; border: none; transition: transform 0.15s var(--ease-spring); }
  .check:active { transform: scale(0.8); }
  .check .acorn { width: 24px; height: 24px; }
  /* acorn checkbox (used on cards + in the editor) */
  .acorn { display: block; transition: transform 0.2s var(--ease-spring); overflow: visible; }
  .acorn .cap, .acorn .nut { fill: transparent; stroke: color-mix(in srgb, var(--fg) 36%, transparent); stroke-width: 1.7; stroke-linejoin: round; }
  .acorn .stem { fill: none; stroke: color-mix(in srgb, var(--fg) 36%, transparent); stroke-width: 1.7; stroke-linecap: round; }
  .check:hover .acorn:not(.on) .cap, .check:hover .acorn:not(.on) .nut, .check:hover .acorn:not(.on) .stem,
  .cbx:hover .acorn:not(.on) .cap, .cbx:hover .acorn:not(.on) .nut, .cbx:hover .acorn:not(.on) .stem { stroke: var(--accent); }
  .acorn.on .cap { fill: var(--accent); stroke: var(--accent); }
  .acorn.on .nut { fill: color-mix(in srgb, var(--accent) 42%, #edd09a); stroke: var(--accent); }
  .acorn.on .stem { stroke: color-mix(in srgb, var(--accent) 55%, #4a2f14); }
  .acorn.on { animation: acornpop 0.32s var(--ease-spring); }
  @keyframes acornpop { 0% { transform: scale(0.55); } 55% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .item-text { flex: 1; background: none; border: none; font-size: 0.94rem; transition: color 0.2s; }
  .item-text:focus { outline: none; }
  .item.done .item-text { color: var(--muted); text-decoration: line-through; }
  .item-del { color: var(--muted); opacity: 0; font-size: 0.78rem; transition: opacity 0.14s, transform 0.12s var(--ease-spring); }
  .item:hover .item-del { opacity: 0.55; }
  .item-del:hover { opacity: 1; transform: scale(1.2); }
  .additem { display: flex; align-items: center; gap: 0.55rem; padding: 0.4rem 0.4rem 0.1rem; }
  .additem .plus { width: 22px; text-align: center; color: var(--accent); font-weight: 700; }
  .additem input { flex: 1; background: none; border: none; border-bottom: 1.5px solid var(--border); padding: 0.35rem 0; font-size: 0.92rem; }
  .additem input:focus { outline: none; border-color: var(--accent); }
  .link { color: var(--accent); font-size: 0.82rem; font-weight: 600; align-self: flex-start; margin-top: 0.5rem; }
  .link:hover { text-decoration: underline; }
  .bulk { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); padding: 0.8rem; display: flex; flex-direction: column; gap: 0.55rem; }
  .bulk textarea { min-height: 96px; resize: vertical; background: var(--app-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem; font-size: 0.88rem; font-family: var(--body-font); }
  .bulk textarea:focus { outline: none; border-color: var(--accent); }
  .bulk-actions { display: flex; gap: 0.5rem; align-items: center; }
  .btn-sm { border: 1px solid var(--border); border-radius: 10px; padding: 0.36rem 0.7rem; font-size: 0.79rem; font-weight: 600; transition: transform 0.12s var(--ease-spring); }
  .btn-sm:active { transform: scale(0.95); }
  .btn-sm:hover { background: var(--app-bg); }
  .btn-sm.accent { color: var(--accent-contrast); background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; box-shadow: 0 6px 16px -8px var(--accent); }
  .del-btn { border: 1px solid color-mix(in srgb, #e5484d 35%, var(--border)); color: #e5484d; border-radius: 10px; padding: 0.32rem 0.6rem; font-size: 0.77rem; font-weight: 600; transition: transform 0.12s var(--ease-spring); }
  .del-btn:hover { background: color-mix(in srgb, #e5484d 12%, transparent); }
  .del-btn:active { transform: scale(0.95); }
  .pin-btn { padding: 0.24rem 0.42rem; color: var(--muted); font-size: 1.05rem; transition: transform 0.12s var(--ease-spring); }
  .pin-btn:hover { transform: scale(1.15); }
  .pin-btn.on { color: var(--accent); }

  .placeholder { height: 100%; display: grid; place-items: center; }
  .ph-inner { text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 1rem; align-items: center; }
  .ph-inner .big { font-size: 3.4rem; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  .ph-inner h3 { font-family: var(--round); font-weight: 800; font-size: 1.3rem; color: var(--fg); margin: 0; letter-spacing: -0.01em; }

  /* ---------- Settings drawer --------------------------------------------- */
  #modalRoot:empty { display: none; }
  .scrim { position: fixed; inset: 0; background: rgba(15,10,5,0.4); backdrop-filter: blur(2px); z-index: 40; animation: fade 0.18s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 372px; max-width: 100vw; background: var(--surface);
    border-left: 1px solid var(--border); z-index: 41; padding: 1.3rem; overflow-y: auto; box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; gap: 1.2rem; animation: slidein 0.24s var(--ease-spring); }
  @keyframes slidein { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .drawer h2 { margin: 0; font-family: var(--round); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; }
  .group-label { font-family: var(--round); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; margin-bottom: 0.5rem; }
  .dseg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
  .dseg button { flex: 1; border-radius: 9px; padding: 0.46rem; font-size: 0.86rem; font-weight: 600; color: var(--muted); transition: color 0.14s, background 0.14s, box-shadow 0.14s; }
  .dseg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
  .accents { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .accent-dot { width: 34px; height: 34px; border-radius: 50%; outline: 2px solid transparent; outline-offset: 3px; box-shadow: var(--shadow-sm); transition: transform 0.14s var(--ease-spring); }
  .accent-dot:hover { transform: scale(1.12); }
  .accent-dot.on { outline-color: var(--fg); }
  .accent-custom { width: 34px; height: 34px; border-radius: 50%; border: 2px dashed var(--muted); display: grid; place-items: center; color: var(--muted); position: relative; }
  .accent-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .fineprint { font-size: 0.76rem; color: var(--muted); line-height: 1.5; }
  .sync-code { font-family: var(--round); font-weight: 800; font-size: 1.15rem; letter-spacing: 0.03em; text-align: center;
    background: var(--surface-2); border: 1.5px dashed var(--border); border-radius: 12px; padding: 0.6rem; color: var(--fg); user-select: all; }

  /* quick capture modal */
  .qc { position: fixed; z-index: 41; top: 11vh; left: 50%; transform: translateX(-50%); width: 560px; max-width: 94vw;
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-lg);
    padding: 1.3rem; display: flex; flex-direction: column; gap: 0.75rem; animation: qcIn 0.22s var(--ease-spring); }
  @keyframes qcIn { from { transform: translateX(-50%) translateY(12px) scale(0.98); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
  .qc h2 { margin: 0; font-family: var(--round); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.45rem; }
  .qc textarea { min-height: 156px; resize: vertical; background: var(--app-bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.85rem 1rem; font-size: 0.98rem; line-height: 1.6; font-family: var(--body-font); }
  .qc textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .qc-row { display: flex; gap: 0.5rem; align-items: center; }
  .kbd { font-family: var(--mono); font-size: 0.7rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 0.05rem 0.35rem; color: var(--muted); }

  /* floating quick-capture button */
  #fab { position: fixed; right: 1.1rem; bottom: calc(4.6rem + env(safe-area-inset-bottom)); z-index: 35; width: 60px; height: 60px; border-radius: 22px;
    background: linear-gradient(140deg, var(--accent), var(--accent-2)); color: var(--accent-contrast);
    font-size: 1.85rem; line-height: 1; box-shadow: 0 14px 30px -8px var(--accent), var(--shadow-sm);
    display: grid; place-items: center; transition: transform 0.18s var(--ease-spring), box-shadow 0.18s; }
  #fab:hover { transform: scale(1.07) rotate(90deg); box-shadow: 0 18px 36px -8px var(--accent); }
  #fab:active { transform: scale(0.9); }

  /* confetti canvas */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  /* weekly wins recap */
  .wk-chart { display: flex; align-items: flex-end; gap: 0.4rem; height: 120px; padding: 0.5rem 0.2rem 0; }
  .wk-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; height: 100%; justify-content: flex-end; }
  .wk-bar { width: 68%; min-height: 4px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); transition: height 0.4s var(--ease-spring); }
  .wk-bar.today { box-shadow: 0 0 0 2px var(--accent-soft); }
  .wk-lbl { font-size: 0.64rem; color: var(--muted); }
  .wk-n { font-size: 0.7rem; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; min-height: 0.9em; }
  .wk-stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.86rem; color: var(--muted); font-weight: 600; margin-top: 0.3rem; }
  .mic-on { animation: micpulse 1s ease-in-out infinite; }
  @keyframes micpulse { 0%,100% { box-shadow: 0 0 0 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 5px transparent; } }

  /* level / XP (in the dark rail) */
  .statswrap { position: relative; display: flex; flex-direction: column; gap: 0.5rem; }
  .lvl { display: flex; flex-direction: column; gap: 0.28rem; }
  .lvl-top { display: flex; justify-content: space-between; align-items: center; }
  .lvl-badge { font-family: var(--round); font-weight: 800; font-size: 0.78rem; color: var(--accent-contrast);
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); padding: 0.08rem 0.5rem; border-radius: 8px; box-shadow: 0 4px 12px -6px var(--accent); }
  .lvl-xp { font-size: 0.66rem; color: var(--rail-muted); font-variant-numeric: tabular-nums; }
  .lvl-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .lvl-bar > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.5s var(--ease-spring); }

  /* level-up toast */
  .toast { position: fixed; left: 50%; bottom: calc(9rem + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(22px); z-index: 70;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-contrast);
    font-family: var(--round); font-weight: 800; font-size: 0.95rem; padding: 0.6rem 1.15rem; border-radius: 14px;
    box-shadow: var(--shadow-lg); opacity: 0; transition: opacity 0.3s, transform 0.3s var(--ease-spring); pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* randomizer — "pick for me" */
  .rnd-presets { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; }
  .rnd-chip { border: 1px solid var(--border); background: var(--surface-2); border-radius: 99px; padding: 0.3rem 0.7rem;
    font-size: 0.8rem; font-weight: 700; color: var(--muted); transition: transform 0.12s var(--ease-spring); }
  .rnd-chip:hover { color: var(--fg); } .rnd-chip:active { transform: scale(0.94); }
  .rnd-chip.on { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
  .rnd-stage { position: relative; min-height: 132px; display: grid; place-items: center; border-radius: var(--radius);
    background: radial-gradient(circle at 50% 38%, var(--accent-soft), var(--surface-2)); border: 1px solid var(--border); overflow: hidden; }
  .rnd-stage.spinning { animation: stageshake 0.28s linear infinite; }
  @keyframes stageshake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  .rnd-result { font-family: var(--round); font-weight: 800; font-size: 2.4rem; line-height: 1.12; text-align: center;
    padding: 0.4rem 1rem; color: var(--fg); word-break: break-word; }
  .rnd-result.flip { animation: rflip 0.12s ease; }
  @keyframes rflip { from { opacity: 0.25; transform: translateY(-28%) scale(0.9); } to { opacity: 1; transform: none; } }
  .rnd-result.land { animation: rland 0.55s var(--ease-spring); color: var(--accent); text-shadow: 0 0 26px var(--accent-soft); }
  @keyframes rland { 0% { transform: scale(0.4); opacity: 0; } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* photos on notes */
  .photos { display: flex; flex-wrap: wrap; gap: 0.5rem; position: relative; }
  .photo { position: relative; width: 88px; height: 88px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .photo-del { position: absolute; top: 3px; right: 3px; width: 21px; height: 21px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; font-size: 0.7rem; display: grid; place-items: center; line-height: 1; }
  .photo-del:hover { background: rgba(0,0,0,0.8); }
  .photo-add { width: 88px; height: 88px; border-radius: 12px; border: 2px dashed var(--border); color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; font-size: 1.4rem; transition: border-color 0.15s, color 0.15s; }
  .photo-add span { font-size: 0.7rem; font-weight: 700; }
  .photo-add:hover { border-color: var(--accent); color: var(--accent); }
  .card-photo { position: relative; width: 100%; border-radius: 10px; overflow: hidden; }
  .card-photo img { width: 100%; max-height: 180px; object-fit: cover; display: block; }
  .card-photo-n { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.6); color: #fff; font-size: 0.66rem; font-weight: 700; padding: 0.05rem 0.45rem; border-radius: 99px; }
  .lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.92); display: grid; place-items: center; padding: 1rem; animation: fade 0.18s ease; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .lb-close { position: fixed; top: 1rem; right: 1rem; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.16); color: #fff; font-size: 1.1rem; }

  /* sub-steps ("break it down") */
  .stepbtn { color: var(--muted); font-size: 0.82rem; padding: 0.1rem 0.35rem; border-radius: 8px; display: inline-flex; align-items: center; gap: 0.2rem; flex-shrink: 0; transition: color 0.14s; }
  .stepbtn:hover, .stepbtn.on { color: var(--accent); }
  .stepn { font-size: 0.62rem; font-weight: 700; background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 72%, var(--fg)); border-radius: 99px; padding: 0 0.32rem; }
  .substeps { margin: 0.05rem 0 0.35rem 2.5rem; display: flex; flex-direction: column; gap: 0.08rem; border-left: 2px solid var(--border); padding-left: 0.5rem; }
  .subitem { display: flex; align-items: center; gap: 0.4rem; padding: 0.16rem 0.2rem; border-radius: 9px; }
  .subitem:hover { background: var(--app-bg); }
  .subitem .check { width: 22px; height: 22px; }
  .subitem .check .acorn { width: 18px; height: 18px; }
  .subitem .item-text { font-size: 0.88rem; }
  .subitem.done .item-text { color: var(--muted); text-decoration: line-through; }
  .addsub { display: flex; align-items: center; gap: 0.4rem; padding: 0.12rem 0.2rem; }
  .addsub .plus { width: 18px; text-align: center; color: var(--accent); font-weight: 700; }
  .addsub input { flex: 1; background: none; border: none; border-bottom: 1px solid var(--border); padding: 0.2rem 0; font-size: 0.85rem; }
  .addsub input:focus { outline: none; border-color: var(--accent); }

  /* reminders */
  .remind-row { display: flex; align-items: center; gap: 0.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.4rem 0.7rem; box-shadow: var(--shadow-sm); }
  .remind-ic { font-size: 1rem; }
  .remind-in { flex: 1; background: var(--app-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.32rem 0.5rem; font-size: 0.82rem; color: var(--fg); min-width: 0; font-family: var(--sans); }
  .remind-in:focus { outline: none; border-color: var(--accent); }
  .remind-clear { color: var(--muted); font-size: 0.8rem; padding: 0.2rem 0.45rem; }
  .remind-clear:hover { color: var(--fg); }

<script>
(function () {
  "use strict";
  // Ensure phones use device width (otherwise mobile browsers assume ~980px and
  // render the desktop layout, forcing horizontal scrolling).
  (function () {
    let m = document.querySelector('meta[name="viewport"]');
    if (!m) { m = document.createElement("meta"); m.setAttribute("name", "viewport"); document.head.appendChild(m); }
    m.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
  })();
  // Bumped by hand on every shipped change — shown in Settings so it's easy
  // to tell whether a device is actually running the latest version or
  // stuck on something cached (browser cache, CDN lag, a stale home-screen
  // install), instead of guessing from symptoms alone.
  const APP_BUILD = "2026-08-10.14-lock-pinch-zoom";
  const NOTES_KEY = "squirrelnote.notes.v1";
  const PREFS_KEY = "squirrelnote.prefs.v1";
  const ACCENTS = [
    ["Acorn", "#c1782f"], ["Chestnut", "#a0522d"], ["Berry", "#c04068"],
    ["Plum", "#8b5cf6"], ["Sky", "#3b82f6"], ["Pond", "#0d9488"],
    ["Moss", "#6f9b57"], ["Honey", "#e0a92e"],
  ];
  const NOTE_COLORS = [null, "#e57373", "#f0a35e", "#e6c34a", "#7fb56e", "#6fb0d4", "#9b8ad4", "#d98bb0"];
  const DEFAULT_PREFS = { theme: "system", accent: "#c1782f", bodyFont: "sans", density: "comfortable", view: "grid", sort: "updated", sound: false, colorByTag: true, autoColor: true, lowStim: false, affirmations: true, petName: "Chip", syncCode: null, syncedAt: null,
    shareTag: "work", shareOutCode: null, shareOutedAt: null, shareInCode: null, shareInedAt: null };
  const DEFAULT_AFFIRMATIONS = [
    "One small step still counts. 🌱",
    "You don't have to do it all today.",
    "Starting is the hard part — and you're here.",
    "Done is better than perfect.",
    "Your brain works differently, not wrong.",
    "Progress, not perfection.",
    "Rest is productive too.",
    "You've gotten through hard days before.",
    "It's okay to do it messy.",
    "Small wins add up. 🌰",
    "You're allowed to be proud of little things.",
    "Forgetting something doesn't make you a failure.",
    "Five minutes counts. Just start there.",
    "You are more than your to-do list.",
    "Be as kind to yourself as you'd be to a friend.",
    "Tomorrow is a fresh start.",
    "You showed up today — that matters.",
  ];
  const STATS_KEY = "squirrelnote.stats.v1";
  const TEMPLATES_KEY = "squirrelnote.templates.v1";
  const PURGED_KEY = "squirrelnote.purged.v1";
  const BRAINDUMP_KEY = "squirrelnote.braindump.v1";
  // Deterministic per-tag colors: the same tag always maps to the same hue.
  const TAG_PALETTE = ["#e57373", "#f0a35e", "#e6c34a", "#7fb56e", "#5bb0a7", "#6fb0d4", "#7f8fd4", "#9b8ad4", "#d98bb0", "#c98a6a"];
  function tagHash(t) { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return h; }
  function tagColor(t) { return TAG_PALETTE[tagHash(t) % TAG_PALETTE.length]; }

  let notes = [];
  let prefs = { ...DEFAULT_PREFS };
  let selectedId = null;
  let filter = { folder: null, tag: null, query: "", kind: "all", trash: false };
  let selecting = false; // multi-select mode
  const selectedIds = new Set();
  let showBulk = false;
  let saveTimer = null;

  const $ = (s, r = document) => r.querySelector(s);
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const now = () => new Date().toISOString();

  function loadPrefs() { try { const r = localStorage.getItem(PREFS_KEY); if (r) prefs = { ...DEFAULT_PREFS, ...JSON.parse(r) }; } catch (e) {} }
  function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} }
  function loadNotes() { try { const r = localStorage.getItem(NOTES_KEY); if (r) notes = JSON.parse(r); } catch (e) {} }
  let quotaWarned = false;
  function persist() {
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); quotaWarned = false; syncSoon(); shareOutSoon(); }
    catch (e) {
      if (!quotaWarned) {
        quotaWarned = true;
        alert("⚠️ This browser's storage is full, so new changes can't be saved.\n\nFree up room by deleting a few photos, then tap ⇩ Export backup to keep your notes safe. (Everything is stored on this device.)");
      }
    }
  }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 250); }
  // Flush any pending save immediately — used when the app is backgrounded or
  // closed so nothing typed in the last moment is lost.
  function flushSave() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; } persist(); saveBrainDumpNow(); }

  // ---- brain dump: a freeform, always-there scratch space ----
  let brainDump = "", bdTimer = null;
  function loadBrainDump() { try { brainDump = localStorage.getItem(BRAINDUMP_KEY) || ""; } catch (e) { brainDump = ""; } }
  function saveBrainDumpNow() { if (bdTimer) { clearTimeout(bdTimer); bdTimer = null; } try { localStorage.setItem(BRAINDUMP_KEY, brainDump); } catch (e) {} }
  function saveBrainDumpSoon() { clearTimeout(bdTimer); bdTimer = setTimeout(saveBrainDumpNow, 300); }
  // Voice-to-text dictation, shared by Quick Capture and Brain Dump.
  // Android Chrome's "continuous" speech recognition silently restarts
  // mid-dictation and REPLAYS everything already heard alongside the new
  // words (naive code that re-joins the full ev.results list each time
  // duplicates the whole transcript on every restart — "I need... I need I
  // need to... I need I need to I need to have..."). The fix: run short,
  // non-continuous sessions and restart them ourselves between phrases, only
  // ever appending text once it's marked final (via event.resultIndex),
  // never re-concatenating the whole results list.
  function wireVoiceMic(mic, ta, onChange) {
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!mic) return;
    if (!Rec) { mic.style.display = "none"; return; }
    let rec = null, listening = false, manualStop = false, origBase = "", spoken = "";
    const stopUI = () => { listening = false; mic.textContent = "🎤 Speak"; mic.classList.remove("accent", "mic-on"); };
    const render = (interim) => {
      const body = (spoken + " " + interim).trim();
      ta.value = (origBase ? origBase + "\n" : "") + body;
      if (onChange) onChange();
    };
    const session = () => {
      rec = new Rec();
      rec.lang = navigator.language || "en-US";
      rec.interimResults = true;
      rec.continuous = false; // one phrase per session; we drive the restart loop
      rec.onresult = (ev) => {
        let interim = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) spoken = (spoken ? spoken + " " : "") + r[0].transcript.trim();
          else interim += r[0].transcript;
        }
        render(interim);
      };
      rec.onerror = (ev) => { if (ev.error !== "no-speech" && ev.error !== "aborted") manualStop = true; };
      rec.onend = () => { if (manualStop) stopUI(); else { try { session(); } catch (e) { stopUI(); } } };
      rec.start();
    };
    mic.onclick = () => {
      if (listening) { manualStop = true; try { rec.stop(); } catch (e) {} return; }
      try {
        manualStop = false; origBase = ta.value.trim(); spoken = "";
        session();
        listening = true; mic.textContent = "⏹ Stop"; mic.classList.add("accent", "mic-on"); ta.focus();
      } catch (e) { alert("Voice input isn't available in this browser. Try Chrome."); stopUI(); }
    };
  }

  // Touch + mouse compatible drag-to-reorder. Native HTML5 drag-and-drop
  // (dragstart/dragover/drop) never fires from touch on mobile browsers, so a
  // grip handle built on it silently does nothing on a phone. This uses
  // Pointer Events instead, which fire the same way for touch, mouse, and pen.
  // Delegated on `container` (bound once — safe to call again after every
  // re-render as long as `container` itself is the same persisting element),
  // and re-queries rows fresh at the moment a drag starts.
  function enableDragReorder(container, rowSel, handleSel, onDrop) {
    if (!container || container.dataset.dragWired) return;
    container.dataset.dragWired = "1";
    let dragEl = null, rows = [], startY = 0, curIndex = -1, moved = false, pid = null;
    const targetIndex = () => {
      const dr = dragEl.getBoundingClientRect();
      const mid = dr.top + dr.height / 2;
      let idx = 0;
      for (const r of rows) { if (r === dragEl) continue; const rr = r.getBoundingClientRect(); if (rr.top + rr.height / 2 < mid) idx++; }
      return idx;
    };
    const clear = () => {
      if (dragEl) { dragEl.classList.remove("dragging"); dragEl.style.transform = ""; }
      dragEl = null; rows = []; moved = false; pid = null;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
    };
    function onMove(e) {
      if (!dragEl || e.pointerId !== pid) return;
      moved = true; e.preventDefault();
      dragEl.style.transform = `translateY(${e.clientY - startY}px)`;
    }
    function onUp(e) {
      if (!dragEl || e.pointerId !== pid) return;
      const from = curIndex, to = targetIndex(), didMove = moved;
      clear();
      if (didMove && to !== from) onDrop(from, to);
    }
    container.addEventListener("pointerdown", (e) => {
      const handle = e.target.closest(handleSel);
      if (!handle || !container.contains(handle)) return;
      const row = handle.closest(rowSel);
      if (!row) return;
      e.preventDefault();
      dragEl = row; pid = e.pointerId; startY = e.clientY; moved = false;
      rows = [...container.querySelectorAll(rowSel)];
      curIndex = rows.indexOf(row);
      row.classList.add("dragging");
      try { row.setPointerCapture(pid); } catch (err) {}
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });
  }

  function openBrainDump() {
    const root = $("#modalRoot");
    root.innerHTML = `
      <div class="bd-pane">
        <div class="bd-head">
          <button class="backbar" id="bdBack">‹ Back</button>
          <span class="bd-title">🧠 Brain dump</span>
          <span class="bd-save" id="bdSave"></span>
        </div>
        <textarea class="bd-area" id="bdArea" placeholder="Dump everything here — no structure, no pressure.&#10;Thoughts, worries, ideas, half-formed to-dos… get it out of your head.&#10;&#10;It autosaves. Turn it into notes whenever you're ready."></textarea>
        <div class="bd-bar">
          <button class="btn-sm" id="bdMic">🎤 Speak</button>
          <span class="spacer"></span>
          <button class="btn-sm" id="bdClear">🗑 Clear</button>
          <button class="btn-sm accent" id="bdMake">✨ Make notes</button>
        </div>
      </div>`;
    const ta = $("#bdArea"), save = $("#bdSave");
    ta.value = brainDump;
    ta.addEventListener("input", () => {
      brainDump = ta.value; saveBrainDumpSoon();
      if (save) { save.textContent = "saving…"; clearTimeout(save._t); save._t = setTimeout(() => { if (save) save.textContent = "saved ✓"; }, 500); }
    });
    $("#bdBack").onclick = () => { brainDump = ta.value; saveBrainDumpNow(); closeSettings(); };
    $("#bdClear").onclick = () => {
      if (!ta.value.trim() || confirm("Clear the whole brain dump? This can't be undone.")) { ta.value = ""; brainDump = ""; saveBrainDumpNow(); ta.focus(); }
    };
    $("#bdMake").onclick = () => { brainDump = ta.value; brainDumpMake(); };
    // voice dictation straight into the dump
    wireVoiceMic($("#bdMic"), ta, () => { brainDump = ta.value; saveBrainDumpSoon(); });
    setTimeout(() => ta.focus(), 60);
  }
  // Turn the brain dump into structured notes.
  function brainDumpMake() {
    const text = (brainDump || "").trim();
    if (!text) { toast("Nothing to convert yet"); return; }
    const root = $("#modalRoot");
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="scrim" id="bdmScrim" style="z-index:60"></div>
      <div class="qc" style="max-width:400px;z-index:61">
        <h2 style="justify-content:center">✨ Make notes</h2>
        <p class="fineprint" style="margin:0;text-align:center">Turn your brain dump into something structured. (Your dump stays put.)</p>
        <div style="display:flex;flex-direction:column;gap:.5rem">
          <button class="btn-sm" data-mk="note">📝 One note (the whole thing)</button>
          <button class="btn-sm" data-mk="list">✓ A checklist (each line a to-do)</button>
          <button class="btn-sm" data-mk="split">🗂 Split into notes (by blank lines)</button>
        </div>
        <div class="qc-row"><span style="flex:1"></span><button class="btn-sm" id="bdmCancel">Cancel</button></div>
      </div>`;
    root.appendChild(wrap);
    const close = () => wrap.remove();
    wrap.querySelector("#bdmScrim").onclick = close;
    wrap.querySelector("#bdmCancel").onclick = close;
    wrap.querySelectorAll("[data-mk]").forEach((b) => b.onclick = () => {
      const mode = b.dataset.mk;
      if (mode === "note") createNoteFromText(text);
      else if (mode === "list") createChecklistFromText(text);
      else { text.split(/\n\s*\n/).map((s) => s.trim()).filter(Boolean).forEach((bl) => createNoteFromText(bl)); }
      saveBrainDumpNow();
      closeSettings(); // leave brain dump, reveal the new note(s)
      toast("Added ✓ — your dump is still saved");
    });
  }

  // ---- streaks & daily wins ----
  let stats = { days: {}, xp: 0 };
  const XP_PER = 12;                 // points earned per task checked off
  const XP_PER_LEVEL = 100;          // points needed to gain a level
  function levelFor(xp) { return Math.floor((xp || 0) / XP_PER_LEVEL) + 1; }
  function loadStats() { try { const r = localStorage.getItem(STATS_KEY); if (r) stats = { days: {}, xp: 0, ...JSON.parse(r) }; } catch (e) {} }
  function saveStats() { try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); syncSoon(); } catch (e) {} }
  function todayKeyAt(d) { return d.toLocaleDateString("en-CA"); }
  // "Weekly wins" recap uses its own fixed Monday-aligned week — separate
  // from any individual routine's own custom reset schedule below.
  function weekKeyAt(d0) { const d = new Date(d0); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return "W" + d.toLocaleDateString("en-CA"); }
  function todayKey() { return todayKeyAt(new Date()); }
  function weekKey() { return weekKeyAt(new Date()); }

  // ---- routine reset/reminder schedules ----
  // Each routine note (and template) can carry its own schedule instead of
  // always resetting at midnight on a fixed calendar boundary:
  //   resetTime  "HH:MM" 24h — when in the day it resets. Default "00:00"
  //              (midnight) matches the original always-midnight behavior

fB1KbZ+oAqmVP/bbMVzjLoJPnIADWvAAAA",
  };
  // ---- today's routines, shown right on the Pet page ----
  function petTodaysRoutines() { return notes.filter((n) => n.kind === "checklist" && n.repeat && n.repeat !== "none" && !n.deleted); }
  function petTaskRowHTML(n) {
    const items = n.items || [];
    const done = items.length > 0 && items.every(itemDone);
    const doneCount = items.filter(itemDone).length;
    let m = null; try { m = (n.title || "").match(/^(\p{Extended_Pictographic}️?)\s*/u); } catch (e) {}
    const icon = m ? m[1] : "🔁";
    const title = m ? n.title.slice(m[0].length).trim() : (n.title || "Untitled");
    const desc = items.length ? items.slice(0, 2).map((i) => esc(i.text || "…")).join(" · ") + (items.length > 2 ? "…" : "") : "No steps yet";
    const tag = done ? "Done today" : (items.length ? doneCount + "/" + items.length : "To do");
    return `<div class="pet-task-row">
      <button class="pet-task-check ${done ? "done" : ""}" data-routineid="${n.id}" aria-label="Mark today done">${done ? "✓" : ""}</button>
      <div class="pet-task-body" data-opennote="${n.id}">
        <div class="pet-task-top"><span class="pet-task-title">${icon} ${esc(title)}</span><span class="pet-task-tag ${done ? "done" : "pending"}">${tag}</span></div>
        <div class="pet-task-desc">${desc}</div>
      </div>
    </div>`;
  }
  function petToggleRoutine(id) {
    const n = notes.find((x) => x.id === id); if (!n || !(n.items || []).length) return;
    const wasAllDone = n.items.every(itemDone);
    const nowDone = !wasAllDone;
    n.items.forEach((it) => { it.checked = nowDone; if (it.sub && it.sub.length) it.sub.forEach((s) => (s.checked = nowDone)); });
    touch(n); saveSoon();
    if (nowDone) bumpStat();
    markRoutineDay(n);
    if (nowDone) { playChime(); celebrate(); }
    refreshCard(n.id);
    renderPet();
  }
  function renderPet() {
    const page = $("#petPage"); if (!page) return;
    const state = petState();
    const name = prefs.petName || "Chip";
    const dayHash = tagHash(todayKey());
    const msg = state === "asleep" ? PET_ASLEEP_MSGS[dayHash % PET_ASLEEP_MSGS.length] : PET_AWAKE_MSGS[dayHash % PET_AWAKE_MSGS.length];
    const routines = petTodaysRoutines();
    const tasksHTML = `<div class="pet-tasks"><div class="pet-tasks-title">Today's routines</div>${
      routines.length ? routines.map(petTaskRowHTML).join("") : `<div class="pet-empty-tasks">No routines yet — add one from ☰ → Routines.</div>`
    }</div>`;
    page.innerHTML = `
      <div class="pet-scene" data-mood="${state}" id="petScene">
        <div class="pet-hero">
          <img class="pet-photo" id="petPhoto" src="${PET_IMG[state]}" alt="${esc(name)} the squirrel" />
          <div class="pet-glow"><span></span></div>
          ${state === "asleep" ? `<span class="pet-zzz z1">z</span><span class="pet-zzz z2">z</span>` : ""}
          <div class="pet-hero-fade"></div>
        </div>
        <div class="pet-namewrap"><input class="pet-name" id="petNameInput" value="${esc(name)}" maxlength="18" aria-label="Pet's name" /></div>
        <div class="pet-mood-label">${petMoodLabel(state, esc(name))}</div>
        <div class="pet-stat-row"><span class="pet-stat-pill">🔥 ${streakCount()}-day streak</span><span class="pet-stat-pill">⭐ Lv ${levelFor(stats.xp || 0)}</span></div>
        <button class="pet-action-btn" id="petPetBtn">${state === "asleep" ? `🤫 Let ${esc(name)} rest` : "👋 Give a pat"}</button>
        <div class="pet-msg">${esc(msg)}</div>
        ${tasksHTML}
      </div>`;
    const scene = $("#petScene");
    const photo = $("#petPhoto");
    let stirT = null;
    const stir = () => {
      scene.classList.add("stir");
      if (photo) photo.src = PET_IMG.stir;
      clearTimeout(stirT);
      stirT = setTimeout(() => { scene.classList.remove("stir"); if (photo) photo.src = PET_IMG[state]; }, 1300);
    };
    scene.addEventListener("click", (e) => {
      if (e.target.closest("#petNameInput, #petPetBtn, [data-routineid], [data-opennote]")) return;
      stir();
    });
    const nameInput = $("#petNameInput");
    if (nameInput) nameInput.addEventListener("change", () => { prefs.petName = nameInput.value.trim() || "Chip"; savePrefs(); renderPet(); });
    const petBtn = $("#petPetBtn"); if (petBtn) petBtn.onclick = () => { stir(); playChime(); };
    scene.querySelectorAll("[data-routineid]").forEach((el) => el.addEventListener("click", (e) => { e.stopPropagation(); petToggleRoutine(el.dataset.routineid); }));
    scene.querySelectorAll("[data-opennote]").forEach((el) => el.addEventListener("click", (e) => {
      e.stopPropagation(); selectedId = el.dataset.opennote; showPage("notes"); renderList(); renderEditor(); setSelectedFlag();
    }));
  }
  // Notes and Pet are two full-screen pages; only one is ever mounted, so
  // there's no scenario where completing a task happens while Pet is showing
  // — renderPet() just recomputes fresh each time you switch to it.
  function showPage(page) {
    const isPet = page === "pet";
    $("#app").style.display = isPet ? "none" : "";
    $("#petPage").style.display = isPet ? "flex" : "none";
    $("#fab").style.display = isPet || selecting ? "none" : "";
    $("#tabNotes").classList.toggle("on", !isPet);
    $("#tabPet").classList.toggle("on", isPet);
    if (isPet) renderPet();
  }
  // A soft, non-alarming dot on the Pet tab when asleep — informational, not
  // a notification demanding attention (no count, no red, no pulsing).
  function updatePetTabBadge() {
    const tab = $("#tabPet"); if (!tab) return;
    const existing = tab.querySelector(".tab-dot"); if (existing) existing.remove();
    if (petState() === "asleep") { const dot = document.createElement("span"); dot.className = "tab-dot"; tab.appendChild(dot); }
  }

  // brief celebratory toast (level-ups, etc.)
  let toastT = null;
  function toast(msg) {
    let el = document.querySelector(".toast.info");
    if (!el) { el = document.createElement("div"); el.className = "toast info"; document.body.appendChild(el); }
    el.textContent = msg;
    requestAnimationFrame(() => el.classList.add("show"));
    clearTimeout(toastT);
    toastT = setTimeout(() => { el.classList.remove("show"); }, 2600);
  }

  // ---- daily affirmation ----
  let affirmShuffle = 0;
  function affirmationList() {
    const custom = (prefs.affirmList || "").split(/\n+/).map((s) => s.trim()).filter(Boolean);
    return custom.length ? custom : DEFAULT_AFFIRMATIONS;
  }
  function renderAffirmation() {
    const el = $("#affirm"); if (!el) return;
    const list = affirmationList();
    if (!prefs.affirmations || !list.length || prefs.affirmDismissed === todayKey()) { el.innerHTML = ""; return; }
    const dayNum = Math.floor(new Date(todayKey()).getTime() / 86400000) || 0;
    const idx = (((dayNum + affirmShuffle) % list.length) + list.length) % list.length;
    el.innerHTML = `<div class="affirm-card"><span class="affirm-text">${esc(list[idx])}</span><div class="affirm-btns"><button class="affirm-btn" id="affirmShuffle" title="Another one">🔀</button><button class="affirm-btn" id="affirmClose" title="Hide for today">✕</button></div></div>`;
    $("#affirmShuffle").onclick = () => { affirmShuffle++; renderAffirmation(); };
    $("#affirmClose").onclick = () => { prefs.affirmDismissed = todayKey(); savePrefs(); renderAffirmation(); };
  }
  function openAffirmEditor() {
    const root = $("#modalRoot");
    const cur = (prefs.affirmList || "").trim() || DEFAULT_AFFIRMATIONS.join("\n");
    root.innerHTML = `<div class="scrim" id="affScrim"></div>
      <div class="qc" style="max-width:460px">
        <h2 style="justify-content:center">🌱 Your affirmations</h2>
        <p class="fineprint" style="margin:0;text-align:center">One per line — a different one greets you each day. Write your own or keep these.</p>
        <textarea id="affText" style="min-height:230px"></textarea>
        <div class="qc-row"><button class="btn-sm" id="affReset">↺ Defaults</button><span style="flex:1"></span><button class="btn-sm" id="affCancel">Cancel</button><button class="btn-sm accent" id="affSave">Save</button></div>
      </div>`;
    $("#affText").value = cur;
    $("#affScrim").onclick = closeSettings;
    $("#affCancel").onclick = openSettings;
    $("#affReset").onclick = () => { $("#affText").value = DEFAULT_AFFIRMATIONS.join("\n"); };
    $("#affSave").onclick = () => {
      const v = $("#affText").value.trim();
      prefs.affirmList = (v === DEFAULT_AFFIRMATIONS.join("\n")) ? "" : v;
      prefs.affirmDismissed = null; savePrefs(); renderAffirmation(); openSettings();
    };
    setTimeout(() => $("#affText").focus(), 40);
  }

  // ---- weekly wins recap ----
  const DOW = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
  function openWins() {
    const days = stats.days || {};
    const today = new Date(), todayK = todayKey();
    const week = [];
    let total = 0, best = 0;
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today); d.setDate(today.getDate() - i);
      const c = days[d.toLocaleDateString("en-CA")] || 0;
      total += c; if (c > best) best = c;
      week.push({ d, c, key: d.toLocaleDateString("en-CA") });
    }
    const max = Math.max(1, ...week.map((w) => w.c));
    const bars = week.map((w) => `<div class="wk-col"><div class="wk-n">${w.c || ""}</div><div class="wk-bar ${w.key === todayK ? "today" : ""}" style="height:${Math.round((w.c / max) * 100)}%"></div><div class="wk-lbl">${DOW[w.d.getDay()]}</div></div>`).join("");
    const streak = streakCount();
    const headline = total === 0
      ? "A fresh week 🌱<br>Tick something off to get rolling."
      : `You gathered <b>${total}</b> acorn${total === 1 ? "" : "s"} this week 🎉`;
    const root = $("#modalRoot");
    root.innerHTML = `<div class="scrim" id="winsScrim"></div>
      <div class="qc" style="text-align:center;max-width:420px">
        <h2 style="justify-content:center">🏆 Weekly wins</h2>
        <p style="margin:.1rem 0 .2rem;font-size:1.02rem;line-height:1.5">${headline}</p>
        <div class="wk-chart">${bars}</div>
        <div class="wk-stats"><span>🔥 ${streak}-day streak</span><span>⭐ best day: ${best}</span></div>
        <button class="btn-sm accent" id="winsClose" style="align-self:center;margin-top:.5rem">${total ? "Nice! 🌰" : "Let's go"}</button>
      </div>`;
